<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fang Flight</title>
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
<style>
  :root { --ink: #1a0f24; --gold: #ffc531; --gold-d: #e39a12; --red: #d3203f; --red-d: #8e0f26; --violet: #7a3cff; --green: #36c46b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #140c1f; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: #fff; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 16px; overflow-y: auto; }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; }
  .pill { background: rgba(14,6,22,.72); color: #fff; border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; }
  .drop { width: 16px; height: 20px; flex: none; display: inline-block; background: radial-gradient(circle at 38% 62%, #ff8fa0, #e01b3c 45%, #8e0f26);
          border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; clip-path: polygon(50% 0, 82% 38%, 100% 62%, 92% 85%, 70% 100%, 30% 100%, 8% 85%, 0 62%, 18% 38%); }
  .topbar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }

  /* Menu */
  #menu { justify-content: space-between; pointer-events: none; }
  #menu > * { pointer-events: auto; }
  .title { text-align: center; margin-top: 2vh; pointer-events: none !important; }
  .title h1 { margin: 0; font-size: clamp(46px, 14vw, 84px); line-height: .88; font-weight: 900; color: #fff; letter-spacing: 1px;
    -webkit-text-stroke: 3px #2a0712; paint-order: stroke fill; text-shadow: 0 6px 0 #2a0712, 0 0 26px rgba(230,30,60,.55); }
  .title h1 span { color: #ff3552; }
  .title .stage { margin-top: 14px; display: inline-block; background: var(--red); color: #fff; font-weight: 900; padding: 6px 16px; border-radius: 10px; box-shadow: 0 4px 0 var(--red-d); }
  .bottom { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-bottom: 8px; }
  .play { width: min(360px, 90%); padding: 18px; font-size: 26px; font-weight: 900; color: #fff; background: var(--red); border-radius: 18px; box-shadow: 0 6px 0 var(--red-d); animation: pulse 1.2s infinite; }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-d); }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .shopBtn { background: var(--violet); color: #fff; font-weight: 900; padding: 12px 34px; border-radius: 14px; box-shadow: 0 5px 0 #4a1fb0; font-size: 17px; position: relative; }
  .home { color: #fff; opacity: .75; font-weight: 800; font-size: 14px; text-decoration: none; padding: 4px 10px; }
  .badge { position: absolute; top: -8px; right: -8px; background: var(--gold); color: var(--ink); border-radius: 999px; font-size: 12px; padding: 2px 7px; }

  /* Shop */
  #shop { background: #1d1229; }
  #shop h2 { margin: 8px 0; font-size: 30px; font-weight: 900; }
  .tabs { display: flex; gap: 6px; width: 100%; max-width: 520px; margin-bottom: 8px; }
  .tab { flex: 1; padding: 9px 4px; border-radius: 10px; background: #33224a; font-weight: 900; font-size: 13px; box-shadow: 0 3px 0 #120a1c; }
  .tab.on { background: var(--red); box-shadow: 0 3px 0 var(--red-d); }
  .hint { font-size: 13px; opacity: .7; margin-bottom: 10px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 520px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: #2d1e40; border-radius: 16px; padding: 10px; text-align: center; box-shadow: 0 4px 0 #120a1c; display: flex; flex-direction: column; gap: 6px; align-items: center; border: 3px solid transparent; }
  .card.eq { border-color: var(--gold); }
  .card canvas { width: 100%; height: 100px; border-radius: 10px; }
  .card .em { font-size: 48px; line-height: 84px; height: 84px; }
  .card .nm { font-weight: 900; }
  .card .ds { font-size: 12px; opacity: .7; min-height: 30px; }
  .card .lv { font-size: 12px; font-weight: 900; background: #ffe7a8; color: var(--ink); border-radius: 6px; padding: 1px 8px; }
  .card button { width: 100%; padding: 8px; border-radius: 10px; font-weight: 900; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .b-buy { background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 var(--gold-d); }
  .b-buy.poor { background: #4a3d5a; box-shadow: 0 3px 0 #2a2036; color: #a99bb8; }
  .b-eq { background: var(--violet); box-shadow: 0 3px 0 #4a1fb0; }
  .b-on { background: var(--green); }
  .b-lock { background: #120a1c; font-size: 12px; }
  .back { margin: 16px 0; background: #fff; color: var(--ink); font-weight: 900; padding: 12px 36px; border-radius: 14px; }

  /* Result */
  #result { background: rgba(14,6,22,.88); justify-content: center; gap: 12px; text-align: center; }
  #result h2 { margin: 0; font-size: clamp(30px, 9vw, 46px); font-weight: 900; color: #ff4d66; -webkit-text-stroke: 2px #4a0614; paint-order: stroke fill; }
  #result .sub { font-weight: 800; opacity: .85; }
  .dist { font-size: clamp(54px, 18vw, 86px); font-weight: 900; line-height: 1; }
  .rec { background: var(--gold); color: var(--ink); font-weight: 900; border-radius: 10px; padding: 4px 14px; animation: pulse .8s infinite; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .stat { background: rgba(255,255,255,.1); border-radius: 12px; padding: 8px 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .unlock { background: var(--violet); border-radius: 12px; padding: 8px 14px; font-weight: 800; }
  .menuBtn { background: transparent; color: #fff; opacity: .8; font-weight: 800; padding: 8px; text-decoration: underline; }
  .cont { background: var(--red); font-weight: 900; font-size: 20px; padding: 14px 40px; border-radius: 16px; box-shadow: 0 5px 0 var(--red-d); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen">
  <div class="topbar">
    <div class="pill" id="mBest"></div>
    <div class="pill"><span class="drop"></span><span id="mCoins">0</span></div>
  </div>
  <div class="title">
    <h1>FANG<br><span>FLIGHT</span></h1>
    <div class="stage" id="mBoss"></div>
  </div>
  <div class="bottom">
    <button class="play" id="playBtn"></button>
    <button class="shopBtn" id="shopBtn"><span id="shopLbl"></span><span class="badge hidden" id="shopBadge">!</span></button>
    <a class="home hidden" id="homeLink" href="../">← All games</a>
  </div>
</div>

<div id="shop" class="screen hidden">
  <div class="topbar"><span></span><div class="pill"><span class="drop"></span><span id="sCoins">0</span></div></div>
  <h2 id="shopTitle"></h2>
  <div class="tabs" id="tabs"></div>
  <div class="hint" id="shopHint"></div>
  <div class="grid" id="grid"></div>
  <button class="back" id="shopBack"></button>
</div>

<div id="result" class="screen hidden">
  <h2 id="rTitle"></h2>
  <div class="dist" id="rDist">0 m</div>
  <div class="rec hidden" id="rRec"></div>
  <div class="sub" id="rBest"></div>
  <div class="stats">
    <div class="stat"><span class="drop"></span><span id="rCoins">0</span></div>
    <div class="stat" id="rBosses"></div>
  </div>
  <div class="unlock hidden" id="rUnlock"></div>
  <button class="cont" id="contBtn"></button>
  <button class="menuBtn" id="menuBtn"></button>
</div>

<script>
(() => {
  'use strict';

  // ---------- Localization ----------
  const STRINGS = {
    en: { play: 'PLAY', shop: 'SHOP', back: 'BACK', best: 'BEST', hunter: 'HUNTER', hint: 'Defeat hunters to unlock more', vamps: 'Vampires', capes: 'Capes', upgrades: 'Upgrades',
          equip: 'EQUIP', equipped: 'EQUIPPED', beat: 'Beat hunter #', free: 'FREE', max: 'MAX', hold: 'HOLD TO FLY', bitten: 'BITTEN!', vampire: 'VAMPIRE!',
          incoming: 'HUNTER INCOMING', grab: 'Grab blood orbs to send your bats!', defeated: 'HUNTER DEFEATED!', escaped: 'HE ESCAPED!', shieldUp: 'BAT GUARD!', shieldLost: 'GUARD BROKEN',
          magnet: 'BLOOD MAGNET!', retry: 'TRY AGAIN', menu: 'Menu', newRec: 'NEW RECORD!', bosses: 'Hunters', unlocked: 'Unlocked: ', next: 'Next hunter',
          d_zap: 'ZAPPED BY GARLIC!', d_stake: 'STAKED!', d_sun: 'BURNED BY SUNLIGHT!',
          u_magnet: 'Blood magnet', u_magnet_d: 'Magnet lasts +1.5 s', u_shield: 'Bat guard', u_shield_d: 'Start with +1 guard', u_value: 'Rich blood', u_value_d: '+10% blood per drop',
          u_bats: 'Bat swarm', u_bats_d: '+25% damage to hunters', u_time: 'Long night', u_time_d: '+2 s to beat hunters' },
    es: { play: 'JUGAR', shop: 'TIENDA', back: 'VOLVER', best: 'RÉCORD', hunter: 'CAZADOR', hint: 'Derrota cazadores para desbloquear más', vamps: 'Vampiros', capes: 'Capas', upgrades: 'Mejoras',
          equip: 'USAR', equipped: 'EN USO', beat: 'Vence al cazador #', free: 'GRATIS', max: 'MÁX', hold: 'MANTÉN PARA VOLAR', bitten: '¡MORDIDO!', vampire: '¡VAMPIRO!',
          incoming: 'LLEGA EL CAZADOR', grab: '¡Toma orbes de sangre para lanzar murciélagos!', defeated: '¡CAZADOR DERROTADO!', escaped: '¡SE ESCAPÓ!', shieldUp: '¡GUARDIA MURCIÉLAGO!', shieldLost: 'GUARDIA ROTA',
          magnet: '¡IMÁN DE SANGRE!', retry: 'REINTENTAR', menu: 'Menú', newRec: '¡NUEVO RÉCORD!', bosses: 'Cazadores', unlocked: 'Desbloqueado: ', next: 'Próximo cazador',
          d_zap: '¡ELECTROCUTADO POR AJO!', d_stake: '¡ESTACADO!', d_sun: '¡QUEMADO POR EL SOL!',
          u_magnet: 'Imán de sangre', u_magnet_d: 'El imán dura +1.5 s', u_shield: 'Guardia murciélago', u_shield_d: 'Empieza con +1 guardia', u_value: 'Sangre rica', u_value_d: '+10% de sangre por gota',
          u_bats: 'Enjambre', u_bats_d: '+25% de daño a cazadores', u_time: 'Noche larga', u_time_d: '+2 s para vencer cazadores' },
    pt: { play: 'JOGAR', shop: 'LOJA', back: 'VOLTAR', best: 'RECORDE', hunter: 'CAÇADOR', hint: 'Derrote caçadores para desbloquear mais', vamps: 'Vampiros', capes: 'Capas', upgrades: 'Melhorias',
          equip: 'USAR', equipped: 'EM USO', beat: 'Vença o caçador #', free: 'GRÁTIS', max: 'MÁX', hold: 'SEGURE PARA VOAR', bitten: 'MORDIDO!', vampire: 'VAMPIRO!',
          incoming: 'CAÇADOR CHEGANDO', grab: 'Pegue orbes de sangue para lançar morcegos!', defeated: 'CAÇADOR DERROTADO!', escaped: 'ELE FUGIU!', shieldUp: 'GUARDA MORCEGO!', shieldLost: 'GUARDA QUEBRADA',
          magnet: 'ÍMÃ DE SANGUE!', retry: 'TENTAR DE NOVO', menu: 'Menu', newRec: 'NOVO RECORDE!', bosses: 'Caçadores', unlocked: 'Desbloqueado: ', next: 'Próximo caçador',
          d_zap: 'ELETROCUTADO POR ALHO!', d_stake: 'ESTACADO!', d_sun: 'QUEIMADO PELO SOL!',
          u_magnet: 'Ímã de sangue', u_magnet_d: 'O ímã dura +1.5 s', u_shield: 'Guarda morcego', u_shield_d: 'Comece com +1 guarda', u_value: 'Sangue rico', u_value_d: '+10% de sangue por gota',
          u_bats: 'Enxame', u_bats_d: '+25% de dano aos caçadores', u_time: 'Noite longa', u_time_d: '+2 s para vencer caçadores' },
  };
  let T = STRINGS.en;

  // ---------- Content ----------
  const HUMAN = { skin: '#f2c49b', hair: '#6b3e1e', suit: '#4a8fd8', pants: '#34457a' };
  const VAMPS = [
    { id: 'count',     name: 'Count',      boss: 0, cost: 0,    skin: '#eee4f2', hair: '#1b1324', style: 'slick',  suit: '#221d33', pants: '#16131f' },
    { id: 'countess',  name: 'Countess',   boss: 0, cost: 300,  skin: '#f6e2ea', hair: '#2a0b22', style: 'long',   suit: '#5a1d6a', pants: '#3a1248' },
    { id: 'punk',      name: 'Punk',       boss: 1, cost: 800,  skin: '#e9e3f6', hair: '#ff3ea5', style: 'mohawk', suit: '#2b2b30', pants: '#3b3b55' },
    { id: 'prince',    name: 'Prince',     boss: 2, cost: 1600, skin: '#f7ecef', hair: '#ffd76a', style: 'swoop',  suit: '#eeeef6', pants: '#c9c9dc' },
    { id: 'nosferatu', name: 'Nosferatu',  boss: 3, cost: 3200, skin: '#b8c7a6', hair: '#000000', style: 'bald',   suit: '#2a2d22', pants: '#1f2219', ear: 1.8 },
    { id: 'golden',    name: 'Golden Lord',boss: 5, cost: 6500, skin: '#f2e6ff', hair: '#ffffff', style: 'slick',  suit: '#d9a520', pants: '#9c6c0c' },
  ];
  const CAPES = [
    { id: 'classic',  name: 'Classic',  boss: 0, cost: 0,     out: '#16111c', inn: '#c3122f' },
    { id: 'blood',    name: 'Blood',    boss: 0, cost: 200,   out: '#a50f27', inn: '#1c0a10' },
    { id: 'royal',    name: 'Royal',    boss: 1, cost: 500,   out: '#4b1a7a', inn: '#ffcc33' },
    { id: 'midnight', name: 'Midnight', boss: 1, cost: 1000,  out: '#16235a', inn: '#48d1ff' },
    { id: 'ghost',    name: 'Ghost',    boss: 2, cost: 2000,  out: '#e8e8f2', inn: '#7d7da0' },
    { id: 'inferno',  name: 'Inferno',  boss: 3, cost: 3500,  out: '#d4471a', inn: '#ffd23a' },
    { id: 'emerald',  name: 'Emerald',  boss: 4, cost: 6000,  out: '#0f5a3a', inn: '#9bff6a' },
    { id: 'galaxy',   name: 'Galaxy',   boss: 6, cost: 10000, out: '#1a1050', inn: '#ff6ad5', stars: true },
  ];
  // Each level costs ~1.85x the previous one.
  const UPGRADES = [
    { id: 'magnet', icon: '🧲', base: 60,  max: 8 },
    { id: 'value',  icon: '🩸', base: 80,  max: 10 },
    { id: 'bats',   icon: '🦇', base: 90,  max: 8 },
    { id: 'time',   icon: '🌙', base: 150, max: 5 },
    { id: 'shield', icon: '🛡️', base: 300, max: 3 },
  ];

  // ---------- Save (Bridge storage) ----------
  let save = { coins: 0, bosses: 0, best: 0, owned: { vamps: ['count'], capes: ['classic'] }, eq: { vamps: 'count', capes: 'classic' },
               up: { magnet: 0, value: 0, bats: 0, time: 0, shield: 0 }, seen: 4 };
  let B = null;
  const send = (msg) => { try { B && B.platform.sendMessage(msg); } catch (e) {} };
  function persist() { if (B) B.storage.set(['fang_flight'], [JSON.stringify(save)]).catch(() => {}); }
  async function load() {
    if (!B) return;
    try {
      const d = await B.storage.get(['fang_flight']);
      if (d[0]) {
        const s = typeof d[0] === 'string' ? JSON.parse(d[0]) : d[0];
        save = Object.assign(save, s, {
          owned: Object.assign({}, save.owned, s.owned || {}), eq: Object.assign({}, save.eq, s.eq || {}), up: Object.assign({}, save.up, s.up || {}),
        });
      }
    } catch (e) {}
  }
  const CATS = { vamps: VAMPS, capes: CAPES };
  const byId = (cat, id) => CATS[cat].find(x => x.id === id) || CATS[cat][0];
  const upCost = (u) => Math.round(u.base * Math.pow(1.85, save.up[u.id]) / 10) * 10;
  const unlockedCount = () => Object.values(CATS).reduce((n, list) => n + list.filter(x => save.bosses >= x.boss).length, 0);

  // ---------- Helpers ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const hash = (i, s) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (a, b, k) => { if (k <= 0) return a; if (k >= 1) return b; const A = hex(a), Bc = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, Bc[i], k))).join(',')})`; };
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
    const t = clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
    return Math.hypot(px - ax - t * dx, py - ay - t * dy);
  }

  // Soft pre-rendered glow sprites (no flat shapes for light and mist).
  const glowCache = {};
  function glow(col) {
    if (glowCache[col]) return glowCache[col];
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), [r, gg, b] = hex(col);
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${gg},${b},1)`); gr.addColorStop(0.45, `rgba(${r},${gg},${b},.45)`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return (glowCache[col] = c);
  }
  function blit(c, col, x, y, r, a) { if (a <= 0 || r <= 0) return; c.globalAlpha = a; c.drawImage(glow(col), x - r, y - r, r * 2, r * 2); c.globalAlpha = 1; }

  // ---------- Canvas & world ----------
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, U = 6, FT = 0, FB = 0;
  // World: x in units (camX scrolls), y in units 0 (ceiling) .. 100 (floor). Screen y = FT + y * U.
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    U = Math.min(H * 0.78 / 100, W / 58);
    FB = H - Math.max(H * 0.1, 40);
    FT = FB - 100 * U;
  }
  const VW = () => W / U;
  const PXu = () => clamp(VW() * 0.22, 12, 34); // player's screen x, in units
  const sy = (y) => FT + y * U;

  // ---------- State ----------
  const G = 190, THRUST = 410, MPU = 0.8; // gravity, lift, meters per unit
  let phase = 'menu'; // menu | intro | run | dead | result
  let me = null, camX = 0, speed = 0, holding = false, time = 0, lastT = 0, paused = false, audioOn = true, shake = 0, flash = 0;
  let zaps = [], drops = [], pickups = [], stakes = [], beams = [], events = [], orbs = [], bats = [], parts = [], popups = [];
  let nextX = 0, stakeT = 0, introT = 0, deadT = 0, killer = '', runCoins = 0, runBosses = 0, chain = 0, chainT = 0, flapT = 0, hintT = 0;
  let boss = null, bossNext = 1000, bossPending = false, banner = null, world = 0, worldFade = 0, prevWorld = 0, menuBob = 0, unlockNews = [];

  const dist = () => Math.floor(camX * MPU);
  const valMul = () => 1 + save.up.value * 0.1;
  const magnetDur = () => 6 + save.up.magnet * 1.5;
  const batMul = () => 1 + save.up.bats * 0.25;
  const bossTime = () => 20 + save.up.time * 2;
  const vamp = () => byId('vamps', save.eq.vamps);
  const cape = () => byId('capes', save.eq.capes);

  function newRun() {
    me = { y: 100, vy: 0, alive: true, shield: save.up.shield, inv: 0, magnet: 0, run: 0, k: 0, rot: 0, spin: 0, hurt: 0, blink: 0, flyK: 0, x: -14 };
    camX = 0; speed = 0; nextX = VW() + 30; stakeT = 6; deadT = 0; killer = ''; runCoins = 0; runBosses = 0; chain = 0;
    zaps = []; drops = []; pickups = []; stakes = []; beams = []; events = []; orbs = []; bats = []; parts = []; popups = []; unlockNews = [];
    boss = null; bossNext = 1000; bossPending = false; banner = null; world = 0; prevWorld = 0; worldFade = 0; hintT = 0;
    phase = 'intro'; introT = 0;
    send('level_started');
  }

  // ---------- Spawner ----------
  const COIN_SP = 3.4;
  function coinShape(kind, x0, y0, n) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const x = x0 + i * COIN_SP;
      if (kind === 'line') pts.push([x, y0]);
      else if (kind === 'wave') pts.push([x, y0 + Math.sin(i * 0.55) * 9]);
      else if (kind === 'arc') pts.push([x, y0 - Math.sin(i / (n - 1) * Math.PI) * 16]);
      else if (kind === 'diag') pts.push([x, y0 - i * 2.2]);
      else if (kind === 'block') { for (let r = 0; r < 3; r++) pts.push([x, y0 + (r - 1) * 3.6]); }
    }
    return pts;
  }
  function addCoins(pts, avoid) {
    for (const [x, y] of pts) {
      if (y < 8 || y > 97) continue;
      if (avoid && zaps.some(z => z.x > x - 40 && z.x < x + 40 && (z.rot ? Math.hypot(x - z.x, y - z.y) < z.len / 2 + 6 : segDist(x, y, ...zEnds(z)) < 6.5))) continue;
      drops.push({ x, y, ph: Math.random() * 6 });
    }
  }
  function zEnds(z) { const c = Math.cos(z.ang) * z.len / 2, s = Math.sin(z.ang) * z.len / 2; return [z.x - c, z.y - s, z.x + c, z.y + s]; }

  function spawnChunk() {
    const d = nextX * MPU, L = clamp(d / 1600, 0, 1);
    const r = Math.random();
    if (d < 120 || r < 0.34) { // coins
      const kinds = ['line', 'wave', 'arc', 'diag', 'block'], kind = kinds[(Math.random() * kinds.length) | 0];
      const n = kind === 'block' ? 7 : 10 + ((Math.random() * 7) | 0);
      const y0 = kind === 'arc' ? rnd(40, 95) : kind === 'diag' ? rnd(65, 95) : rnd(18, 92);
      addCoins(coinShape(kind, nextX, y0, n), false);
      if (Math.random() < 0.22 && d > 150) pickups.push({ x: nextX + n * COIN_SP * 0.5, y: clamp(y0 - 14, 15, 85), kind: Math.random() < 0.5 ? 'shield' : 'magnet', ph: 0 });
      nextX += n * COIN_SP + rnd(10, 18) - L * 5;
    } else if (d > 450 && r > 0.86 && !events.length) { // sunlight volley
      const sets = [[30], [70], [92], [20, 60], [45, 92], [15, 50, 92], [30, 70]];
      const set = sets[(Math.random() * Math.min(sets.length, 3 + L * 5)) | 0];
      const wgap = Math.max(speed, 26) * 3.4;
      events.push({ x: nextX, fire: () => { for (const y of set) beams.push({ y, h: 11, t: 0, warn: 1.25, on: 0.95 }); sfx.warn(); } });
      nextX += wgap;
    } else { // garlic zappers
      // the first stretch is gentle: single, short zappers
      const count = 1 + (d > 400 && Math.random() < L + 0.2 ? 1 : 0) + (d > 900 && Math.random() < L * 0.6 ? 1 : 0);
      const gap = rnd(24, 32) - L * 4;
      for (let i = 0; i < count; i++) {
        const angs = [0, Math.PI / 2, Math.PI / 4, -Math.PI / 4];
        const z = { x: nextX + i * gap + 8, ang: angs[(Math.random() * angs.length) | 0], len: rnd(11, 15 + L * 16), rot: 0, y: 0 };
        if (d > 300 && Math.random() < 0.18 + L * 0.25) { z.rot = rnd(0.9, 1.6) * (Math.random() < 0.5 ? -1 : 1); z.len = Math.min(z.len, 24); }
        const ext = z.rot ? z.len / 2 : Math.abs(Math.sin(z.ang)) * z.len / 2;
        z.y = rnd(10 + ext, 97 - ext);
        zaps.push(z);
      }
      const w = count * gap + 10;
      addCoins(coinShape('wave', nextX, rnd(20, 90), Math.floor(w / COIN_SP)), true);
      nextX += w + rnd(8, 16) - L * 5;
    }
  }

  // ---------- Hits ----------
  function hurt(kind) {
    if (!me.alive || me.inv > 0) return;
    if (me.shield > 0) {
      me.shield--; me.inv = 1.3; me.hurt = 0.4;
      burstBats(PXu() * U, sy(me.y - 5.5), 12);
      popup(T.shieldLost, '#b99bff'); sfx.shield(); buzz(30); shake = 8;
      return;
    }
    me.alive = false; killer = kind; phase = 'dead'; deadT = 0;
    me.vy = -55; me.spin = 7;
    const x = PXu() * U, y = sy(me.y - 5.5);
    if (kind === 'zap') { flash = 0.5; for (let i = 0; i < 26; i++) spark(x, y, '#f4ffb0'); }
    else if (kind === 'sun') { flash = 0.4; for (let i = 0; i < 20; i++) parts.push({ k: 'glow', col: '#4a3a40', x: x + rnd(-20, 20), y, vx: rnd(-40, 40), vy: rnd(-120, -40), t: 0, life: rnd(0.8, 1.4), r0: 8, r1: 30, a: 0.6 }); }
    else { for (let i = 0; i < 14; i++) spark(x, y, '#ff3552'); }
    shake = 16; sfx.death(kind); buzz([40, 60, 80]);
    send('level_failed');
  }

  // ---------- Boss: the hunter's airship ----------
  function bossPos() { return [VW() - clamp(VW() * 0.34, 21, 36), 26]; }
  function startBoss() {
    const stage = save.bosses + 1;
    const [bx] = bossPos();
    const hp = Math.round(7 + Math.min(stage - 1, 8) * 0.75);
    boss = { stage, x: VW() + 30, y: 30, tx: bx, hp, hpMax: hp, timeLeft: bossTime(), attackT: 3, att: null, hurtT: 0, jolt: 0,
             blink: 0, state: 'enter', st: 0, orbT: 1, rot: 0, vy: 0, last: '' };
    banner = { text: T.incoming, sub: T.grab, t: 0, dur: 2.6, col: '#ff4d66' };
    sfx.bossIntro();
  }
  const BS = 1.3; // hunter airship drawing scale
  function gondola() { return [boss.x - 2.5 * BS, boss.y + 10.6 * BS]; }
  function bossAttack() {
    const kind = boss.last === 'volley' && Math.random() < 0.6 ? 'beam' : (Math.random() < 0.62 ? 'volley' : 'beam');
    boss.last = kind;
    const [gx, gy] = gondola(), py = me.y - 5.5, a0 = Math.atan2(py - gy, PXu() - gx);
    if (kind === 'volley') boss.att = { kind, t: 0, wind: 0.95, aims: [a0 - 0.21, a0, a0 + 0.21] };
    else boss.att = { kind, t: 0, wind: 0.6 };
    sfx.windup();
  }
  function hitBoss(dmg) {
    if (!boss || boss.state !== 'fight') return;
    boss.hp = Math.max(0, boss.hp - dmg); boss.hurtT = 0.35; boss.jolt = 1;
    const x = boss.x * U, y = sy(boss.y);
    ring(x, y, '#ff3552', 1.2);
    popup(`-${Math.round(dmg * 10) / 10}`, '#ff5d73', x, y - 50 * U / 6);
    sfx.bossHit(); shake = Math.max(shake, 7); buzz(15);
    if (boss.hp <= 0) {
      boss.state = 'die'; boss.st = 0; boss.att = null;
      save.bosses++; runBosses++;
      const reward = Math.round((60 + boss.stage * 40) * valMul());
      runCoins += reward;
      unlockNews = [...VAMPS, ...CAPES].filter(i => i.boss === save.bosses).map(i => i.name);
      banner = { text: T.defeated, sub: `+${reward} 🩸` + (unlockNews.length ? `  ·  🔓 ${unlockNews.join(', ')}` : ''), t: 0, dur: 2.6, col: '#ffc531' };
      for (let i = 0; i < 30; i++) parts.push({ k: 'drop', x: x + rnd(-60, 60), y: y + rnd(-30, 30), vx: rnd(-260, 120), vy: rnd(-420, -120), t: 0, life: rnd(0.9, 1.5), r0: 7 });
      shake = 20; flash = 0.35; sfx.bossDown(); buzz([20, 30, 20, 30, 60]);
      persist();
      send('level_completed');
    }
  }
  function endBoss() {
    boss = null; bossPending = false;
    bossNext = (Math.floor(dist() / 1000) + 1) * 1000;
    nextX = camX + VW() + 20; stakeT = 4;
    prevWorld = world; world = (world + 1) % WORLDS.length; worldFade = 1;
  }
  function updateBoss(dt) {
    const b = boss;
    b.st += dt; b.hurtT -= dt; b.jolt *= Math.exp(-dt * 9);
    b.blink -= dt; if (b.blink < -3) b.blink = 0.12;
    const [, by] = bossPos();
    if (b.state === 'enter') {
      b.x = lerp(b.x, b.tx, Math.min(1, dt * 2.2)); b.y = by + Math.sin(time * 1.6) * 3;
      if (b.st > 2.2) { b.state = 'fight'; b.st = 0; }
      return;
    }
    if (b.state === 'fight') {
      b.tx = bossPos()[0]; b.x = lerp(b.x, b.tx, Math.min(1, dt * 3));
      b.y = by + Math.sin(time * 1.6) * 3 + Math.sin(time * 0.7) * 6;
      b.timeLeft -= dt;
      if (me.alive) {
        b.orbT -= dt;
        if (b.orbT <= 0) { b.orbT = rnd(0.95, 1.3); orbs.push({ x: VW() + 4, y: rnd(16, 90), ph: Math.random() * 6, vy: rnd(-6, 6) }); }
        if (b.att) {
          const a = b.att; a.t += dt;
          if (a.t >= a.wind && !a.done) {
            a.done = true;
            const [gx, gy] = gondola();
            if (a.kind === 'volley') { for (const ang of a.aims) stakes.push({ x: gx, y: gy, vx: Math.cos(ang) * 62, vy: Math.sin(ang) * 62, state: 'fly', t: 0 }); sfx.shoot(); }
            else { beams.push({ y: clamp(me.y - 5.5, 12, 94), h: 10, t: 0, warn: 1.3, on: 0.8 }); sfx.warn(); }
          }
          if (a.t > a.wind + 0.4) { b.att = null; b.attackT = Math.max(1.7, 2.9 - b.stage * 0.08); }
        } else { b.attackT -= dt; if (b.attackT <= 0) bossAttack(); }
      }
      if (b.timeLeft <= 0) { b.state = 'escape'; b.st = 0; b.att = null; banner = { text: T.escaped, sub: '', t: 0, dur: 2, col: '#b99bff' }; sfx.laugh(); }
    } else if (b.state === 'escape') {
      b.x += dt * 30; b.y -= dt * 22;
      if (b.st > 2) endBoss();
    } else if (b.state === 'die') {
      b.vy += 40 * dt; b.y += b.vy * dt; b.rot += dt * 0.9; b.x += dt * 6;
      if (Math.random() < dt * 20) parts.push({ k: 'glow', col: '#3a2d33', x: b.x * U + rnd(-40, 40), y: sy(b.y), vx: rnd(-30, 30), vy: rnd(-80, -20), t: 0, life: 1.2, r0: 10, r1: 40, a: 0.55 });
      if (b.st > 2.8) endBoss();
    }
  }

  // ---------- Effects ----------
  function popup(text, color, x, y) { popups.push({ text, color, t: 0, x: x ?? PXu() * U + 30, y: y ?? sy(me ? me.y - 14 : 50) }); if (popups.length > 5) popups.shift(); }
  function spark(x, y, col) { const a = rnd(0, 6.28), v = rnd(120, 420); parts.push({ k: 'dot', col, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, life: rnd(0.35, 0.8), r0: rnd(2, 4.5) }); }
  function ring(x, y, col, s) { parts.push({ k: 'ring', col, x, y, t: 0, life: 0.45, r0: 70 * s * U / 6 }); for (let i = 0; i < 12 * s; i++) spark(x, y, Math.random() < 0.5 ? col : '#ffffff'); }
  function burstBats(x, y, n) { for (let i = 0; i < n; i++) { const a = rnd(0, 6.28), v = rnd(120, 300); parts.push({ k: 'bat', col: '#1a0f24', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 0, life: rnd(0.6, 1.1), r0: rnd(7, 12) * U / 6, ph: Math.random() }); } }

  // ---------- Update ----------
  function update(dt) {
    time += dt;
    menuBob += dt;
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.k === 'dot' || p.k === 'drop') p.vy += 700 * dt; if (p.k === 'glow') { p.vx *= 1 - dt * 1.5; p.vy *= 1 - dt * 1.5; } }
    parts = parts.filter(p => p.t < p.life);
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < 1.1);
    shake = Math.max(0, shake - dt * 40); flash = Math.max(0, flash - dt * 1.6);
    worldFade = Math.max(0, worldFade - dt * 0.6);
    if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }

    if (phase === 'menu' || phase === 'result') { camX += dt * 9; emitTrail(dt, true, PXu() * U * 1.6, sy(71)); return; }
    if (phase === 'intro') return updateIntro(dt);
    if (!me) return;

    // Scroll speed ramps with distance, and dies down once you fall.
    const target = 27 + 15 * (1 - Math.exp(-dist() / 1100));
    if (phase === 'run') speed = lerp(speed, target, Math.min(1, dt * 1.5));
    else speed *= Math.exp(-dt * 1.4);
    camX += speed * dt;
    const px = PXu(), pc = () => me.y - 5.5;

    // Player physics
    if (me.alive) {
      if (holding) me.vy -= THRUST * dt; else me.vy += G * dt;
      me.vy = clamp(me.vy, -62, 80);
      me.y += me.vy * dt;
      if (me.y >= 100) { me.y = 100; me.vy = 0; }
      if (me.y < 12) { me.y = 12; me.vy = Math.max(me.vy, 0); }
      const onGround = me.y >= 99.9;
      me.flyK = lerp(me.flyK, onGround ? 0 : 1, Math.min(1, dt * 10));
      me.run += dt * speed * 0.42;
      me.inv -= dt; me.hurt -= dt; me.magnet -= dt;
      me.blink -= dt; if (me.blink < -3.4) me.blink = 0.12;
      if (holding) { flapT -= dt; if (flapT <= 0) { flapT = 0.17; sfx.flap(); } }
      if (holding && hintT < 1) hintT += dt;
      emitTrail(dt, holding, px * U, sy(me.y - 1.5));
    } else {
      me.vy += G * 1.2 * dt; me.y += me.vy * dt; me.rot += me.spin * dt;
      if (me.y >= 100) { me.y = 100; if (me.vy > 20) { me.vy *= -0.35; sfx.thud(); } else me.vy = 0; me.spin *= 0.6; }
      deadT += dt;
      if (deadT > 2) { showResult(); return; }
    }

    // Boss trigger: stop spawning, let the screen clear, then bring him in.
    if (phase === 'run' && !boss && !bossPending && dist() >= bossNext - 60) bossPending = true;
    if (bossPending && !boss && phase === 'run' && zaps.every(z => z.x - camX < -15) && !stakes.length && !beams.length) startBoss();

    // Spawning
    if (phase === 'run' && !bossPending) while (nextX < camX + VW() + 40) spawnChunk();
    for (const e of events) if (!e.done && camX + VW() >= e.x) { e.done = true; e.fire(); }
    events = events.filter(e => !e.done);
    if (phase === 'run' && !boss && dist() > 250) {
      stakeT -= dt;
      if (stakeT <= 0) {
        const L = clamp(dist() / 2000, 0, 1);
        stakeT = rnd(4.5, 7) - L * 2.5;
        const n = Math.random() < L * 0.5 ? 2 : 1;
        for (let i = 0; i < n; i++) stakes.push({ x: VW() + 6, y: pc() + (i ? rnd(-18, 18) : 0), vx: -(speed + 70), vy: 0, state: 'warn', t: -i * 0.35 });
        sfx.warn();
      }
    }

    // Zappers
    for (const z of zaps) z.ang += z.rot * dt;
    zaps = zaps.filter(z => z.x - camX > -40);
    if (me.alive) for (const z of zaps) {
      const [ax, ay, bx, by] = zEnds(z), wx = camX + px;
      if (Math.abs(z.x - wx) > z.len) continue;
      if (segDist(wx, pc(), ax, ay, bx, by) < 3.1) { hurt('zap'); break; }
    }

    // Blood drops & pickups
    const wx = camX + px;
    for (const d of drops) {
      if (me.alive && me.magnet > 0 && Math.hypot(d.x - wx, d.y - pc()) < 32) { const a = Math.atan2(pc() - d.y, wx - d.x); d.x += Math.cos(a) * 110 * dt; d.y += Math.sin(a) * 110 * dt; }
      if (me.alive && Math.hypot(d.x - wx, d.y - pc()) < 4.6) { d.got = true; collectDrop(d); }
    }
    drops = drops.filter(d => !d.got && d.x - camX > -10);
    chainT -= dt; if (chainT <= 0) chain = 0;
    for (const p of pickups) {
      p.ph += dt;
      if (me.alive && Math.hypot(p.x - wx, p.y + Math.sin(p.ph * 3) * 1.5 - pc()) < 6) {
        p.got = true;
        if (p.kind === 'shield') { me.shield = Math.min(me.shield + 1, 3); popup(T.shieldUp, '#b99bff'); }
        else { me.magnet = magnetDur(); popup(T.magnet, '#ff5d73'); }
        ring(px * U, sy(pc()), p.kind === 'shield' ? '#b99bff' : '#ff3552', 0.8); sfx.pickup();
      }
    }
    pickups = pickups.filter(p => !p.got && p.x - camX > -10);

    // Stakes (warnings track you, then lock and fly)
    for (const s of stakes) {
      s.t += dt;
      if (s.state === 'warn') { if (s.t > 0) s.y = lerp(s.y, pc(), Math.min(1, dt * 3)); if (s.t > 1.25) { s.state = 'lock'; s.t = 0; sfx.lock(); } }
      else if (s.state === 'lock') { if (s.t > 0.4) { s.state = 'fly'; s.x = VW() + 6; s.t = 0; sfx.whoosh(); } }
      else { s.x += s.vx * dt; s.y += s.vy * dt; if (me.alive && Math.hypot(s.x - px, s.y - pc()) < 3.4) { s.dead = true; hurt('stake'); } }
    }
    stakes = stakes.filter(s => !s.dead && s.x > -12 && s.y > -20 && s.y < 130);

    // Sunbeams
    for (const b of beams) {
      const was = b.t < b.warn; b.t += dt;
      if (was && b.t >= b.warn) { sfx.beam(); shake = Math.max(shake, 4); }
      if (b.t >= b.warn && me.alive && Math.abs(pc() - b.y) < b.h / 2 + 2) hurt('sun');
    }
    beams = beams.filter(b => b.t < b.warn + b.on);

    // Boss, orbs and bat swarms
    if (boss) updateBoss(dt);
    for (const o of orbs) {
      o.x -= (22 + speed * 0.25) * dt; o.y = clamp(o.y + o.vy * dt + Math.sin(time * 2 + o.ph) * 0.2, 12, 94); o.ph += dt;
      if (me.alive && Math.hypot(o.x - px, o.y - pc()) < 6.2) {
        o.got = true;
        const dmg = batMul();
        const sx = px * U, s0 = sy(pc());
        for (let i = 0; i < 7; i++) bats.push({ x0: sx, y0: s0, t: -i * 0.04, dur: 0.55, bend: rnd(-120, 120), hit: i === 0 ? dmg : 0 });
        ring(sx, s0, '#ff3552', 0.7); sfx.swarm(); buzz(10);
      }
    }
    orbs = orbs.filter(o => !o.got && o.x > -8 && (boss || o.x < VW() + 10));
    for (const b of bats) {
      b.t += dt;
      if (b.t >= b.dur && !b.done) { b.done = true; if (b.hit) hitBoss(b.hit); }
    }
    bats = bats.filter(b => !b.done);
    if (!boss) orbs = [];
  }

  function collectDrop(d) {
    const v = valMul();
    runCoins += v; chain++; chainT = 0.45;
    sfx.drop(chain);
    parts.push({ k: 'glow', col: '#ff3552', x: (d.x - camX) * U, y: sy(d.y), vx: 0, vy: -30, t: 0, life: 0.35, r0: 6, r1: 18, a: 0.7 });
  }

  // Red mist and little bats pour out under the cape: the vampire's "jetpack".
  let trailT = 0;
  function emitTrail(dt, on, x, y) {
    if (!on) return;
    trailT -= dt;
    const s = U / 6;
    if (trailT <= 0) {
      trailT = 0.03;
      parts.push({ k: 'glow', col: Math.random() < 0.5 ? '#c3122f' : '#5a1030', x: x - rnd(4, 10) * s, y: y + rnd(-4, 4) * s, vx: -rnd(60, 140) * s - speed * U * 0.5, vy: rnd(60, 160) * s, t: 0, life: rnd(0.4, 0.7), r0: 6 * s, r1: 22 * s, a: 0.55 });
      if (Math.random() < 0.35) parts.push({ k: 'bat', col: '#1a0f24', x: x - 6 * s, y: y + 4 * s, vx: -rnd(80, 200) * s - speed * U * 0.4, vy: rnd(40, 180) * s, t: 0, life: rnd(0.5, 0.8), r0: rnd(5, 8) * s, ph: Math.random() });
      if (Math.random() < 0.3) parts.push({ k: 'glow', col: '#ff9aa8', x: x - 3 * s, y: y + 2 * s, vx: -rnd(40, 90) * s, vy: rnd(80, 140) * s, t: 0, life: 0.25, r0: 3 * s, r1: 6 * s, a: 0.8, add: true });
    }
  }

  // ---------- Intro: bitten, transformed, airborne ----------
  const INTRO = 3.3;
  function updateIntro(dt) {
    introT += dt;
    const t = introT, px = PXu();
    camX += dt * lerp(4, 14, clamp((t - 2.4) / 0.9, 0, 1));
    me.run += dt * 6;
    me.x = t < 1.25 ? lerp(-8, px, Math.min(1, t / 1.2)) : px;
    if (t >= 1.3 && !me.bit) { me.bit = true; flash = 0.6; shake = 10; sfx.bite(); buzz(40); popup(T.bitten, '#ff3552', px * U + 20, sy(80)); }
    if (t >= 1.35 && t < 2.35) {
      me.k = clamp((t - 1.45) / 0.8, 0, 1);
      if (Math.random() < dt * 40) { const a = rnd(0, 6.28); parts.push({ k: 'glow', col: '#9b0d22', x: px * U + Math.cos(a) * 30 * U / 6, y: sy(95) + Math.sin(a) * 20 * U / 6, vx: rnd(-30, 30), vy: -rnd(30, 90), t: 0, life: 0.7, r0: 8 * U / 6, r1: 24 * U / 6, a: 0.5 }); }
      if (!me.swirl) { me.swirl = true; sfx.transform(); }
    }
    if (t >= 2.35 && !me.revealed) { me.revealed = true; me.k = 1; burstBats(px * U, sy(94), 16); shake = 8; popup(T.vampire, '#ffc531', px * U + 20, sy(70)); sfx.reveal(); }
    if (t > 2.75) { me.vy = -40; me.y = Math.min(me.y, 100) + me.vy * dt * (t - 2.75) * 3; me.flyK = Math.min(1, me.flyK + dt * 4); emitTrail(dt, true, px * U, sy(me.y - 1.5)); }
    me.blink -= dt; if (me.blink < -3) me.blink = 0.12;
    if (t >= INTRO) { phase = 'run'; me.vy = -30; speed = 14; nextX = camX + VW() + 20; }
  }

  // ---------- Drawing: characters ----------
  const OUT = '#1a0b1e';
  // Side-view vampire at feet (x, y), s = px per unit. k blends human (0) to vampire (1).
  function drawVamp(c, x, y, s, o) {
    const V = o.v, CP = o.cp, k = o.k ?? 1, fly = o.fly ?? 0, t = o.t ?? time;
    const skin = mix(HUMAN.skin, V.skin, k), hair = mix(HUMAN.hair, V.hair, k), suit = mix(HUMAN.suit, V.suit, k), pants = mix(HUMAN.pants, V.pants, k);
    c.save(); c.translate(x, y); c.scale(s, s); if (o.rot) { c.translate(0, -5); c.rotate(o.rot); c.translate(0, 5); }
    c.lineJoin = 'round'; c.lineCap = 'round';
    const lw = 0.34;
    // Cape, streaming back (it grows in during the transformation)
    if (k > 0.05) {

    const fs = clamp(Math.min(W, H) * 0.075, 22, 46), pad = 14;
    txt(`${dist()} m`, pad, pad + fs * 0.6, fs, '#ffffff', 'left');
    txt(`${T.best} ${Math.max(save.best, 0)} m`, pad, pad + fs * 1.5, fs * 0.42, '#d8c8ff', 'left');
    // blood counter
    const cs = fs * 0.62, label = String(Math.floor(runCoins));
    ctx.font = `900 ${cs}px system-ui`; const tw = ctx.measureText(label).width;
    const bx = W - pad - tw - cs * 1.6, by = pad + 2;
    ctx.fillStyle = 'rgba(14,6,22,.65)'; ctx.beginPath(); ctx.roundRect(bx, by, tw + cs * 1.6, cs * 1.5, cs * 0.75); ctx.fill();
    drawDrop(ctx, bx + cs * 0.65, by + cs * 0.82, cs * 0.34);
    txt(label, bx + cs * 1.15, by + cs * 0.77, cs, '#fff', 'left');
    // boss bar
    if (boss && (boss.state === 'fight' || boss.state === 'enter')) {
      const bw = Math.min(W * 0.62, 420), x0 = (W - bw) / 2, y0 = pad + fs * 2.2, hh = fs * 0.42;
      txt(`${T.hunter} #${boss.stage}`, W / 2, y0 - hh * 0.5, fs * 0.42, '#ffd0d6');
      ctx.fillStyle = 'rgba(14,6,22,.7)'; ctx.beginPath(); ctx.roundRect(x0, y0, bw, hh, hh / 2); ctx.fill();
      ctx.fillStyle = '#e8203f'; ctx.beginPath(); ctx.roundRect(x0 + 2, y0 + 2, (bw - 4) * boss.hp / boss.hpMax, hh - 4, hh / 2); ctx.fill();
      const tl = Math.max(0, Math.ceil(boss.timeLeft));
      txt(`⏱ ${tl}`, W / 2, y0 + hh * 2, fs * 0.55, tl <= 5 ? '#ff5d73' : '#ffffff');
    } else if (phase === 'run' && !boss) {
      const left = bossNext - dist();
      if (left > 0 && left <= 200) txt(`🦇 ${T.next}: ${left} m`, W / 2, pad + fs * 2.3, fs * 0.4, '#ffd0d6');
    }
    // popups
    for (const p of popups) {
      const k = p.t / 1.1; ctx.globalAlpha = 1 - k * k;
      txt(p.text, clamp(p.x, fs * 2.5, W - fs * 2.5), p.y - k * 40, fs * 0.62 * (1 + Math.max(0, 0.25 - p.t) * 1.5), p.color);
      ctx.globalAlpha = 1;
    }
    if (banner) {
      const k = banner.t / banner.dur, a = Math.min(1, banner.t * 5, (1 - k) * 5), sc = 1 + Math.max(0, 0.2 - banner.t) * 2;
      ctx.globalAlpha = a;
      const y = FT + (FB - FT) * 0.4;
      ctx.fillStyle = 'rgba(14,6,22,.55)'; ctx.fillRect(0, y - fs * 1.1, W, fs * (banner.sub ? 2.6 : 2));
      txt(banner.text, W / 2, y, fs * 0.95 * sc, banner.col);
      if (banner.sub) txt(banner.sub, W / 2, y + fs * 1, fs * 0.42, '#ffffff');
      ctx.globalAlpha = 1;
    }
    if (phase === 'run' && hintT < 1 && !boss) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 6); txt('👆 ' + T.hold, W / 2, FT + (FB - FT) * 0.55, fs * 0.6, '#ffffff'); ctx.globalAlpha = 1; }
  }

  function frame(t) {
    const dt = Math.min((t - lastT) / 1000 || 0, 0.05);
    lastT = t;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ---------- Screens ----------
  const $ = (id) => document.getElementById(id);
  const screens = ['menu', 'shop', 'result'];
  function show(id) { screens.forEach(s => $(s).classList.toggle('hidden', s !== id)); }

  function renderMenu() {
    $('mCoins').textContent = save.coins;
    $('mBest').textContent = `🏁 ${T.best} ${save.best} m`;
    $('mBoss').textContent = `🦇 ${T.hunter} #${save.bosses + 1}`;
    $('playBtn').textContent = T.play;
    $('shopLbl').textContent = '🛒 ' + T.shop;
    const affordable = Object.entries(CATS).some(([cat, list]) => list.some(x => save.bosses >= x.boss && !save.owned[cat].includes(x.id) && save.coins >= x.cost))
      || UPGRADES.some(u => save.up[u.id] < u.max && save.coins >= upCost(u));
    $('shopBadge').classList.toggle('hidden', !(affordable || unlockedCount() > save.seen));
  }

  let shopTab = 'vamps';
  function renderShop() {
    if (unlockedCount() > save.seen) { save.seen = unlockedCount(); persist(); }
    $('sCoins').textContent = save.coins;
    $('shopTitle').textContent = T.shop;
    $('shopBack').textContent = T.back;
    $('shopHint').textContent = shopTab === 'upgrades' ? '' : T.hint;
    const tabs = $('tabs'); tabs.innerHTML = '';
    for (const id of ['vamps', 'capes', 'upgrades']) {
      const b = document.createElement('button'); b.className = 'tab' + (id === shopTab ? ' on' : ''); b.textContent = T[id];
      b.onclick = () => { shopTab = id; sfx.ui(); renderShop(); };
      tabs.appendChild(b);
    }
    const g = $('grid'); g.innerHTML = '';
    if (shopTab === 'upgrades') {
      for (const u of UPGRADES) {
        const lv = save.up[u.id], maxed = lv >= u.max, cost = upCost(u);
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = `<div class="em" style="font-size:44px">${u.icon}</div><div class="nm"></div><div class="ds"></div><div class="lv">Lv ${lv} / ${u.max}</div>`;
        card.querySelector('.nm').textContent = T['u_' + u.id];
        card.querySelector('.ds').textContent = T['u_' + u.id + '_d'];
        const b = document.createElement('button');
        if (maxed) { b.className = 'b-on'; b.textContent = T.max; }
        else {
          b.className = 'b-buy' + (save.coins < cost ? ' poor' : ''); b.innerHTML = `<span class="drop"></span>${cost}`;
          b.onclick = () => { if (save.coins < cost) return; save.coins -= cost; save.up[u.id]++; persist(); sfx.buy(); renderShop(); };
        }
        card.appendChild(b); g.appendChild(card);
      }
      return;
    }
    for (const item of CATS[shopTab]) {
      const owned = save.owned[shopTab].includes(item.id), unlocked = save.bosses >= item.boss, eq = save.eq[shopTab] === item.id;
      const card = document.createElement('div'); card.className = 'card' + (eq ? ' eq' : '');
      const pv = document.createElement('canvas'); pv.width = 240; pv.height = 200; card.appendChild(pv);
      const c = pv.getContext('2d');
      const bg = c.createLinearGradient(0, 0, 0, 200); bg.addColorStop(0, '#2a1b4a'); bg.addColorStop(1, '#5a3a7a');
      c.fillStyle = bg; c.fillRect(0, 0, 240, 200);
      c.fillStyle = 'rgba(255,255,255,.6)'; for (let i = 0; i < 12; i++) c.fillRect(hash(i, 1) * 240, hash(i, 2) * 90, 2, 2);
      if (shopTab === 'vamps') drawVamp(c, 120, 185, 15, { v: item, cp: cape(), k: 1, fly: 0, run: 0.4, t: 0 });
      else drawVamp(c, 150, 172, 12, { v: vamp(), cp: item, k: 1, fly: 1, run: 0, t: 0.3 });
      if (!unlocked) { c.fillStyle = 'rgba(29,18,41,.72)'; c.fillRect(0, 0, 240, 200); c.font = '60px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('🔒', 120, 100); }
      const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = item.name; card.appendChild(nm);
      const b = document.createElement('button');
      if (eq) { b.className = 'b-on'; b.textContent = T.equipped; }
      else if (owned) { b.className = 'b-eq'; b.textContent = T.equip; b.onclick = () => { save.eq[shopTab] = item.id; persist(); sfx.ui(); renderShop(); }; }
      else if (!unlocked) { b.className = 'b-lock'; b.textContent = `🔒 ${T.beat}${item.boss}`; }
      else {
        b.className = 'b-buy' + (save.coins < item.cost ? ' poor' : '');
        b.innerHTML = item.cost ? `<span class="drop"></span>${item.cost}` : T.free;
        b.onclick = () => {
          if (save.coins < item.cost) return;
          save.coins -= item.cost; save.owned[shopTab].push(item.id); save.eq[shopTab] = item.id; persist(); sfx.buy(); renderShop();
        };
      }
      card.appendChild(b); g.appendChild(card);
    }
  }

  function startRun() {
    unlockAudio();
    show(null);
    newRun();
  }

  function showResult() {
    phase = 'result'; holding = false;
    const d = dist(), coins = Math.floor(runCoins), rec = d > save.best;
    save.coins += coins;
    if (rec) save.best = d;
    persist();
    $('rTitle').textContent = T['d_' + killer] || T.d_stake;
    $('rDist').textContent = `${d} m`;
    $('rRec').textContent = T.newRec; $('rRec').classList.toggle('hidden', !rec);
    $('rBest').textContent = `${T.best}: ${save.best} m`;
    $('rCoins').textContent = '+' + coins;
    $('rBosses').textContent = `🦇 ${T.bosses}: ${runBosses}`;
    $('rUnlock').classList.toggle('hidden', !unlockNews.length);
    $('rUnlock').textContent = '🔓 ' + T.unlocked + unlockNews.join(', ');
    $('contBtn').textContent = T.retry;
    $('menuBtn').textContent = T.menu;
    show('result');
    me = null; zaps = []; drops = []; pickups = []; stakes = []; beams = []; orbs = []; bats = []; boss = null; banner = null; popups = [];
    setTimeout(() => sfx.coins(), 250);
    if (rec) setTimeout(() => sfx.first(), 600);
  }

  function toMenu() {
    phase = 'menu'; me = null; boss = null; parts = []; popups = []; banner = null;
    show('menu'); renderMenu();
  }

  // ---------- Audio ----------
  // Soft, ASMR-style palette: airy whooshes, glass drips and low thumps, all synthesized.
  let actx = null, master = null, wet = null, noiseBuf = null;
  function unlockAudio() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.ratio.value = 3;
        master = actx.createGain(); master.gain.value = 0.7;
        const soft = actx.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 3200;
        master.connect(soft).connect(comp).connect(actx.destination);
        wet = actx.createGain(); wet.gain.value = 0.35;
        const dl = actx.createDelay(1), fb = actx.createGain(), lp = actx.createBiquadFilter();
        dl.delayTime.value = 0.21; fb.gain.value = 0.38; lp.type = 'lowpass'; lp.frequency.value = 1800;
        wet.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (actx.state === 'suspended' && audioOn && !paused) actx.resume();
    } catch (e) {}
  }
  const canPlay = () => actx && audioOn && !paused && actx.state === 'running';
  function out(node, pan, send) {
    let n = node;
    if (pan && actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
    n.connect(master);
    if (send) { const s = actx.createGain(); s.gain.value = send; n.connect(s); s.connect(wet); }
  }
  function osc(f, peak, dur, o = {}) {
    if (!canPlay()) return;
    const t0 = actx.currentTime + (o.delay || 0), v = actx.createOscillator(), g = actx.createGain();
    v.type = o.type || 'sine'; v.frequency.setValueAtTime(f, t0);
    if (o.to) v.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    v.connect(g); out(g, o.pan, o.send);
    v.start(t0); v.stop(t0 + dur + 0.05);
  }
  function hiss(peak, dur, o = {}) {
    if (!canPlay()) return;
    const t0 = actx.currentTime + (o.delay || 0), s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; s.loop = true;
    f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.f || 1500, t0); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g); out(g, o.pan, o.send);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  }
  // A minor pentatonic keeps it spooky but sweet.
  const PENTA = [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880, 1046.5];
  const sfx = {
    flap() { hiss(0.035, 0.14, { f: 900, to: 350, q: 0.9, attack: 0.03, pan: -0.2 }); },
    drop(c) { const f = PENTA[Math.min(c - 1, PENTA.length - 1) % PENTA.length]; osc(f * 2, 0.045, 0.3, { send: 0.5 }); osc(f * 4.01, 0.01, 0.15, { send: 0.3 }); },
    warn() { osc(880, 0.05, 0.09); osc(880, 0.05, 0.09, { delay: 0.14 }); },
    lock() { osc(1320, 0.05, 0.06); osc(1320, 0.05, 0.06, { delay: 0.08 }); osc(1320, 0.05, 0.06, { delay: 0.16 }); },
    whoosh() { hiss(0.09, 0.35, { f: 400, to: 2200, q: 1.2, attack: 0.05 }); },
    shoot() { sfx.whoosh(); osc(180, 0.12, 0.15, { to: 90 }); },
    beam() { hiss(0.08, 0.9, { filter: 'lowpass', f: 400, to: 2400, attack: 0.05 }); osc(330, 0.05, 0.8, { send: 0.5 }); osc(495, 0.03, 0.8, { send: 0.5 }); },
    shield() { hiss(0.07, 0.5, { f: 500, to: 1400, q: 0.7, attack: 0.08 }); osc(440, 0.06, 0.6, { to: 330, send: 0.5 }); },
    pickup() { [0, 2, 4].forEach((k, i) => osc(PENTA[k + 4], 0.06, 0.6, { delay: i * 0.06, send: 0.5 })); },
    thud() { osc(90, 0.16, 0.18, { to: 50 }); hiss(0.06, 0.1, { filter: 'lowpass', f: 500 }); },
    death(kind) {
      if (kind === 'zap') { for (let i = 0; i < 5; i++) hiss(0.08, 0.06, { f: 3000, q: 4, delay: i * 0.05 }); }
      else if (kind === 'sun') hiss(0.1, 0.8, { f: 2500, to: 600, q: 0.7 });
      osc(330, 0.1, 0.7, { to: 110, send: 0.4 }); osc(70, 0.18, 0.35, { to: 40 });
    },
    bite() { hiss(0.12, 0.12, { filter: 'lowpass', f: 1200 }); osc(160, 0.16, 0.2, { to: 70 }); osc(1046.5, 0.03, 0.4, { delay: 0.05, send: 0.5 }); },
    transform() { hiss(0.08, 1.0, { f: 300, to: 2400, q: 1.4, attack: 0.3 }); osc(110, 0.1, 1.0, { to: 220, attack: 0.3 }); },
    reveal() { [0, 3, 5, 7].forEach((k, i) => osc(PENTA[k], 0.06, 1.2, { delay: i * 0.07, send: 0.6, pan: i % 2 ? 0.3 : -0.3 })); hiss(0.08, 0.4, { f: 1200, to: 300, q: 0.8 }); },
    swarm() { for (let i = 0; i < 4; i++) hiss(0.04, 0.12, { f: 1100 + i * 200, to: 400, q: 1, delay: i * 0.04 }); osc(PENTA[6], 0.05, 0.5, { send: 0.5 }); },
    ui() { osc(420, 0.07, 0.09, { to: 560 }); hiss(0.025, 0.03, { f: 1600, q: 3 }); },
    buy() { [0, 2, 4].forEach((k, i) => osc(PENTA[k + 5], 0.06, 0.6, { delay: i * 0.07, send: 0.5 })); },
    first() { osc(523.25, 0.06, 0.9, { send: 0.6 }); osc(783.99, 0.04, 0.9, { delay: 0.08, send: 0.6 }); },
    bossIntro() { hiss(0.09, 1.6, { filter: 'lowpass', f: 200, to: 900, attack: 0.6 }); osc(55, 0.16, 1.8, { attack: 0.5, to: 45 }); sfx.laugh(0.6); },
    laugh(d = 0) { for (let i = 0; i < 4; i++) osc(190 - i * 12, 0.06, 0.12, { delay: d + i * 0.15, type: 'triangle', to: 150 - i * 10 }); },
    windup() { osc(60, 0.12, 0.7, { to: 115, attack: 0.3 }); hiss(0.05, 0.7, { filter: 'lowpass', f: 300, to: 800, attack: 0.3 }); },
    bossHit() { osc(130, 0.22, 0.22, { to: 70, pan: 0.3 }); hiss(0.1, 0.12, { filter: 'lowpass', f: 900, pan: 0.3 }); osc(659.25, 0.04, 0.5, { send: 0.6, pan: 0.3 }); },
    bossDown() {
      PENTA.forEach((f, i) => osc(f, 0.05, 1.2, { delay: i * 0.07, send: 0.6, pan: i % 2 ? 0.3 : -0.3 }));
      hiss(0.1, 1.6, { filter: 'lowpass', f: 1500, to: 150 });
    },
    coins() { for (let i = 0; i < 6; i++) osc(PENTA[8 + (i % 3)], 0.03, 0.35, { delay: i * 0.06, send: 0.4 }); },
  };
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  function syncAudio() { if (!actx) return; if (audioOn && !paused) actx.resume(); else actx.suspend(); }

  // ---------- Input ----------
  function press(on) {
    if (on) unlockAudio();
    if (paused) { holding = false; return; }
    if (on && phase === 'intro' && introT < 2.3) { introT = Math.max(introT, 2.3); me.k = 1; me.x = PXu(); me.bit = me.swirl = true; }
    holding = on && (phase === 'run' || phase === 'intro');
  }

  // ---------- Boot ----------
  async function boot() {
    resize();
    window.addEventListener('resize', resize);
    cv.addEventListener('pointerdown', e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} press(true); });
    for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) cv.addEventListener(ev, () => press(false));
    window.addEventListener('keydown', e => { if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) { e.preventDefault(); if (!e.repeat) press(true); } });
    window.addEventListener('keyup', e => { if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(e.code)) press(false); });
    window.addEventListener('blur', () => press(false));

    try {
      if (window.bridge) { await bridge.initialize(); B = bridge; }
    } catch (e) { B = null; }
    if (B) {
      const lang = String(B.platform.language || 'en').slice(0, 2).toLowerCase();
      T = STRINGS[lang] || STRINGS.en;
      B.platform.on(B.EVENT_NAME.PAUSE_STATE_CHANGED, isPaused => { paused = isPaused; holding = false; syncAudio(); });
      B.platform.on(B.EVENT_NAME.AUDIO_STATE_CHANGED, isEnabled => { audioOn = isEnabled; syncAudio(); });
      await load();
    }

    if (/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) $('homeLink').classList.remove('hidden');
    $('playBtn').onclick = startRun;
    $('shopBtn').onclick = () => { unlockAudio(); shopTab = 'vamps'; show('shop'); renderShop(); };
    $('shopBack').onclick = () => { show('menu'); renderMenu(); };
    $('contBtn').onclick = startRun;
    $('menuBtn').onclick = toMenu;

    toMenu();
    requestAnimationFrame(t => {
      lastT = t; render();
      send('game_ready');
      requestAnimationFrame(frame);
    });
  }

  boot();
})();
</script>
</body>
</html>
