<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tap Tower</title>
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1530; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #homeLink { position: fixed; top: 12px; left: 12px; color: #fff; opacity: .7; font: 800 14px system-ui, sans-serif; text-decoration: none; }
  .hidden { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="hidden" id="homeLink" href="../">← All games</a>
<script>
(() => {
  'use strict';

  // ---------- Localization ----------
  const STRINGS = {
    en: { tap: 'TAP TO START', again: 'TAP TO PLAY AGAIN', best: 'BEST', perfect: 'PERFECT!', newBest: 'NEW BEST!', over: 'GAME OVER' },
    es: { tap: 'TOCA PARA EMPEZAR', again: 'TOCA PARA JUGAR DE NUEVO', best: 'RÉCORD', perfect: '¡PERFECTO!', newBest: '¡NUEVO RÉCORD!', over: 'FIN DEL JUEGO' },
    pt: { tap: 'TOQUE PARA COMEÇAR', again: 'TOQUE PARA JOGAR DE NOVO', best: 'RECORDE', perfect: 'PERFEITO!', newBest: 'NOVO RECORDE!', over: 'FIM DE JOGO' },
    ru: { tap: 'НАЖМИ, ЧТОБЫ НАЧАТЬ', again: 'НАЖМИ, ЧТОБЫ СЫГРАТЬ ЕЩЁ', best: 'РЕКОРД', perfect: 'ИДЕАЛЬНО!', newBest: 'НОВЫЙ РЕКОРД!', over: 'ИГРА ОКОНЧЕНА' },
  };
  let T = STRINGS.en;

  // ---------- Bridge (Playgama SDK) ----------
  let B = null;
  const send = (msg) => { try { B && B.platform.sendMessage(msg); } catch (e) {} };

  // ---------- Canvas ----------
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1, S = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    S = Math.min(W, H * 0.62) * 0.5 / (20 * COS);
  }

  // ---------- World ----------
  const COS = Math.cos(Math.PI / 6), SIN = 0.5;
  const SIZE = 10, BH = 2, RANGE = 13, PERFECT = 0.35, GRAVITY = 60;
  let stack, cur, debris, popups, axis, dir, speed, score, best = 0, combo, state = 'menu';
  let camY = 0, paused = false, audioOn = true, lastT = 0, hueBase = Math.random() * 360;

  function proj(x, y, z) {
    return [W / 2 + (x - z) * COS * S, H * 0.6 + (x + z) * SIN * S - y * S + camY];
  }
  function shade(hue, l) { return `hsl(${hue % 360},62%,${l}%)`; }

  function poly(pts, fill) {
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
    ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  }
  function drawBox(b, alpha = 1) {
    const t = b.y + BH, x2 = b.x + b.w, z2 = b.z + b.d;
    const A = proj(b.x, t, b.z), Bt = proj(x2, t, b.z), C = proj(x2, t, z2), D = proj(b.x, t, z2);
    const Bb = proj(x2, b.y, b.z), Cb = proj(x2, b.y, z2), Db = proj(b.x, b.y, z2);
    ctx.globalAlpha = alpha;
    poly([Bt, C, Cb, Bb], shade(b.hue, 48));
    poly([D, C, Cb, Db], shade(b.hue, 38));
    poly([A, Bt, C, D], shade(b.hue, 64));
    ctx.globalAlpha = 1;
  }

  function hueAt(level) { return hueBase + level * 7; }

  function reset() {
    stack = [];
    // Tall base so the tower never looks like it floats.
    for (let i = -6; i <= 0; i++) stack.push({ x: -SIZE / 2, z: -SIZE / 2, w: SIZE, d: SIZE, y: i * BH, hue: hueAt(0) });
    debris = []; popups = []; score = 0; combo = 0; axis = 'x'; dir = 1; speed = 14; camY = 0;
    spawn();
  }

  function spawn() {
    const p = stack[stack.length - 1];
    const level = score + 1;
    cur = { x: p.x, z: p.z, w: p.w, d: p.d, y: p.y + BH, hue: hueAt(level) };
    if (axis === 'x') cur.x = p.x - RANGE; else cur.z = p.z - RANGE;
    dir = 1;
  }

  function place() {
    const p = stack[stack.length - 1];
    const k = axis === 'x' ? 'x' : 'z', s = axis === 'x' ? 'w' : 'd';
    const delta = cur[k] - p[k], ad = Math.abs(delta), size = p[s];

    if (ad >= size) return fail();

    if (ad < PERFECT) {
      cur[k] = p[k];
      combo++;
      if (combo >= 3 && cur[s] < SIZE) { // reward streaks by regrowing the block
        const grow = Math.min(0.8, SIZE - cur[s]);
        cur[s] += grow; cur[k] -= grow / 2;
      }
      popups.push({ text: T.perfect, t: 0 });
      tone(440 * Math.pow(2, Math.min(combo, 12) / 12), 0.12, 'triangle');
    } else {
      combo = 0;
      const keep = size - ad;
      const piece = { y: cur.y, hue: cur.hue, vy: 0, w: cur.w, d: cur.d, x: cur.x, z: cur.z };
      if (delta > 0) { piece[k] = p[k] + size; }
      else { piece[k] = cur[k]; cur[k] = p[k]; }
      cur[s] = keep; piece[s] = ad;
      debris.push(piece);
      tone(220, 0.08, 'square');
    }

    stack.push(cur);
    score++;
    speed = Math.min(14 + score * 0.35, 30);
    axis = axis === 'x' ? 'z' : 'x';
    spawn();
  }

  function fail() {
    cur.vy = 0;
    debris.push(cur);
    cur = null;
    state = 'over';
    tone(110, 0.35, 'sawtooth');
    const isBest = score > best;
    if (isBest) { best = score; saveBest(); }
    overText = isBest && score > 0 ? T.newBest : T.over;
    send('level_failed');
    overAt = performance.now();
    setTimeout(showAd, 700);
  }
  let overAt = 0, overText = '';

  function showAd() {
    try {
      if (B && B.advertisement.isInterstitialSupported) B.advertisement.showInterstitial('game_over');
    } catch (e) {}
  }

  function start() {
    reset();
    state = 'play';
    send('level_started');
  }

  function onTap() {
    unlockAudio();
    if (paused) return;
    if (state === 'menu') return start();
    if (state === 'play') return place();
    if (state === 'over' && performance.now() - overAt > 600) return start();
  }

  // ---------- Update / render ----------
  function update(dt) {
    if (state === 'play' && cur) {
      const k = axis === 'x' ? 'x' : 'z';
      const base = stack[stack.length - 1][k];
      cur[k] += dir * speed * dt;
      if (cur[k] > base + RANGE) { cur[k] = base + RANGE; dir = -1; }
      if (cur[k] < base - RANGE) { cur[k] = base - RANGE; dir = 1; }
    }
    for (const d of debris) { d.vy -= GRAVITY * dt; d.y += d.vy * dt; }
    const topY = stack[stack.length - 1].y;
    debris = debris.filter(d => d.y > topY - 60);
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < 1);
    const target = (topY + BH) * S - H * 0.08;
    camY += (Math.max(0, target) - camY) * Math.min(1, dt * 5);
  }

  function render() {
    const h = hueAt(score);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, shade(h + 40, 22)); g.addColorStop(1, shade(h + 200, 12));
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    for (const b of stack) drawBox(b);
    if (cur && state === 'play') drawBox(cur);
    for (const d of debris) drawBox(d, 0.9);

    ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    const fs = Math.max(18, Math.min(W, H) * 0.05);
    if (state !== 'menu') {
      ctx.font = `800 ${fs * 2.4}px system-ui, sans-serif`;
      ctx.fillText(String(score), W / 2, H * 0.14);
    }
    for (const p of popups) {
      ctx.globalAlpha = 1 - p.t;
      ctx.font = `800 ${fs * 1.1}px system-ui, sans-serif`;
      ctx.fillText(p.text, W / 2, H * 0.22 - p.t * 30);
      ctx.globalAlpha = 1;
    }
    if (state === 'menu') {
      ctx.font = `900 ${Math.min(fs * 2.2, W * 0.12)}px system-ui, sans-serif`;
      ctx.fillText('TAP TOWER', W / 2, H * 0.17);
      ctx.font = `600 ${fs * 0.75}px system-ui, sans-serif`;
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
      ctx.fillText(T.tap, W / 2, H * 0.9);
      ctx.globalAlpha = 1;
      if (best > 0) ctx.fillText(`${T.best}: ${best}`, W / 2, H * 0.25);
    }
    if (state === 'over') {
      ctx.font = `800 ${fs * 1.1}px system-ui, sans-serif`;
      ctx.fillText(overText, W / 2, H * 0.22);
      ctx.font = `600 ${fs * 0.75}px system-ui, sans-serif`;
      ctx.fillText(`${T.best}: ${best}`, W / 2, H * 0.22 + fs * 1.4);
      ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() / 300);
      ctx.fillText(T.again, W / 2, H * 0.9);
      ctx.globalAlpha = 1;
    }
  }

  function frame(t) {
    const dt = Math.min((t - lastT) / 1000 || 0, 0.05);
    lastT = t;
    if (!paused) update(dt);
    render();
    requestAnimationFrame(frame);
  }

  // ---------- Audio ----------
  let actx = null;
  function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended' && audioOn && !paused) actx.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type) {
    if (!actx || !audioOn || paused) return;
    const o = actx.createOscillator(), gn = actx.createGain();
    o.type = type; o.frequency.value = freq;
    gn.gain.setValueAtTime(0.15, actx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(gn).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }
  function syncAudio() {
    if (!actx) return;
    if (audioOn && !paused) actx.resume(); else actx.suspend();
  }

  // ---------- Storage ----------
  function saveBest() {
    if (B) B.storage.set(['best'], [String(best)]).catch(() => {});
  }
  async function loadBest() {
    if (!B) return;
    try {
      const data = await B.storage.get(['best']);
      best = parseInt(data[0], 10) || 0;
    } catch (e) {}
  }

  // ---------- Boot ----------
  async function boot() {
    if (/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) document.getElementById('homeLink').classList.remove('hidden');
    resize();
    window.addEventListener('resize', resize);
    cv.addEventListener('pointerdown', e => { e.preventDefault(); onTap(); });
    window.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTap(); }
    });

    try {
      if (window.bridge) { await bridge.initialize(); B = bridge; }
    } catch (e) { B = null; }

    if (B) {
      const lang = String(B.platform.language || 'en').slice(0, 2).toLowerCase();
      T = STRINGS[lang] || STRINGS.en;
      B.platform.on(B.EVENT_NAME.PAUSE_STATE_CHANGED, isPaused => { paused = isPaused; syncAudio(); });
      B.platform.on(B.EVENT_NAME.AUDIO_STATE_CHANGED, isEnabled => { audioOn = isEnabled; syncAudio(); });
      if (B.advertisement.interstitialState === 'opened') { paused = true; }
      await loadBest();
    }

    reset();
    requestAnimationFrame(t => {
      lastT = t; render();
      send('game_ready');
      requestAnimationFrame(frame);
    });
  }

  boot();
})();
</script>
</body>
</html>
