<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Horde Hero</title>
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
<style>
  :root { --ink: #2a1d3d; --gold: #ffc531; --gold-d: #e39a12; --accent: #7b4dff; --green: #3ccf6e; --green-d: #22964c; --red: #ec3d55; --paper: #fff6e3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1430; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 16px; overflow-y: auto; }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; }
  .pill { background: rgba(20,14,40,.75); color: #fff; border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; }
  .coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 45%, var(--gold-d)); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); flex: none; display: inline-block; }
  .topbar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .home { color: #fff; text-decoration: none; font-weight: 800; opacity: .85; }

  /* Menu */
  #menu { justify-content: space-between; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.08), transparent 60%); }
  .title { text-align: center; margin-top: 3vh; }
  .title h1 { margin: 0; font-size: clamp(46px, 14vw, 80px); line-height: .9; font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
  .bottom { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-bottom: 8px; }
  .play { width: min(360px, 90%); padding: 18px; font-size: 26px; font-weight: 900; color: #fff; background: var(--green); border-radius: 18px; box-shadow: 0 6px 0 var(--green-d); animation: pulse 1.2s infinite; }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-d); }
  @keyframes pulse { 50% { transform: scale(1.04); } }

  .secondary { width: min(260px, 70%); padding: 12px; font-size: 19px; font-weight: 900; color: #fff; background: var(--accent); border-radius: 14px; box-shadow: 0 5px 0 #4a2aa8; }
  .secondary.small { width: auto; padding: 8px 16px; font-size: 16px; }
  .secondary:active { transform: translateY(3px); box-shadow: 0 2px 0 #4a2aa8; }
  .pickers { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 6px; }
  .label { color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; padding-left: 4px; }
  .tiles { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .tile { flex: none; width: 82px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 14px;
    background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.18); color: #fff; font-size: 12px; font-weight: 800; line-height: 1.1; text-align: center; }
  .tile.sel { background: var(--paper); color: var(--ink); border-color: var(--gold); box-shadow: 0 4px 0 var(--gold-d); }
  .tile.locked { opacity: .55; font-size: 10px; }
  .shoptitle { color: #fff; font-size: 32px; font-weight: 900; margin: 12px 0; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .tabs { display: flex; gap: 8px; width: 100%; max-width: 520px; margin-bottom: 10px; }
  .tab { flex: 1; padding: 10px; border-radius: 12px; font-weight: 900; font-size: 16px; color: #fff; background: rgba(255,255,255,.14); }
  .tab.on { background: var(--paper); color: var(--ink); box-shadow: 0 4px 0 #b97f22; }
  .tile { position: relative; }
  .tile .slot { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; font-style: normal; font-size: 12px; font-weight: 900; display: grid; place-items: center; border: 2px solid var(--ink); }
  .shoplist { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
  .shoprow { display: flex; align-items: center; gap: 12px; background: var(--paper); border-radius: 16px; padding: 10px 12px; border: 3px solid #e8b04a; box-shadow: 0 5px 0 #b97f22; }
  .shoprow .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .shoprow b { font-size: 17px; } .shoprow .info span { font-size: 13px; font-weight: 600; opacity: .75; }
  .pips { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--green) calc(var(--n) * 10%), rgba(42,29,61,.15) 0); margin-top: 4px; }
  .buy { min-width: 84px; padding: 10px; border-radius: 12px; background: var(--green); color: #fff; font-weight: 900; font-size: 16px; display: inline-flex; gap: 6px; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--green-d); }
  .buy:disabled { background: #a99db8; box-shadow: 0 4px 0 #7d7090; }

  /* Special button: --p is the charge from 0 to 1 */
  #specialBtn { position: fixed; right: calc(18px + env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 84px; height: 84px; border-radius: 50%; padding: 6px;
    background: conic-gradient(var(--gold) calc(var(--p, 0) * 360deg), rgba(255,255,255,.18) 0); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
  #specialBtn span { display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #b18cff, var(--accent) 60%, #4a2aa8); border: 3px solid var(--ink); }
  #specialBtn.ready { animation: glow 0.8s infinite alternate; }
  #specialBtn.ready span { background: radial-gradient(circle at 40% 35%, #fff4b8, var(--gold) 55%, var(--gold-d)); }
  @keyframes glow { to { box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 26px 8px rgba(255,214,90,.75); } }
  #specialBtn:active { transform: translateY(3px); }
  /* Joystick: --kx/--ky move the knob */
  #stick { position: fixed; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 124px; height: 124px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.10) 0 55%, rgba(255,255,255,.22) 56% 60%, rgba(255,255,255,.08) 61%); border: 3px solid rgba(255,255,255,.35); touch-action: none; }
  #knob { position: absolute; left: 50%; top: 50%; width: 54px; height: 54px; margin: -27px 0 0 -27px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, var(--paper) 55%, #e8c98a);
    border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.3); transform: translate(var(--kx, 0px), var(--ky, 0px)); pointer-events: none; }

  /* Overlays: perk pick */
  .overlay { justify-content: center; gap: 14px; background: rgba(18,10,36,.72); }
  .overlay h2 { margin: 0; color: #fff; font-size: 28px; font-weight: 900; text-align: center; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .overlay .hint { color: #fff; opacity: .85; text-align: center; font-weight: 700; max-width: 320px; }
  .cards { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .card { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left;
    background: var(--paper); border-radius: 16px; padding: 10px 14px; border: 3px solid #e8b04a; box-shadow: 0 5px 0 #b97f22; animation: pop .25s ease-out both; }
  .card canvas { grid-row: 1 / 3; }
  .card b { font-size: 19px; font-weight: 900; }
  .card .desc { font-size: 14px; font-weight: 600; opacity: .8; }
  .card .tag { position: absolute; top: -10px; right: 10px; background: var(--red); color: #fff; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 8px; }
  .card.new { border-color: #ff5d75; box-shadow: 0 5px 0 #b8293f; }
  .card:active { transform: translateY(3px); box-shadow: 0 2px 0 #b97f22; }
  .cards .card:nth-child(2) { animation-delay: .06s; } .cards .card:nth-child(3) { animation-delay: .12s; } .cards .card:nth-child(4) { animation-delay: .18s; }
  @keyframes pop { from { transform: scale(.88); } }
  .link { background: none; color: #fff; opacity: .8; font-weight: 800; text-decoration: underline; padding: 8px; }
  .play:disabled { opacity: .6; animation: none; }
  #resultTitle.win { color: var(--gold); } #resultTitle.lose { color: #ff8a9a; }
  .stats { width: min(340px, 92%); background: var(--paper); border-radius: 16px; padding: 10px 16px; border: 3px solid #e8b04a; box-shadow: 0 5px 0 #b97f22; }
  .stats .row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; padding: 6px 0; }
  .stats .row + .row { border-top: 2px dashed rgba(42,29,61,.15); }
  .unlocks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; max-width: 340px; }
  .unlock { width: 100%; text-align: center; color: #fff; font-weight: 900; font-size: 17px; text-shadow: 0 2px 0 var(--ink); }
  @media (orientation: landscape) and (min-width: 700px) { .cards { flex-direction: row; } .card { flex: 1; grid-template-columns: 1fr; text-align: center; justify-items: center; } .card canvas { grid-row: auto; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen hidden">
  <div class="topbar">
    <a id="homeLink" class="home hidden" href="../">&larr; All games</a>
    <span class="pill"><span class="coin"></span><span id="menuCoins">0</span></span>
  </div>
  <div class="title"><h1 id="titleText">Horde Hero</h1></div>
  <div class="pickers">
    <div class="label" id="worldLabel"></div>
    <div id="worldList" class="tiles"></div>
    <div class="label" id="weaponLabel"></div>
    <div id="weaponList" class="tiles"></div>
  </div>
  <div class="bottom">
    <button id="playBtn" class="play">Play</button>
    <button id="shopBtn" class="secondary">Shop</button>
  </div>
</div>

<div id="shop" class="screen hidden">
  <div class="topbar">
    <button id="shopBack" class="secondary small"></button>
    <span class="pill"><span class="coin"></span><span id="shopCoins">0</span></span>
  </div>
  <h2 id="shopTitle" class="shoptitle"></h2>
  <div class="tabs"><button id="tabWeapons" class="tab"></button><button id="tabUpgrades" class="tab"></button></div>
  <div id="shopList" class="shoplist"></div>
</div>

<button id="specialBtn" class="hidden" aria-label="Special"><span></span></button>
<div id="stick" class="hidden"><div id="knob"></div></div>

<div id="perks" class="screen overlay hidden">
  <h2 id="perkTitle"></h2>
  <div id="perkCards" class="cards"></div>
</div>

<div id="revive" class="screen overlay hidden">
  <h2 id="reviveTitle"></h2>
  <button id="reviveBtn" class="play"></button>
  <button id="noThanksBtn" class="link"></button>
</div>

<div id="result" class="screen overlay hidden">
  <h2 id="resultTitle"></h2>
  <div id="resultStats" class="stats"></div>
  <div id="resultUnlocks" class="unlocks"></div>
  <button id="contBtn" class="play"></button>
  <button id="shopFromResult" class="secondary"></button>
</div>

  // ---------- Perks ----------

  // ---------- Boss ----------
  const BOSSES = {
    troll: { hp: 2000, r: 46, slam: 22, summon: 'goblin', windup: 3 },
    wyrm: { hp: 2100, r: 50, slam: 30, summon: 'bat', windup: 2.6 },
    king: { hp: 3200, r: 48, slam: 40, summon: 'skeleton', windup: 2.2 },
  };
  // After BOSS_ENRAGE seconds the boss outpaces the hero, so a fight can't be stalled by running forever.
  const BOSS_SPEED = 105, SLAM_R = 70, BOSS_ENRAGE = 45, BOSS_ENRAGE_SPEED = 175;
  // The boss stops close enough for melee weapons to reach it.
  const bossStop = (b) => HERO_R + b.r + 30;
  function startBoss() {
    const id = WORLDS[run.world].boss, d = BOSSES[id];
    run.boss = { id, isBoss: true, x: run.hero.x, y: run.hero.y - 150, hp: d.hp, maxHp: d.hp, r: d.r, state: 'walk', t: 0, attackT: 0, summonT: 0, flash: 0, whirlT: 0, hitT: 0 };

  function updateBoss(dt) {
    const b = run.boss, d = BOSSES[b.id];

    b.whirlT = Math.max(0, b.whirlT - dt);
    b.t += dt;
    const h = run.hero, dx = b.x - h.x, dy = b.y - h.y;

      }
    }
    if (b.state === 'windup') {

        if (Math.hypot(h.x - b.target.x, h.y - b.target.y) <= SLAM_R + HERO_R) hurtHero(d.slam);

    }

  function interruptBoss() {

  }
  function onBossKilled() {
    const b = run.boss;

    run.enemies.length = 0;
    phase = 'win';
    run.won = true;
    run.winT = 0;
    run.gold += 50 * (run.world + 1);
    if (run.world + 1 === save.worlds && save.worlds < 3) { save.worlds++; run.newWorld = true; }
    save.coins += run.gold;
    persist();
    send('level_completed');

  function update(dt) {
    if (paused) return;
    if (phase === 'win') {
      run.winT += dt; updateFx(dt);
      if (run.winT >= 1.5) showResult(true);
      return;
    }
    if (phase !== 'play' && phase !== 'boss') return;
    run.t += dt;
    run.specialT += dt;
    if (run.perks.regen) run.hp = Math.min(run.maxHp, run.hp + run.perks.regen * dt);

    updateEnemies(dt);
    if (phase === 'boss' && run.boss) updateBoss(dt);
    updateWeapons(dt);
    updateProjectiles(dt);
    updateFx(dt);
    if (phase === 'win') return;

  // ---------- Shop & menu ----------
  // id === null hides every screen (gameplay).
  function show(id) {

    $('specialBtn').classList.toggle('hidden', !(id === null && run));
    $('stick').classList.toggle('hidden', !(id === null && run));

  const SHOP = [{ id: 'hp', base: 40 }, { id: 'dmg', base: 50 }, { id: 'spd', base: 50 }, { id: 'gold', base: 60 }, { id: 'spc', base: 70 }];
  const UP_MAX = 10;
  const upCost = (id) => Math.round(SHOP.find(u => u.id === id).base * UP_COST_GROWTH ** save.up[id]);
  function buyUpgrade(id) {
    if (save.up[id] >= UP_MAX || save.coins < upCost(id)) return false;
    save.coins -= upCost(id);
    save.up[id]++;

    onBuy();
    return true;
  }
  function selectWorld(i) {

  }
  function buyWeapon(id) {

    save.coins -= WEAPON_PRICES[id];
    save.weapons.push(id);
    save.loadout = [id];
    persist();
    onBuy();
    return true;
  }
  // Pick the run's weapon among the bought ones; returns whether the choice changed.

  }
  function tile(what, label, locked, selected, hint, badge) {

  function renderMenu() {

  }
  let shopTab = 'weapons';
  function openShop(tab) {

  }
  function renderShop() {

      for (const w of WEAPONS.slice().sort((a, b) => WEAPON_PRICES[a.id] - WEAPON_PRICES[b.id])) {
        const owned = save.weapons.includes(w.id), cost = WEAPON_PRICES[w.id];

      return;
    }

      const lv = save.up[u.id], maxed = lv >= UP_MAX, cost = maxed ? 0 : upCost(u.id);
      const row = document.createElement('div');
      row.className = 'shoprow'; row.dataset.up = u.id;
      row.appendChild(iconCanvas('up:' + u.id, 44));
      row.insertAdjacentHTML('beforeend', '<div class="info"><b></b><span></span><i class="pips"></i></div><button class="buy"></button>');

  // ---------- Render ----------
  // Everything is drawn in code: chunky rounded shapes, dark outline, two-tone shading.

  const cam = { x: 0, y: 0, t: 0 };
  let hintCount = 0;
  const hudRects = {}, arenaDrawn = { decos: 0, stones: 0 };
  let S = 1, CX = 0, CY = 0, shakeT = 0, shakeMag = 0, freezeT = 0, lastRender = 0, menuT = 0;
  const coinFx = [];
  const ENEMY_COLORS = { slime: '#6fe06a', goblin: '#9bd24a', wolf: '#a7a3b8', bat: '#a86bff', spider: '#4b3a66', golem: '#8fa7c9',
    skeleton: '#f1ead6', knight: '#c4ccd9', wraith: '#b4a0ff' };
  const enemyColor = (id) => ENEMY_COLORS[id] || '#ffffff';
  const shade = (hex, k) => {

  // ----- Weapon art (shared by the hero, icons and covers). Drawn pointing right, ~40 units long.
  function drawWeaponArt(g, id, t) {
    if (id === 'sword') {
      poly(g, [[-4, -3], [30, -3], [38, 0], [30, 3], [-4, 3]], '#eef2ff', 2);
      g.fillStyle = 'rgba(160,170,210,.6)'; g.fillRect(0, 0, 30, 2.5);
      rrect(g, -6, -9, 5, 18, 2, '#ffc531', 2);
      rrect(g, -16, -2.5, 11, 5, 2, '#8a5a2b', 2);
    } else if (id === 'whirl') {
      for (let i = 0; i < 3; i++) {
        g.save(); g.rotate(t * 6 + i * Math.PI * 2 / 3);
        poly(g, [[3, -3], [20, -9], [16, 0], [3, 3]], '#cfe9ff', 2);
        g.restore();

      g.lineWidth = 3.5; g.strokeStyle = id === 'fan' ? '#e0a33a' : '#a8642e'; g.beginPath(); g.arc(-6, 0, 18, -1.2, 1.2); g.stroke();

        g.save(); g.rotate((i - (n - 1) / 2) * 0.35);

  // ----- Hero: a cheerful little knight who visibly holds every held weapon.
  function drawHero(g, x, y, scale, t, weapons, aim, hurt) {

    });

        ell(g, r * 0.75, 0, r * 0.55, r * 0.5, col, 2); ell(g, r * 1.25, 0, r * 0.18, r * 0.18, OUT, 0);
        ell(g, r * 0.85, -r * 0.22, r * 0.12, r * 0.12, '#ffe14d', 0); ell(g, r * 0.85, r * 0.22, r * 0.12, r * 0.12, '#ffe14d', 0); break;
      case 'bat': {

          g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(sx * r * 1.2, (a + k) * r - r * 0.6, sx * r * 1.6, (a + k) * r + r * 0.2); g.stroke();

        for (const [ex, ey] of [[-0.3, -0.1], [0.3, -0.1], [-0.15, 0.2], [0.15, 0.2]]) ell(g, ex * r + fx * 0.4, ey * r, r * 0.12, r * 0.12, '#ff5d75', 0); break;
      case 'golem':

  // ----- HUD (screen space).

    if (lock) {
      g.save(); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(30,20,50,.82)'; g.fillRect(0, 0, s, s); g.restore();
      g.save(); g.translate(s / 2, s / 2); g.scale(s / 100, s / 100);
      rrect(g, -14, -4, 28, 24, 5, '#ffc531', 3); g.lineWidth = 6; g.strokeStyle = OUT; g.beginPath(); g.arc(0, -6, 10, Math.PI, 0); g.stroke();
      g.restore();
    }
  }

  function render() {
    const now = performance.now(), rdt = Math.min(0.05, (now - (lastRender || now)) / 1000);
    lastRender = now;
    if (freezeT > 0) { freezeT -= rdt; return; }
    S = Math.min(W, H) / 420;
    CX = W / 2; CY = H * (H > W ? 0.47 : 0.5);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#1d1430'; ctx.fillRect(0, 0, W, H);
    shakeT = Math.max(0, shakeT - rdt);
    const sx = shakeT > 0 ? (Math.random() - 0.5) * shakeMag : 0, sy = shakeT > 0 ? (Math.random() - 0.5) * shakeMag : 0;
    if (shakeT <= 0) shakeMag = 0;
    const t = run ? run.t : (menuT += rdt);
    ctx.save(); ctx.translate(CX + sx, CY + sy); ctx.scale(S, S);
    if (!run) {
      // Menu backdrop: the selected world with a few wandering monsters.
      const world = WORLDS[save.world];
      ctx.translate(0, 60);
      drawArena(ctx, world, t);
      world.enemies.forEach((id, i) => {
        const a = t * 0.35 + i * 2.1, e = { id, x: Math.cos(a) * 120, y: Math.sin(a) * 70 + 20, r: ENEMIES[id].r * 1.3, flash: 0, seed: i, hp: 1, maxHp: 1 };
        drawEnemy(ctx, e, t);
      });
      drawHero(ctx, 0, 10, 1.8, t, save.loadout.map(id => ({ id })), -0.4, false);
      ctx.restore();
      ctx.fillStyle = 'rgba(20,12,40,.45)'; ctx.fillRect(0, 0, W, H);
      return;
    }
    // The camera eases toward the hero, timed by the simulation so it stays in step with it.
    const k = Math.min(1, Math.max(0, run.t - cam.t) * 8);
    if (run.t < cam.t || k >= 1) { cam.x = run.hero.x; cam.y = run.hero.y; } else { cam.x += (run.hero.x - cam.x) * k; cam.y += (run.hero.y - cam.y) * k; }
    cam.t = run.t;
    ctx.translate(-cam.x, -cam.y);
    const world = WORLDS[run.world];
    drawArena(ctx, world, t);
    if (run.boss && run.boss.state === 'windup') {
      const k = run.boss.t / BOSSES[run.boss.id].windup;
      const tg = run.boss.target, R = SLAM_R + HERO_R;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(236,61,85,.8)';
      ctx.beginPath(); ctx.arc(tg.x, tg.y, R, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
      ell(ctx, tg.x, tg.y, R * k, R * k, 'rgba(236,61,85,.18)', 0);
    }
    for (const p of run.particles) {
      const k = p.t / p.life;
      ctx.globalAlpha = 1 - k; ell(ctx, p.x, p.y, p.r * (1 - k * 0.5), p.r * (1 - k * 0.5), p.color, 0);
    }
    ctx.globalAlpha = 1;
    const list = run.enemies.slice().sort((a, b) => a.y - b.y);
    for (const e of list) {
      const age = e.born === undefined ? 1 : (run.t - e.born) / 0.3;
      if (age < 1) {
        // Monsters pop out of the ground with a puff, so spawning inside the view reads as intentional.
        ell(ctx, e.x, e.y + e.r * 0.6, e.r * (1.6 - age * 0.6), e.r * (0.7 - age * 0.3), 'rgba(255,255,255,' + (0.5 * (1 - age)) + ')', 0);
        ctx.save(); ctx.translate(e.x, e.y + e.r); ctx.scale(Math.max(0.05, age), Math.max(0.05, age)); ctx.translate(-e.x, -e.y - e.r);
        drawEnemy(ctx, e, t); ctx.restore();
      } else drawEnemy(ctx, e, t);
    }
    if (run.boss) drawBoss(ctx, run.boss, t);
    const h = run.hero, near = nearest(h.x, h.y), aim = near ? Math.atan2(near.y - h.y, near.x - h.x) : h.face;
    drawHero(ctx, h.x, h.y, 1, t, run.weapons, aim, run.hurtT > 0);
    drawWhirls(ctx);
    drawProjectiles(ctx, t);
    drawFx(ctx);
    drawPopups(ctx);
    ctx.restore();
    drawHints();
    drawHud(t);
    const p = Math.min(1, run.specialT / specialCd());
    const btn = $('specialBtn');
    btn.style.setProperty('--p', p.toFixed(3));
    btn.classList.toggle('ready', p >= 1);
  }

  // Feel hooks called by the simulation.
  const toScreen = (x, y) => [CX + (x - cam.x) * S, CY + (y - cam.y) * S];
  // Arrows on the screen edge for monsters (and the boss) that are coming from off-screen.
  function drawHints() {
    hintCount = 0;
    const m = 26, list = run.boss ? [run.boss, ...run.enemies] : run.enemies;
    for (const e of list) {
      const [sx, sy] = toScreen(e.x, e.y);
      if (sx > -e.r * S && sx < W + e.r * S && sy > -e.r * S && sy < H + e.r * S) continue;
      if (++hintCount > 14 && !e.isBoss) continue;
      const a = Math.atan2(sy - CY, sx - CX);
      const tx = Math.max(m, Math.min(W - m, CX + Math.cos(a) * W)), ty = Math.max(m + 40, Math.min(H - m - 70, CY + Math.sin(a) * H));
      ctx.save(); ctx.translate(tx, ty); ctx.rotate(a);
      const big = e.isBoss ? 1.6 : 1;
      poly(ctx, [[10 * big, 0], [-6 * big, -7 * big], [-3 * big, 0], [-6 * big, 7 * big]], e.isBoss ? '#ec3d55' : enemyColor(e.id), 2);
      ctx.restore();
    }
  }
  let streak = 0, streakT = -9, lastHitSfx = {};
  let lastStop = -1e9;
  function hitStop() {
    const now = performance.now();
    if (now - lastStop < 250) return false;
    lastStop = now; freezeT = Math.max(freezeT, 0.03);
    return true;
  }
  function onHit(source, e) {
    const now = run.t;
    if (!(lastHitSfx[source] > now - 0.06)) { lastHitSfx[source] = now; sfx.hit(source); }
    if (source === 'special' || source === 'fire') shake(source === 'special' ? 10 : 4);
    if (e.isBoss) { hitStop(); shake(3); }
  }
  function onKill(e) {
    streak = run.t - streakT < 1.5 ? streak + 1 : 0;
    streakT = run.t;
    sfx.kill(streak);
    if (coinFx.length < 40) { const [x, y] = toScreen(e.x, e.y); coinFx.push({ x, y, t: 0 }); }
    if (e.maxHp >= 60) hitStop();
  }
  function onHurt(n) { sfx.hurt(); shake(n >= 20 ? 12 : 5); buzz(n >= 20 ? 60 : 20); }
  function onPerk(o) { if (o.kind === 'level') sfx.levelUp(); else sfx.perk(o.kind === 'weapon'); }
  function onSpecial() { sfx.special(); buzz(40); }
  function onBossIntro() { sfx.bossIntro(); shake(8); }
  function onBossWindup() { sfx.bossWindup(); }
  function onBossSlam() { sfx.bossSlam(); }
  function onVictory() { sfx.victory(); shake(14); }
  function onDefeatSfx() { sfx.defeat(); }
  function onBuy() { sfx.buy(); }

  // ---------- Audio ----------
  // Soft ASMR palette, all synthesized: wooden thocks, glassy chimes, airy noise. Kills climb a pentatonic scale during a streak.
  let actx = null, master = null, wet = null, noiseBuf = null, voices = 0;
  const MAX_VOICES = 24;
  function unlockAudio() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.ratio.value = 3;
        master = actx.createGain(); master.gain.value = 0.7;
        master.connect(comp).connect(actx.destination);
        wet = actx.createGain(); wet.gain.value = 0.35;
        const dl = actx.createDelay(1), fb = actx.createGain(), lp = actx.createBiquadFilter();
        dl.delayTime.value = 0.19; fb.gain.value = 0.36; lp.type = 'lowpass'; lp.frequency.value = 2600;
        wet.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (actx.state === 'suspended' && audioOn && !paused) actx.resume();
    } catch (e) {}
  }
  const canPlay = () => actx && audioOn && !paused && actx.state === 'running' && voices < MAX_VOICES;
  function out(node, pan, send) {
    let n = node;
    if (pan && actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
    n.connect(master);
    if (send) { const s = actx.createGain(); s.gain.value = send; n.connect(s); s.connect(wet); }
  }
  function track(src) { voices++; src.onended = () => { voices--; }; }
  function osc(f, peak, dur, o = {}) {
    if (!canPlay()) return;
    const t0 = actx.currentTime + (o.delay || 0), v = actx.createOscillator(), g = actx.createGain();
    v.type = o.type || 'sine'; v.frequency.setValueAtTime(f, t0);
    if (o.to) v.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    v.connect(g); out(g, o.pan, o.send);
    track(v); v.start(t0); v.stop(t0 + dur + 0.05);
  }
  function hiss(peak, dur, o = {}) {
    if (!canPlay()) return;
    const t0 = actx.currentTime + (o.delay || 0), s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; s.loop = true;
    f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.f || 1500, t0); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g); out(g, o.pan, o.send);
    track(s); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  }
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const sfx = {
    hit(src) {
      if (src === 'sword') { hiss(0.12, 0.09, { f: 2400, to: 900, q: 1.2 }); osc(rnd(160, 190), 0.16, 0.1, { to: 100 }); }
      else if (src === 'whirl') hiss(0.05, 0.06, { f: 4200, q: 3, pan: rnd(-0.4, 0.4) });
      else if (src === 'bow') { hiss(0.06, 0.05, { f: 3200, q: 4 }); osc(rnd(420, 480), 0.05, 0.05, { to: 260 }); }
      else if (src === 'fan') { for (let i = 0; i < 3; i++) hiss(0.04, 0.04, { f: 3000 + i * 400, q: 4, delay: i * 0.018, pan: (i - 1) * 0.3 }); }
      else if (src === 'fire') { osc(90, 0.2, 0.28, { to: 45 }); hiss(0.1, 0.3, { filter: 'lowpass', f: 1400, to: 300 }); hiss(0.04, 0.2, { f: 5000, q: 0.7, delay: 0.05 }); }
      else if (src === 'storm') { hiss(0.08, 0.06, { filter: 'highpass', f: 3500 }); osc(1318.51, 0.035, 0.6, { send: 0.6, type: 'triangle' }); }
      else if (src === 'special') { osc(110, 0.22, 0.5, { to: 55 }); hiss(0.1, 0.6, { filter: 'lowpass', f: 2600, to: 200 }); }
    },
    kill(n = 0) {
      const f = PENTA[Math.min(n, PENTA.length - 1)];
      hiss(0.07, 0.04, { f: rnd(1600, 2200), q: 4, pan: rnd(-0.3, 0.3) });
      osc(f, 0.05, 0.5, { send: 0.55, pan: rnd(-0.25, 0.25) });
      if (n >= 4) osc(f * 1.5, 0.02, 0.4, { delay: 0.05, send: 0.6 });
    },
    coin() { osc(PENTA[7], 0.03, 0.3, { send: 0.4 }); },
    hurt() { osc(150, 0.12, 0.14, { to: 90, type: 'triangle' }); hiss(0.06, 0.08, { filter: 'lowpass', f: 700 }); },
    special() { hiss(0.12, 0.7, { f: 300, to: 3000, q: 0.8, attack: 0.05 }); [0, 2, 4, 7].forEach((k, i) => osc(PENTA[k], 0.05, 0.9, { delay: i * 0.05, send: 0.6 })); },
    perk(weapon) { [2, 4, 6].forEach((k, i) => osc(PENTA[k] * (weapon ? 1.5 : 1), 0.05, 0.6, { delay: i * 0.07, send: 0.5 })); },
    levelUp() { [0, 2, 4, 5, 7].forEach((k, i) => osc(PENTA[k], 0.045, 0.5, { delay: i * 0.05, send: 0.5 })); },
    bossIntro() { hiss(0.09, 1.6, { filter: 'lowpass', f: 200, to: 900, attack: 0.6 }); osc(55, 0.16, 1.8, { attack: 0.5, to: 45 }); },
    bossWindup() { osc(70, 0.1, 1.6, { attack: 0.8, to: 140, type: 'triangle' }); },
    bossSlam() { osc(60, 0.28, 0.45, { to: 35 }); hiss(0.14, 0.35, { filter: 'lowpass', f: 500 }); },
    victory() { PENTA.forEach((f, i) => osc(f, 0.05, 1.2, { delay: i * 0.07, send: 0.6, pan: i % 2 ? 0.3 : -0.3 })); },
    defeat() { [4, 2, 0].forEach((k, i) => osc(PENTA[k] / 2, 0.06, 0.8, { delay: i * 0.18, send: 0.5, type: 'triangle' })); },
    ui() { osc(620, 0.06, 0.08, { to: 880 }); hiss(0.03, 0.03, { f: 3000, q: 3 }); },
    buy() { [0, 2, 4].forEach((k, i) => osc(PENTA[k + 2], 0.06, 0.6, { delay: i * 0.07, send: 0.5 })); },
  };
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  function syncAudio() { if (!actx) return; if (audioOn && !paused) actx.resume(); else actx.suspend(); }

  // ---------- Input ----------
  // A DOM analog stick (bottom left) and arrows/WASD both write the normalized `input` vector.
  const STICK_TRAVEL = 50, DEAD = 0.12;
  let stickId = null, stickC = [0, 0];
  const keys = new Set();
  const KEYMAP = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] };
  function setKnob(x, y) { $('stick').style.setProperty('--kx', x + 'px'); $('stick').style.setProperty('--ky', y + 'px'); }
  function keyInput() {
    let x = 0, y = 0;
    for (const k of keys) { x += KEYMAP[k][0]; y += KEYMAP[k][1]; }
    const m = Math.hypot(x, y);
    input.x = m ? x / m : 0; input.y = m ? y / m : 0;
  }
  function releaseInput() {
    input.x = input.y = 0; keys.clear(); stickId = null; setKnob(0, 0);
  }
  function stickMove(e) {
    let dx = e.clientX - stickC[0], dy = e.clientY - stickC[1];
    const d = Math.hypot(dx, dy), lim = STICK_TRAVEL;
    if (d > lim) { dx = dx / d * lim; dy = dy / d * lim; }
    setKnob(dx, dy);
    const m = Math.min(1, d / lim);
    if (m < DEAD) { input.x = input.y = 0; return; }
    input.x = dx / lim; input.y = dy / lim;
  }
  function bindInput() {
    const st = $('stick');
    st.addEventListener('pointerdown', e => {
      e.preventDefault(); e.stopPropagation();
      if (stickId !== null) return;
      stickId = e.pointerId;
      try { st.setPointerCapture(e.pointerId); } catch (err) {}
      const r = st.getBoundingClientRect(); stickC = [r.left + r.width / 2, r.top + r.height / 2];
      stickMove(e);
    });
    st.addEventListener('pointermove', e => { if (e.pointerId === stickId) stickMove(e); });
    const up = e => { if (e.pointerId === stickId) { stickId = null; input.x = input.y = 0; setKnob(0, 0); } };
    st.addEventListener('pointerup', up);
    st.addEventListener('pointercancel', up);
    window.addEventListener('keydown', e => { if (KEYMAP[e.code]) { keys.add(e.code); keyInput(); e.preventDefault(); } });
    window.addEventListener('keyup', e => { if (KEYMAP[e.code]) { keys.delete(e.code); keyInput(); } });
    window.addEventListener('blur', releaseInput);
  }

  // ---------- Boot ----------
  // A long gap (tab frozen, Bridge pause) is clamped to one short step.
  function advance(ms) { if (!paused) update(Math.min(ms / 1000, 0.05)); }
  function frame(t) {
    advance(t - lastT);
    lastT = t;
    render();
    requestAnimationFrame(frame);
  }
  async function boot() {
    resize();
    window.addEventListener('resize', resize);
    bindInput();
    window.addEventListener('pointerdown', unlockAudio, true);
    document.addEventListener('click', e => { if (e.target.closest && e.target.closest('button')) sfx.ui(); });
    $('specialBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); useSpecial(); });
    $('reviveBtn').onclick = () => requestRevive();
    $('noThanksBtn').onclick = () => { if (adFinish) adFinish(false); else endRun(false); };
    $('contBtn').onclick = () => toMenu();
    $('playBtn').onclick = () => startRun(save.world);
    $('shopBtn').onclick = () => openShop();
    $('shopFromResult').onclick = () => openShop('weapons');
    $('tabWeapons').onclick = () => openShop('weapons');
    $('tabUpgrades').onclick = () => openShop('upgrades');
    $('shopBack').onclick = () => toMenu();
    window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { if (useSpecial()) e.preventDefault(); } });

    try {
      if (window.bridge) { await bridge.initialize(); B = bridge; }
    } catch (e) { B = null; }
    if (B) {
      lang = String(B.platform.language || 'en').slice(0, 2).toLowerCase();
      if (!STRINGS[lang]) lang = 'en';
      T = STRINGS[lang];
      B.platform.on(B.EVENT_NAME.PAUSE_STATE_CHANGED, v => { paused = v; releaseInput(); syncAudio(); });
      B.platform.on(B.EVENT_NAME.AUDIO_STATE_CHANGED, v => { audioOn = v; syncAudio(); });
      await load();
    }

    if (/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) $('homeLink').classList.remove('hidden');

    toMenu();
    render();
    send('game_ready');
    window.dispatchEvent(new Event('hh-ready'));
    requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
  }

  // @test-hook
  boot();
})();
</script>
</body>
