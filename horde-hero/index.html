<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Horde Hero</title>

<style>

  .hidden { display: none !important; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; }

  .coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 45%, var(--gold-d)); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); flex: none; display: inline-block; }
  .topbar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .home { color: #fff; text-decoration: none; font-weight: 800; opacity: .85; }

  .title { text-align: center; margin-top: 3vh; }
  .title h1 { margin: 0; font-size: clamp(46px, 14vw, 80px); line-height: .9; font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); }
  .bottom { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-bottom: 8px; }
  .play { width: min(360px, 90%); padding: 18px; font-size: 26px; font-weight: 900; color: #fff; background: var(--green); border-radius: 18px; box-shadow: 0 6px 0 var(--green-d); animation: pulse 1.2s infinite; }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-d); }
  @keyframes pulse { 50% { transform: scale(1.04); } }

  .secondary { width: min(260px, 70%); padding: 12px; font-size: 19px; font-weight: 900; color: #fff; background: var(--accent); border-radius: 14px; box-shadow: 0 5px 0 #4a2aa8; }
  .secondary.small { width: auto; padding: 8px 16px; font-size: 16px; }
  .secondary:active { transform: translateY(3px); box-shadow: 0 2px 0 #4a2aa8; }
  .pickers { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 6px; }
  .label { color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .8; padding-left: 4px; }
  .tiles { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: none; }
  .tile { flex: none; width: 82px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 14px;
    background: rgba(255,255,255,.12); border: 3px solid rgba(255,255,255,.18); color: #fff; font-size: 12px; font-weight: 800; line-height: 1.1; text-align: center; }
  .tile.sel { background: var(--paper); color: var(--ink); border-color: var(--gold); box-shadow: 0 4px 0 var(--gold-d); }
  .tile.locked { opacity: .55; font-size: 10px; }
  .shoptitle { color: #fff; font-size: 32px; font-weight: 900; margin: 12px 0; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .shoplist { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
  .shoprow { display: flex; align-items: center; gap: 12px; background: var(--paper); border-radius: 16px; padding: 10px 12px; border: 3px solid #e8b04a; box-shadow: 0 5px 0 #b97f22; }
  .shoprow .info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .shoprow b { font-size: 17px; } .shoprow .info span { font-size: 13px; font-weight: 600; opacity: .75; }
  .pips { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--green) calc(var(--n) * 10%), rgba(42,29,61,.15) 0); margin-top: 4px; }
  .buy { min-width: 84px; padding: 10px; border-radius: 12px; background: var(--green); color: #fff; font-weight: 900; font-size: 16px; display: inline-flex; gap: 6px; align-items: center; justify-content: center; box-shadow: 0 4px 0 var(--green-d); }
  .buy:disabled { background: #a99db8; box-shadow: 0 4px 0 #7d7090; }

  /* Special button: --p is the charge from 0 to 1 */
  #specialBtn { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: 84px; height: 84px; border-radius: 50%; padding: 6px;
    background: conic-gradient(var(--gold) calc(var(--p, 0) * 360deg), rgba(255,255,255,.18) 0); box-shadow: 0 5px 0 rgba(0,0,0,.35); }
  #specialBtn span { display: block; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #b18cff, var(--accent) 60%, #4a2aa8); border: 3px solid var(--ink); }
  #specialBtn.ready { animation: glow 0.8s infinite alternate; }
  #specialBtn.ready span { background: radial-gradient(circle at 40% 35%, #fff4b8, var(--gold) 55%, var(--gold-d)); }
  @keyframes glow { to { box-shadow: 0 5px 0 rgba(0,0,0,.35), 0 0 26px 8px rgba(255,214,90,.75); } }
  #specialBtn:active { transform: translateX(-50%) translateY(3px); }
  @media (orientation: landscape) { #specialBtn { left: auto; right: calc(18px + env(safe-area-inset-right)); transform: none; } #specialBtn:active { transform: translateY(3px); } }

  .overlay { justify-content: center; gap: 14px; background: rgba(18,10,36,.72); }
  .overlay h2 { margin: 0; color: #fff; font-size: 28px; font-weight: 900; text-align: center; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); }
  .overlay .hint { color: #fff; opacity: .85; text-align: center; font-weight: 700; max-width: 320px; }
  .cards { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .card { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; text-align: left;
    background: var(--paper); border-radius: 16px; padding: 10px 14px; border: 3px solid #e8b04a; box-shadow: 0 5px 0 #b97f22; animation: pop .25s ease-out both; }
  .card canvas { grid-row: 1 / 3; }
  .card b { font-size: 19px; font-weight: 900; }
  .card .desc { font-size: 14px; font-weight: 600; opacity: .8; }
  .card .tag { position: absolute; top: -10px; right: 10px; background: var(--red); color: #fff; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 8px; }
  .card.new { border-color: #ff5d75; box-shadow: 0 5px 0 #b8293f; }
  .card:active { transform: translateY(3px); box-shadow: 0 2px 0 #b97f22; }
  .cards .card:nth-child(2) { animation-delay: .06s; } .cards .card:nth-child(3) { animation-delay: .12s; } .cards .card:nth-child(4) { animation-delay: .18s; }
  @keyframes pop { from { transform: scale(.88); } }
  .link { background: none; color: #fff; opacity: .8; font-weight: 800; text-decoration: underline; padding: 8px; }
  .play:disabled { opacity: .6; animation: none; }
  #resultTitle.win { color: var(--gold); } #resultTitle.lose { color: #ff8a9a; }
  .stats { width: min(340px, 92%); background: var(--paper); border-radius: 16px; padding: 10px 16px; border: 3px solid #e8b04a; box-shadow: 0 5px 0 #b97f22; }
  .stats .row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; padding: 6px 0; }
  .stats .row + .row { border-top: 2px dashed rgba(42,29,61,.15); }
  .unlocks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; max-width: 340px; }
  .unlock { width: 100%; text-align: center; color: #fff; font-weight: 900; font-size: 17px; text-shadow: 0 2px 0 var(--ink); }
  @media (orientation: landscape) and (min-width: 700px) { .cards { flex-direction: row; } .card { flex: 1; grid-template-columns: 1fr; text-align: center; justify-items: center; } .card canvas { grid-row: auto; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen hidden">

</div>

<div id="shop" class="screen hidden">

  <h2 id="shopTitle" class="shoptitle"></h2>
  <div id="shopList" class="shoplist"></div>
</div>

<button id="specialBtn" class="hidden" aria-label="Special"><span></span></button>

<div id="perks" class="screen overlay hidden">
  <h2 id="perkTitle"></h2>
  <div id="perkCards" class="cards"></div>
</div>

<div id="revive" class="screen overlay hidden">
  <h2 id="reviveTitle"></h2>
  <button id="reviveBtn" class="play"></button>
  <button id="noThanksBtn" class="link"></button>
</div>

<div id="result" class="screen overlay hidden">
  <h2 id="resultTitle"></h2>
  <div id="resultStats" class="stats"></div>
  <div id="resultUnlocks" class="unlocks"></div>
  <button id="contBtn" class="play"></button>
</div>

<div id="swap" class="screen overlay hidden">
  <h2 id="swapTitle"></h2>
  <div id="swapHint" class="hint"></div>
  <div id="swapList" class="cards"></div>
</div>

  let lang = 'en', T = STRINGS.en;

  // ---------- Data ----------

  const rr = (a, b) => a + rng() * (b - a);
  const pick = (arr) => arr[(rng() * arr.length) | 0];

  function startRun(worldIdx, weaponId) {
    if (!(worldIdx >= 0 && worldIdx < save.worlds) || !save.weapons.includes(weaponId)) return;
    const maxHp = HERO_HP + 10 * save.up.hp;
    run = {
      world: worldIdx, t: 0, wave: 1, waveT: 0, hp: maxHp, maxHp,
      // Later worlds hand the starting weapon a head start, since every run begins with a single weapon.
      weapons: [{ id: weaponId, lv: 1 + worldIdx, cdT: 0 }],
      enemies: [], projectiles: [], particles: [], popups: [], fx: [],
      gold: 0, kills: 0, perks: {}, specialT: 0, revived: false, boss: null, offers: [], pending: null,
      spawnAcc: 0, found: [],
    };
    phase = 'play';
    show(null);
    send('level_started');
  }

  // ---------- Enemies & waves ----------
  const spawnRate = (wave, world) => (0.5 + 0.22 * (wave - 1)) * world.spawnMul;
  function spawnEnemy(id, angle, dist = SPAWN_R) {
    if (run.enemies.length >= CAPS.enemies) return null;
    const d = ENEMIES[id], world = WORLDS[run.world];
    const hp = d.hp * world.hpMul * (1 + 0.18 * (run.wave - 1));
    const e = { id, x: Math.cos(angle) * dist, y: Math.sin(angle) * dist, hp, maxHp: hp, speed: d.speed, dmg: d.dmg, r: d.r, gold: d.gold,
      hitT: 0, slowT: 0, flash: 0, whirlT: 0, seed: rng() * 10 };
    run.enemies.push(e);
    return e;
  }
  function updateEnemies(dt) {
    for (const e of run.enemies) {
      e.hitT = Math.max(0, e.hitT - dt);
      e.whirlT = Math.max(0, e.whirlT - dt);
      e.flash = Math.max(0, e.flash - dt);
      const d = Math.hypot(e.x, e.y) || 1, stop = HERO_R + e.r;
      if (d > stop) {
        const step = Math.min(d - stop, (run.freeze ? 0 : e.speed) * (e.slowT > 0 ? 0.5 : 1) * dt);
        e.x -= e.x / d * step; e.y -= e.y / d * step;
      } else if (e.hitT <= 0) {
        e.hitT = 0.8;
        hurtHero(e.dmg);
        // Knock the attacker back a little so the hero isn't buried.
        e.x += e.x / d * 18; e.y += e.y / d * 18;

  }
  function hurtHero(n) {
    run.hp -= n;
    run.hurtT = 0.25;
    onHurt(n);
  }
  function updateSpawner(dt) {
    if (run.noSpawn) return;
    const world = WORLDS[run.world];
    run.spawnAcc += spawnRate(run.wave, world) * dt;
    while (run.spawnAcc >= 1) {
      run.spawnAcc -= 1;
      spawnEnemy(pick(world.enemies), rng() * Math.PI * 2);
    }
  }
  function clearWave() {
    for (const e of run.enemies) burst(e.x, e.y, '#ffffff', 6);
    run.enemies.length = 0;
    run.projectiles.length = 0;
  }
  function endWave() {
    clearWave();
    if (run.wave < WAVES) openPerks(); else startBoss();
  }
  // ---------- Revive & result ----------
  const canRevive = () => !run.revived && !!B && !!(B.advertisement && B.advertisement.isRewardedSupported);
  let adFinish = null;
  function onDeath() {
    onDefeatSfx();
    $('reviveBtn').disabled = false;
    if (canRevive()) {
      $('reviveTitle').textContent = T.youFell;
      $('reviveBtn').textContent = T.reviveAd;
      $('noThanksBtn').textContent = T.noThanks;
      show('revive');
    } else endRun(false);
  }
  function requestRevive() {
    if (phase !== 'dead' || !canRevive()) return Promise.resolve();
    $('reviveBtn').disabled = true;
    return new Promise(resolve => {
      let granted = false, done = false;
      const ev = B.EVENT_NAME.REWARDED_STATE_CHANGED;
      const finish = (ok) => {
        if (done) return; done = true; adFinish = null;
        try { B.advertisement.off && B.advertisement.off(ev, handler); } catch (e) {}
        $('reviveBtn').disabled = false;
        if (phase === 'dead' && run) { if (ok) revive(); else endRun(false); }
        resolve();
      };
      adFinish = finish;
      const handler = (state) => {
        if (state === 'rewarded') granted = true;
        else if (state === 'closed') finish(granted);
        else if (state === 'failed') finish(false);
      };
      try {
        B.advertisement.on(ev, handler);
        const p = B.advertisement.showRewarded();
        if (p && p.catch) p.catch(() => finish(false));
      } catch (e) { finish(false); }
    });
  }
  function revive() {
    run.revived = true;
    run.hp = Math.round(run.maxHp * 0.5);
    run.enemies = run.enemies.filter(e => { const near = Math.hypot(e.x, e.y) <= 150; if (near) burst(e.x, e.y, '#ffffff', 6); return !near; });
    run.hurtT = 0;
    phase = run.boss ? 'boss' : 'play';
    show(null);
  }
  function endRun(won) {
    if (phase === 'result' || !run) return;
    if (!won) {
      save.coins += run.gold;
      persist();
      send('level_failed');
    }
    phase = 'result';
    renderResult(won);
    show('result');
  }
  function showResult(won) { endRun(won); }
  function renderResult(won) {
    $('resultTitle').textContent = won ? T.victory : T.defeat;
    $('resultTitle').className = won ? 'win' : 'lose';
    const rows = [[T.gold, '+' + run.gold], [T.kills, run.kills], [T.waveReached, won ? T.bossDown : run.wave + ' / ' + WAVES]];
    const box = $('resultStats');
    box.innerHTML = '';
    for (const [k, v] of rows) {
      const r = document.createElement('div'); r.className = 'row';
      r.innerHTML = '<span></span><b></b>';
      r.querySelector('span').textContent = k; r.querySelector('b').textContent = v;
      box.appendChild(r);
    }
    const un = $('resultUnlocks');
    un.innerHTML = '';
    const notes = [];
    if (run.newWorld) notes.push(T.newWorld);
    if (run.found.length) notes.push(T.unlocked + ': ' + run.found.map(id => T['w_' + id]).join(', '));
    for (const n of notes) { const d = document.createElement('div'); d.className = 'unlock'; d.textContent = n; un.appendChild(d); }
    for (const id of run.found) un.appendChild(iconCanvas('weapon:' + id, 44));
    $('contBtn').textContent = T.cont;
  }

  // ---------- Weapons ----------
  // Every weapon has its own targeting and hit shape, so stacking them changes how the hero fights.
  const dmgMul = () => (1 + 0.05 * save.up.dmg) * (1 + 0.15 * (run.perks.might || 0));
  const spdMul = () => (1 + 0.03 * save.up.spd) * (1 + 0.12 * (run.perks.haste || 0));
  const wLvMul = (lv) => 1 + 0.25 * (lv - 1);
  const wDmg = (w) => weaponById(w.id).dmg * wLvMul(w.lv) * dmgMul();
  const targets = () => (run.boss && run.boss.hp > 0 ? [...run.enemies, run.boss] : run.enemies);
  function nearest(x, y, skip) {
    let best = null, bd = Infinity;
    for (const e of targets()) {
      if (e.hp <= 0 || (skip && skip.has(e))) continue;
      const d = Math.hypot(e.x - x, e.y - y);
      if (d < bd) { bd = d; best = e; }
    }
    return best;
  }
  const push = (list, item, cap) => { if (list.length < cap) list.push(item); };
  function popup(x, y, text, color, big) { push(run.popups, { x, y, text, color, big, t: 0 }, CAPS.popups); }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
      push(run.particles, { x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.35 + Math.random() * 0.35, color, r: 2 + Math.random() * 3 }, CAPS.particles);
    }
  }
  function fx(item) { push(run.fx, Object.assign({ t: 0 }, item), 60); }

  function hitEnemy(e, amount, source) {
    if (e.hp <= 0) return;
    e.hp -= amount;
    e.flash = 0.12;
    popup(e.x, e.y - e.r, Math.round(amount), source === 'special' ? '#ffe14d' : '#ffffff', amount >= 40);
    onHit(source, e);
    if (e.hp <= 0) killEnemy(e);
  }
  function killEnemy(e) {
    if (e.isBoss) { onBossKilled(); return; }
    run.gold += Math.round(e.gold * (1 + 0.1 * save.up.gold));
    run.kills++;
    burst(e.x, e.y, enemyColor(e.id), 10);
    onKill(e);
    const i = run.enemies.indexOf(e);
    if (i >= 0) run.enemies.splice(i, 1);
  }

  function fireSword(w) {
    const t = nearest(0, 0);
    if (!t || Math.hypot(t.x, t.y) > 70 + t.r) return false;
    const a = Math.atan2(t.y, t.x);
    for (const e of targets().slice()) {
      const d = Math.hypot(e.x, e.y);
      let da = Math.abs(Math.atan2(e.y, e.x) - a); if (da > Math.PI) da = 2 * Math.PI - da;
      if (d <= 70 + e.r && da <= Math.PI / 3) hitEnemy(e, wDmg(w), 'sword');
    }
    fx({ kind: 'slash', a, life: 0.22 });
    return true;
  }
  function updateWhirl(w, dt) {
    w.spin = (w.spin || 0) + 3.5 * dt;
    const n = 1 + Math.floor(w.lv / 2);
    for (let i = 0; i < n; i++) {
      const a = w.spin + i * Math.PI * 2 / n, bx = Math.cos(a) * 55, by = Math.sin(a) * 55;
      for (const e of targets().slice()) {
        if (e.whirlT > 0) continue;
        if (Math.hypot(e.x - bx, e.y - by) <= e.r + 10) { e.whirlT = 0.4; hitEnemy(e, wDmg(w), 'whirl'); }
      }
    }
  }
  function shoot(kind, a, speed, dmg, pierce, extra) {
    push(run.projectiles, Object.assign({ kind, x: Math.cos(a) * HERO_R, y: Math.sin(a) * HERO_R, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      a, dmg, pierce, hit: new Set(), r: 4 }, extra), CAPS.projectiles);
  }
  function fireBow(w) {
    const t = nearest(0, 0); if (!t) return false;
    shoot('arrow', Math.atan2(t.y, t.x), 420, wDmg(w), 1 + Math.floor((w.lv - 1) / 2), { src: 'bow' });
    return true;
  }
  function fireFan(w) {
    const t = nearest(0, 0); if (!t) return false;
    const n = 5 + (w.lv - 1), spread = 70 * Math.PI / 180, a0 = Math.atan2(t.y, t.x);
    for (let i = 0; i < n; i++) shoot('arrow', a0 - spread / 2 + spread * i / (n - 1), 360, wDmg(w), 0, { src: 'fan' });
    return true;
  }
  function fireFire(w) {
    let best = null, bn = -1;

    }
    if (!best) return false;
    const a = Math.atan2(best.y, best.x);
    shoot('fire', a, 300, wDmg(w), 0, { tx: best.x, ty: best.y, blast: 55 + 6 * (w.lv - 1), r: 7, src: 'fire' });
    return true;
  }
  function fireStorm(w) {
    let cur = nearest(0, 0); if (!cur) return false;

      cur = next && Math.hypot(next.x - from.x, next.y - from.y) <= 120 ? next : null;

  }
  const FIRE = { sword: fireSword, bow: fireBow, fan: fireFan, fire: fireFire, storm: fireStorm };
  function updateWeapons(dt) {
    for (const w of run.weapons) {
      if (w.id === 'whirl') { updateWhirl(w, dt); continue; }
      w.cdT -= dt;

    }
  }
  function updateProjectiles(dt) {
    const list = run.projectiles;

      const p = list[i];

      let dead = Math.hypot(p.x, p.y) > SPAWN_R + 40;
      if (p.kind === 'fire') {
        if (Math.hypot(p.tx - p.x, p.ty - p.y) <= 300 * dt + 2) {
          for (const e of targets().slice()) if (Math.hypot(e.x - p.tx, e.y - p.ty) <= p.blast + e.r * 0.5) hitEnemy(e, p.dmg, 'fire');
          fx({ kind: 'boom', x: p.tx, y: p.ty, r: p.blast, life: 0.3 });
          burst(p.tx, p.ty, '#ff9a3c', 8);
          dead = true;
        }
      } else {
        for (const e of targets().slice()) {

  function updateFx(dt) {

        const p = list[i]; p.t += dt;
        if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.9; p.vy *= 0.9; }
        if (p.t >= (p.life || 0.8)) list.splice(i, 1);
      }
    }
  }

  // ---------- Perks ----------
  const PERKS = ['might', 'haste', 'vital', 'regen', 'special'];
  const PERK_MAX = 5;
  function offerableWeapons() {
    const held = new Set(run.weapons.map(w => w.id));
    return WEAPONS.filter(w => w.minWorld <= run.world && !held.has(w.id)).map(w => w.id);
  }
  function makeOffers() {
    const out = [], key = (o) => o.kind + ':' + o.id;
    const add = (o) => { if (o && !out.some(x => key(x) === key(o))) out.push(o); };
    const ws = offerableWeapons();
    if (ws.length && (run.wave === 1 || rng() < 0.35)) add({ kind: 'weapon', id: pick(ws) });
    const pool = [];
    for (const w of run.weapons) if (w.lv < MAX_WEAPON_LV) pool.push({ kind: 'level', id: w.id });
    for (const p of PERKS) if ((run.perks[p] || 0) < PERK_MAX) pool.push({ kind: 'perk', id: p });
    while (out.length < 3 && pool.length) add(pool.splice((rng() * pool.length) | 0, 1)[0]);
    return out;
  }
  function openPerks() {
    phase = 'perk';
    run.offers = makeOffers();
    renderPerks();
    show('perks');
  }
  function addWeapon(id) {
    run.weapons.push({ id, lv: 1, cdT: 0 });
    unlockWeapon(id);
  }
  function unlockWeapon(id) {
    if (!save.weapons.includes(id)) { save.weapons.push(id); run.found.push(id); persist(); }
  }
  function choosePerk(i) {
    if (phase !== 'perk') return;
    const o = run.offers[i];
    if (!o) return;
    if (o.kind === 'weapon') {
      if (run.weapons.length >= MAX_WEAPONS) {
        phase = 'swap'; run.pending = o.id;
        renderSwap(); show('swap');
        return;
      }
      addWeapon(o.id);
    } else if (o.kind === 'level') {
      const w = run.weapons.find(x => x.id === o.id);
      if (w) w.lv = Math.min(MAX_WEAPON_LV, w.lv + 1);
    } else {
      run.perks[o.id] = (run.perks[o.id] || 0) + 1;
      if (o.id === 'vital') { run.maxHp += 25; run.hp = run.maxHp; }
    }
    onPerk(o);
    nextWave();
  }
  function dropWeapon(id) {
    if (phase !== 'swap') return;
    const pend = run.pending;
    unlockWeapon(pend);
    if (id !== pend) {
      run.weapons = run.weapons.filter(w => w.id !== id);
      run.weapons.push({ id: pend, lv: 1, cdT: 0 });
    }
    run.pending = null;
    nextWave();
  }
  function nextWave() {
    run.wave++; run.waveT = 0; run.spawnAcc = 0;
    phase = 'play';
    show(null);
  }
  function offerText(o) {
    if (o.kind === 'weapon') return { tag: T.newWeapon, name: T['w_' + o.id], desc: T['wd_' + o.id] };
    if (o.kind === 'level') {
      const w = run.weapons.find(x => x.id === o.id);
      return { tag: T.levelUp, name: T['w_' + o.id] + ' ' + T.lv + ' ' + ((w ? w.lv : 0) + 1), desc: T.levelDesc };
    }
    return { tag: '', name: T['p_' + o.id], desc: T['pd_' + o.id] };
  }
  // Taps that land right after an overlay opens belong to the previous screen (e.g. a double tap).
  let overlayAt = 0;
  const overlayReady = () => performance.now() - overlayAt >= 300;
  function renderPerks() {
    overlayAt = performance.now();
    $('perkTitle').textContent = T.pickOne;
    const box = $('perkCards');
    box.innerHTML = '';
    run.offers.forEach((o, i) => {
      const tx = offerText(o), b = document.createElement('button');
      b.className = 'card' + (o.kind === 'weapon' ? ' new' : '');
      const ic = iconCanvas(o.kind === 'perk' ? 'perk:' + o.id : 'weapon:' + o.id, 56);
      b.appendChild(ic);
      b.insertAdjacentHTML('beforeend', (tx.tag ? '<span class="tag"></span>' : '') + '<b></b><span class="desc"></span>');
      if (tx.tag) b.querySelector('.tag').textContent = tx.tag;
      b.querySelector('b').textContent = tx.name;
      b.querySelector('.desc').textContent = tx.desc;
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); if (overlayReady()) choosePerk(i); });
      box.appendChild(b);
    });
  }
  function renderSwap() {
    overlayAt = performance.now();
    $('swapTitle').textContent = T.swapTitle;
    $('swapHint').textContent = T.swapHint;
    const box = $('swapList');
    box.innerHTML = '';
    for (const id of [...run.weapons.map(w => w.id), run.pending]) {
      const b = document.createElement('button');
      b.className = 'card' + (id === run.pending ? ' new' : '');
      b.appendChild(iconCanvas('weapon:' + id, 48));
      b.insertAdjacentHTML('beforeend', '<b></b>');
      b.querySelector('b').textContent = T['w_' + id];
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); if (overlayReady()) dropWeapon(id); });
      box.appendChild(b);
    }
  }
  // Small canvases for DOM icons; drawn by the Render section.
  function iconCanvas(what, size) {
    const c = document.createElement('canvas');
    c.width = c.height = size * 2; c.style.width = c.style.height = size + 'px';
    drawIcon(c.getContext('2d'), what, size * 2);
    return c;
  }

  // ---------- Special ----------
  const SPECIAL_CD = 20, SPECIAL_R = 170, SPECIAL_DMG = 60;
  const specialCd = () => SPECIAL_CD * (1 - 0.05 * save.up.spc) * 0.88 ** (run.perks.special || 0);
  const specialReady = () => run && run.specialT >= specialCd();
  function useSpecial() {
    if ((phase !== 'play' && phase !== 'boss') || paused || !specialReady()) return false;
    for (const e of targets().slice()) {
      const d = Math.hypot(e.x, e.y);
      if (d > SPECIAL_R + e.r) continue;
      hitEnemy(e, SPECIAL_DMG * dmgMul(), 'special');
      if (e.hp > 0 && !e.isBoss && d > 0) { e.x += e.x / d * 60; e.y += e.y / d * 60; }
    }
    if (phase === 'boss') interruptBoss();
    run.specialT = 0;
    fx({ kind: 'nova', r: SPECIAL_R, life: 0.45 });
    onSpecial();
    return true;
  }

  // ---------- Boss ----------
  const BOSSES = {
    troll: { hp: 2600, r: 46, slam: 22, summon: 'goblin', windup: 3 },
    wyrm: { hp: 4200, r: 50, slam: 30, summon: 'bat', windup: 2.6 },
    king: { hp: 6500, r: 48, slam: 40, summon: 'skeleton', windup: 2.2 },
  };
  const BOSS_SPEED = 40;
  // The boss stops close enough for melee weapons to reach it.
  const bossStop = (b) => HERO_R + b.r + 30;
  function startBoss() {
    const id = WORLDS[run.world].boss, d = BOSSES[id];
    run.boss = { id, isBoss: true, x: 0, y: -150, hp: d.hp, maxHp: d.hp, r: d.r, state: 'walk', t: 0, attackT: 0, summonT: 0, flash: 0, whirlT: 0, hitT: 0 };
    phase = 'boss';
    onBossIntro();
  }
  function updateBoss(dt) {
    const b = run.boss, d = BOSSES[b.id];
    b.flash = Math.max(0, b.flash - dt);
    b.whirlT = Math.max(0, b.whirlT - dt);
    b.t += dt;
    const dist = Math.hypot(b.x, b.y) || 1, stop = bossStop(b);
    if (dist > stop) { const s = Math.min(dist - stop, BOSS_SPEED * dt); b.x -= b.x / dist * s; b.y -= b.y / dist * s; }
    if (!run.noSpawn) {
      b.summonT += dt;
      if (b.summonT >= 8) {
        b.summonT = 0;
        const a0 = Math.atan2(b.y, b.x);
        for (let i = 0; i < 3; i++) spawnEnemy(d.summon, a0 + (i - 1) * 0.5, dist + 20);
      }
    }
    if (b.state === 'windup') {
      if (b.t >= d.windup) { hurtHero(d.slam); b.state = 'recover'; b.t = 0; b.rest = 1.5; onBossSlam(); }
    } else if (b.state === 'recover') {
      if (b.t >= b.rest) { b.state = 'idle'; b.t = 0; }
    } else if (dist <= stop + 1) {
      b.state = 'idle';
      b.attackT += dt;

  function onBossKilled() {

  function update(dt) {
    if (paused) return;
    if (phase === 'win') {
      run.winT += dt; updateFx(dt);
      if (run.winT >= 1.5) showResult(true);
      return;
    }
    if (phase !== 'play' && phase !== 'boss') return;
    run.t += dt;
    run.specialT += dt;
    if (run.perks.regen) run.hp = Math.min(run.maxHp, run.hp + run.perks.regen * dt);
    run.hurtT = Math.max(0, (run.hurtT || 0) - dt);
    if (phase === 'play') { run.waveT += dt; updateSpawner(dt); }
    updateEnemies(dt);
    if (phase === 'boss' && run.boss) updateBoss(dt);
    updateWeapons(dt);
    updateProjectiles(dt);
    updateFx(dt);
    if (phase === 'win') return;
    if (run.hp <= 0) { run.hp = 0; phase = 'dead'; onDeath(); return; }
    if (phase === 'play' && run.waveT >= WAVE_TIME) endWave();

  // ---------- Shop & menu ----------

  const UP_MAX = 10;
  const upCost = (id) => Math.round(SHOP.find(u => u.id === id).base * 1.5 ** save.up[id]);
  function buyUpgrade(id) {
    if (save.up[id] >= UP_MAX || save.coins < upCost(id)) return false;
    save.coins -= upCost(id);
    save.up[id]++;

  }
  function selectWorld(i) {

  // ---------- Render ----------
  // Everything is drawn in code: chunky rounded shapes, dark outline, two-tone shading.
  const OUT = '#2a1d3d';
  let S = 1, CX = 0, CY = 0, shakeT = 0, shakeMag = 0, freezeT = 0, lastRender = 0, menuT = 0;
  const coinFx = [];
  const ENEMY_COLORS = { slime: '#6fe06a', goblin: '#9bd24a', wolf: '#a7a3b8', bat: '#a86bff', spider: '#4b3a66', golem: '#8fa7c9',
    skeleton: '#f1ead6', knight: '#c4ccd9', wraith: '#b4a0ff' };
  const enemyColor = (id) => ENEMY_COLORS[id] || '#ffffff';
  const shade = (hex, k) => {
    const n = parseInt(hex.slice(1), 16), f = (c) => Math.max(0, Math.min(255, Math.round(c * k)));

  function ell(g, x, y, rx, ry, fill, lw) {

  }

    }
  }

  // ----- Weapon art (shared by the hero, icons and covers). Drawn pointing right, ~40 units long.
  function drawWeaponArt(g, id, t) {
    if (id === 'sword') {
      poly(g, [[-4, -3], [30, -3], [38, 0], [30, 3], [-4, 3]], '#eef2ff', 2);
      g.fillStyle = 'rgba(160,170,210,.6)'; g.fillRect(0, 0, 30, 2.5);
      rrect(g, -6, -9, 5, 18, 2, '#ffc531', 2);
      rrect(g, -16, -2.5, 11, 5, 2, '#8a5a2b', 2);
    } else if (id === 'whirl') {
      for (let i = 0; i < 3; i++) {
        g.save(); g.rotate(t * 6 + i * Math.PI * 2 / 3);
        poly(g, [[3, -3], [20, -9], [16, 0], [3, 3]], '#cfe9ff', 2);
        g.restore();
      }
      ell(g, 0, 0, 5, 5, '#ffc531', 2);
    } else if (id === 'bow' || id === 'fan') {
      g.lineCap = 'round';
      g.lineWidth = 6; g.strokeStyle = OUT; g.beginPath(); g.arc(-6, 0, 18, -1.2, 1.2); g.stroke();
      g.lineWidth = 3.5; g.strokeStyle = id === 'fan' ? '#e0a33a' : '#a8642e'; g.beginPath(); g.arc(-6, 0, 18, -1.2, 1.2); g.stroke();
      g.lineWidth = 1.2; g.strokeStyle = '#fff'; g.beginPath(); g.moveTo(0.5, -16.8); g.lineTo(0.5, 16.8); g.stroke();
      const n = id === 'fan' ? 3 : 1;
      for (let i = 0; i < n; i++) {
        g.save(); g.rotate((i - (n - 1) / 2) * 0.35);
        g.lineWidth = 2; g.strokeStyle = OUT; g.beginPath(); g.moveTo(-2, 0); g.lineTo(24, 0); g.stroke();
        poly(g, [[24, -3.5], [30, 0], [24, 3.5]], '#dfe6f2', 1.5);
        g.restore();
      }
    } else if (id === 'fire') {
      rrect(g, -18, -2.5, 34, 5, 2, '#7a4a25', 2);
      const f = 1 + Math.sin(t * 14) * 0.08;
      ell(g, 20, 0, 9 * f, 9 * f, '#ff7b2e', 2);
      ell(g, 21, -1, 5.5 * f, 5.5 * f, '#ffd166', 0);
      ell(g, 22, -2, 2.2, 2.2, '#fff6d6', 0);
    } else if (id === 'storm') {
      rrect(g, -18, -2.5, 30, 5, 2, '#41507a', 2);

  // ----- Hero: a cheerful little knight who visibly holds every held weapon.
  function drawHero(g, x, y, scale, t, weapons, aim, hurt) {
    g.save(); g.translate(x, y); g.scale(scale, scale);
    ell(g, 0, 15, 16, 6, 'rgba(0,0,0,.22)', 0);
    const bob = Math.sin(t * 6) * 1.2;
    const slots = [[aim, 20], [aim + 2.2, 17], [aim - 2.2, 17]];
    (weapons || []).forEach((w, i) => {
      if (w.id === 'whirl') return;
      const [a, d] = slots[i] || slots[0];
      g.save(); g.translate(Math.cos(a) * d * 0.6, Math.sin(a) * d * 0.6 + bob); g.rotate(a); g.scale(0.6, 0.6); drawWeaponArt(g, w.id, t); g.restore();
    });
    ell(g, 0, 4 + bob, 13, 12, hurt ? '#ff8a9a' : '#4f7dff', 2.5);
    ell(g, -3, 1 + bob, 6, 5, 'rgba(255,255,255,.25)', 0);
    rrect(g, -13, 6 + bob, 26, 4, 2, '#ffc531', 2);
    ell(g, 0, -10 + bob, 11, 10, '#ffd9b3', 2.5);
    g.beginPath(); g.arc(0, -12 + bob, 11.5, Math.PI, 0); g.closePath(); g.fillStyle = '#d7deea'; g.fill(); g.lineWidth = 2.5; g.strokeStyle = OUT; g.stroke();

  // ----- Enemies. Each kind has its own silhouette; all squash and stretch while walking.
  function drawEnemy(g, e, t) {
    const col = e.flash > 0 ? '#ffffff' : enemyColor(e.id), dark = shade(enemyColor(e.id), 0.72);
    const r = e.r, ph = t * 9 + e.seed, sq = 1 + Math.sin(ph) * 0.08;
    const face = Math.atan2(-e.y, -e.x);

        ell(g, -r * 0.35, -r * 0.45, r * 0.25, r * 0.18, 'rgba(255,255,255,.55)', 0);
        eyes(g, fx, -r * 0.05, r * 0.33, r * 0.2, false); break;
      case 'goblin':

        poly(g, [[r * 0.7, -r * 0.3], [r * 1.5, -r * 0.8], [r * 0.6, -r * 0.8]], col, 2);
        ell(g, 0, 0, r * 0.9, r, col, 2.2); ell(g, 0, r * 0.45, r * 0.7, r * 0.4, '#8a5a2b', 0);
        eyes(g, fx, -r * 0.2, r * 0.32, r * 0.2, true); break;
      case 'wolf':
        g.rotate(face);
        ell(g, -r * 0.3, 0, r * 1.2, r * 0.75, col, 2.2);
        poly(g, [[r * 0.4, -r * 0.9], [r * 0.7, -r * 1.5], [r * 0.95, -r * 0.7]], dark, 2);
        poly(g, [[r * 0.4, r * 0.9], [r * 0.7, r * 1.5], [r * 0.95, r * 0.7]], dark, 2);
        ell(g, r * 0.75, 0, r * 0.55, r * 0.5, col, 2); ell(g, r * 1.25, 0, r * 0.18, r * 0.18, OUT, 0);
        ell(g, r * 0.85, -r * 0.22, r * 0.12, r * 0.12, '#ffe14d', 0); ell(g, r * 0.85, r * 0.22, r * 0.12, r * 0.12, '#ffe14d', 0); break;
      case 'bat': {
        const fl = Math.sin(t * 22 + e.seed) * 0.5;
        for (const sx of [-1, 1]) poly(g, [[sx * r * 0.4, 0], [sx * r * 1.7, -r * (0.6 + fl)], [sx * r * 1.3, r * 0.2], [sx * r * 1.6, r * 0.5], [sx * r * 0.5, r * 0.4]], dark, 2);
        ell(g, 0, 0, r * 0.7, r * 0.75, col, 2.2);

        }

        for (const [ex, ey] of [[-0.3, -0.1], [0.3, -0.1], [-0.15, 0.2], [0.15, 0.2]]) ell(g, ex * r + fx * 0.4, ey * r, r * 0.12, r * 0.12, '#ff5d75', 0); break;
      case 'golem':

        rrect(g, -r * 0.6, -r * 0.6, r * 0.5, r * 0.45, 3, dark, 0); rrect(g, r * 0.25, r * 0.15, r * 0.5, r * 0.4, 3, dark, 0);
        ell(g, -r * 0.35 + fx, -r * 0.15, r * 0.16, r * 0.16, '#5ef0d2', 0); ell(g, r * 0.35 + fx, -r * 0.15, r * 0.16, r * 0.16, '#5ef0d2', 0); break;
      case 'skeleton':
        ell(g, 0, r * 0.4, r * 0.55, r * 0.5, dark, 2);
        ell(g, 0, -r * 0.2, r * 0.85, r * 0.8, col, 2.2);
        ell(g, -r * 0.3 + fx, -r * 0.25, r * 0.22, r * 0.25, OUT, 0); ell(g, r * 0.3 + fx, -r * 0.25, r * 0.22, r * 0.25, OUT, 0);
        g.fillStyle = OUT; for (let i = -1; i <= 1; i++) g.fillRect(i * r * 0.22 - r * 0.06 + fx, r * 0.25, r * 0.12, r * 0.18); break;
      case 'knight':
        ell(g, 0, 0, r, r * 0.95, col, 2.4);
        rrect(g, -r * 0.7 + fx, -r * 0.25, r * 1.4, r * 0.28, 3, OUT, 0);
        ell(g, -r * 0.3 + fx, -r * 0.11, r * 0.1, r * 0.1, '#ff5d75', 0); ell(g, r * 0.3 + fx, -r * 0.11, r * 0.1, r * 0.1, '#ff5d75', 0);
        poly(g, [[0, -r * 0.9], [r * 0.3, -r * 1.6], [r * 0.6, -r * 1.3], [r * 0.25, -r * 0.8]], '#ec3d55', 2);

  // ----- Bosses: oversized, with their own shapes.
  function drawBoss(g, b, t) {
    const d = BOSSES[b.id], r = b.r, flash = b.flash > 0;
    const lift = b.state === 'windup' ? Math.min(1, b.t / d.windup) : 0;
    g.save(); g.translate(b.x, b.y);
    ell(g, 0, r * 0.85, r * 1.05, r * 0.35, 'rgba(0,0,0,.25)', 0);
    const sq = 1 + Math.sin(t * 4) * 0.04 + lift * 0.12;
    g.scale(1 / sq, sq);
    if (b.id === 'troll') {
      const c = flash ? '#fff' : '#69b85a';
      for (const sx of [-1, 1]) { g.save(); g.translate(sx * r * 0.95, -r * 0.1 - lift * r * 0.6 * (sx > 0 ? 1 : 0.4)); ell(g, 0, 0, r * 0.35, r * 0.5, c, 3); g.restore(); }
      ell(g, 0, 0, r, r * 0.92, c, 3);
      ell(g, 0, -r * 0.65, r * 0.75, r * 0.32, '#3d8a3a', 0);
      for (let i = 0; i < 5; i++) ell(g, (i - 2) * r * 0.3, -r * 0.8, r * 0.14, r * 0.1, '#9be15d', 0);
      eyes(g, 0, -r * 0.2, r * 0.3, r * 0.15, true);
      poly(g, [[-r * 0.35, r * 0.25], [-r * 0.25, r * 0.05], [-r * 0.15, r * 0.25]], '#fff6e3', 2); poly(g, [[r * 0.35, r * 0.25], [r * 0.25, r * 0.05], [r * 0.15, r * 0.25]], '#fff6e3', 2);
    } else if (b.id === 'wyrm') {
      const c = flash ? '#fff' : '#7b5cff';
      for (let i = 4; i >= 1; i--) ell(g, Math.sin(t * 2 + i) * r * 0.25, -r * 0.2 - i * r * 0.32, r * (0.75 - i * 0.1), r * (0.6 - i * 0.08), shade('#7b5cff', 0.8 + i * 0.05), 2.5);
      ell(g, 0, 0, r, r * 0.85, c, 3);
      for (const sx of [-1, 1]) poly(g, [[sx * r * 0.45, -r * 0.6], [sx * r * 0.85, -r * 1.35], [sx * r * 0.9, -r * 0.5]], '#5ef0d2', 2.5);
      eyes(g, 0, -r * 0.15, r * 0.33, r * 0.16, true);
      ell(g, 0, r * 0.35, r * 0.4, r * 0.15 + lift * r * 0.2, OUT, 0);
    } else {
      const c = flash ? '#fff' : '#3b2d5c';

      ell(g, 0, -r * 0.1, r * 0.75, r * 0.75, c, 3);

  function render() {

    if (!canPlay()) return;
    const t0 = actx.currentTime + (o.delay || 0), v = actx.createOscillator(), g = actx.createGain();
    v.type = o.type || 'sine'; v.frequency.setValueAtTime(f, t0);
    if (o.to) v.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    v.connect(g); out(g, o.pan, o.send);
    track(v); v.start(t0); v.stop(t0 + dur + 0.05);
  }
  function hiss(peak, dur, o = {}) {
    if (!canPlay()) return;
    const t0 = actx.currentTime + (o.delay || 0), s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; s.loop = true;
    f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.f || 1500, t0); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g); out(g, o.pan, o.send);
    track(s); s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  }
  const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const sfx = {
    hit(src) {
      if (src === 'sword') { hiss(0.12, 0.09, { f: 2400, to: 900, q: 1.2 }); osc(rnd(160, 190), 0.16, 0.1, { to: 100 }); }
      else if (src === 'whirl') hiss(0.05, 0.06, { f: 4200, q: 3, pan: rnd(-0.4, 0.4) });
      else if (src === 'bow') { hiss(0.06, 0.05, { f: 3200, q: 4 }); osc(rnd(420, 480), 0.05, 0.05, { to: 260 }); }
      else if (src === 'fan') { for (let i = 0; i < 3; i++) hiss(0.04, 0.04, { f: 3000 + i * 400, q: 4, delay: i * 0.018, pan: (i - 1) * 0.3 }); }
      else if (src === 'fire') { osc(90, 0.2, 0.28, { to: 45 }); hiss(0.1, 0.3, { filter: 'lowpass', f: 1400, to: 300 }); hiss(0.04, 0.2, { f: 5000, q: 0.7, delay: 0.05 }); }
      else if (src === 'storm') { hiss(0.08, 0.06, { filter: 'highpass', f: 3500 }); osc(1318.51, 0.035, 0.6, { send: 0.6, type: 'triangle' }); }
      else if (src === 'special') { osc(110, 0.22, 0.5, { to: 55 }); hiss(0.1, 0.6, { filter: 'lowpass', f: 2600, to: 200 }); }
    },
    kill(n = 0) {
      const f = PENTA[Math.min(n, PENTA.length - 1)];
      hiss(0.07, 0.04, { f: rnd(1600, 2200), q: 4, pan: rnd(-0.3, 0.3) });
      osc(f, 0.05, 0.5, { send: 0.55, pan: rnd(-0.25, 0.25) });
      if (n >= 4) osc(f * 1.5, 0.02, 0.4, { delay: 0.05, send: 0.6 });
    },
    coin() { osc(PENTA[7], 0.03, 0.3, { send: 0.4 }); },
    hurt() { osc(150, 0.12, 0.14, { to: 90, type: 'triangle' }); hiss(0.06, 0.08, { filter: 'lowpass', f: 700 }); },
    special() { hiss(0.12, 0.7, { f: 300, to: 3000, q: 0.8, attack: 0.05 }); [0, 2, 4, 7].forEach((k, i) => osc(PENTA[k], 0.05, 0.9, { delay: i * 0.05, send: 0.6 })); },
    perk(weapon) { [2, 4, 6].forEach((k, i) => osc(PENTA[k] * (weapon ? 1.5 : 1), 0.05, 0.6, { delay: i * 0.07, send: 0.5 })); },
    levelUp() { [0, 2, 4, 5, 7].forEach((k, i) => osc(PENTA[k], 0.045, 0.5, { delay: i * 0.05, send: 0.5 })); },
    bossIntro() { hiss(0.09, 1.6, { filter: 'lowpass', f: 200, to: 900, attack: 0.6 }); osc(55, 0.16, 1.8, { attack: 0.5, to: 45 }); },
    bossWindup() { osc(70, 0.1, 1.6, { attack: 0.8, to: 140, type: 'triangle' }); },
    bossSlam() { osc(60, 0.28, 0.45, { to: 35 }); hiss(0.14, 0.35, { filter: 'lowpass', f: 500 }); },
    victory() { PENTA.forEach((f, i) => osc(f, 0.05, 1.2, { delay: i * 0.07, send: 0.6, pan: i % 2 ? 0.3 : -0.3 })); },
    defeat() { [4, 2, 0].forEach((k, i) => osc(PENTA[k] / 2, 0.06, 0.8, { delay: i * 0.18, send: 0.5, type: 'triangle' })); },
    ui() { osc(620, 0.06, 0.08, { to: 880 }); hiss(0.03, 0.03, { f: 3000, q: 3 }); },
    buy() { [0, 2, 4].forEach((k, i) => osc(PENTA[k + 2], 0.06, 0.6, { delay: i * 0.07, send: 0.5 })); },
  };
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  function syncAudio() { if (!actx) return; if (audioOn && !paused) actx.resume(); else actx.suspend(); }

  // ---------- Boot ----------
  // A long gap (tab frozen, Bridge pause) is clamped to one short step.
  function advance(ms) { if (!paused) update(Math.min(ms / 1000, 0.05)); }
  function frame(t) {
    advance(t - lastT);
    lastT = t;
    render();
    requestAnimationFrame(frame);
  }
  async function boot() {
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('pointerdown', unlockAudio, true);
    document.addEventListener('click', e => { if (e.target.closest && e.target.closest('button')) sfx.ui(); });
    $('specialBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); useSpecial(); });
    $('reviveBtn').onclick = () => requestRevive();
    $('noThanksBtn').onclick = () => { if (adFinish) adFinish(false); else endRun(false); };
    $('contBtn').onclick = () => toMenu();
    $('playBtn').onclick = () => startRun(save.world, save.start);
    $('shopBtn').onclick = () => { phase = 'shop'; renderShop(); show('shop'); };
    $('shopBack').onclick = () => toMenu();
    window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') { if (useSpecial()) e.preventDefault(); } });

    try {
      if (window.bridge) { await bridge.initialize(); B = bridge; }
    } catch (e) { B = null; }
    if (B) {
      lang = String(B.platform.language || 'en').slice(0, 2).toLowerCase();
      if (!STRINGS[lang]) lang = 'en';
      T = STRINGS[lang];
      B.platform.on(B.EVENT_NAME.PAUSE_STATE_CHANGED, v => { paused = v; syncAudio(); });
      B.platform.on(B.EVENT_NAME.AUDIO_STATE_CHANGED, v => { audioOn = v; syncAudio(); });
      await load();
    }

    if (/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) $('homeLink').classList.remove('hidden');

    toMenu();
    render();
    send('game_ready');
    window.dispatchEvent(new Event('hh-ready'));
    requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
  }

  // @test-hook
  boot();
})();
</script>
