<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pirate Hill Rush</title>
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
<style>
  :root { --ink: #2a1d12; --gold: #ffc531; --gold-d: #e39a12; --accent: #2f7bd8; --green: #36c46b; --red: #e8364f; --sea: #0f3a63; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f2a45; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 16px; overflow-y: auto; }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; }
  .pill { background: rgba(15,20,40,.72); color: #fff; border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; }
  .coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 45%, var(--gold-d)); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); flex: none; display: inline-block; }
  .topbar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; }

  /* Menu */
  #menu { justify-content: space-between; }
  .title { text-align: center; margin-top: 3vh; }
  .title h1 { margin: 0; font-size: clamp(42px, 12.5vw, 74px); line-height: .9; font-weight: 900; font-family: Impact, "Arial Black", system-ui, sans-serif; letter-spacing: 1px;
    color: var(--gold); -webkit-text-stroke: 3px #3a1c06; paint-order: stroke fill; text-shadow: 0 6px 0 #3a1c06; }
  .title .stage { margin-top: 14px; display: inline-block; background: var(--accent); color: #fff; font-weight: 900; padding: 6px 16px; border-radius: 10px; box-shadow: 0 4px 0 #1c4f91; }
  .bottom { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-bottom: 8px; }
  .play { width: min(360px, 90%); padding: 18px; font-size: 26px; font-weight: 900; color: #fff; background: var(--green); border-radius: 18px; box-shadow: 0 6px 0 #22924c; animation: pulse 1.2s infinite; }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 #22924c; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .shopBtn { background: #c4562b; color: #fff; font-weight: 900; padding: 12px 34px; border-radius: 14px; box-shadow: 0 5px 0 #8a3515; font-size: 17px; position: relative; }
  .home { color: #fff; opacity: .8; font-weight: 800; font-size: 14px; text-decoration: none; padding: 4px 10px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .badge { position: absolute; top: -8px; right: -8px; background: var(--red); color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 7px; }

  /* Shop */
  #shop { background: #f3e6cc; }
  #shop h2 { margin: 8px 0; font-size: 30px; font-weight: 900; }
  .tabs { display: flex; gap: 6px; width: 100%; max-width: 520px; margin-bottom: 8px; }
  .tab { flex: 1; padding: 9px 4px; border-radius: 10px; background: #fff; font-weight: 900; font-size: 13px; box-shadow: 0 3px 0 #d6c39c; }
  .tab.on { background: var(--ink); color: #fff; box-shadow: 0 3px 0 #000; }
  .hint { font-size: 13px; opacity: .7; margin-bottom: 10px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 520px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: #fff; border-radius: 16px; padding: 10px; text-align: center; box-shadow: 0 4px 0 #d6c39c; display: flex; flex-direction: column; gap: 6px; align-items: center; border: 3px solid transparent; }
  .card.eq { border-color: var(--green); }
  .card canvas { width: 100%; height: 84px; border-radius: 10px; }
  .card .em { font-size: 44px; line-height: 84px; height: 84px; }
  .card .nm { font-weight: 900; }
  .card .ds { font-size: 12px; opacity: .7; min-height: 30px; }
  .card .lv { font-size: 12px; font-weight: 900; background: #ffe7a8; border-radius: 6px; padding: 1px 8px; }
  .card button { width: 100%; padding: 8px; border-radius: 10px; font-weight: 900; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .card button .coin { width: 16px; height: 16px; }
  .b-buy { background: var(--gold); box-shadow: 0 3px 0 var(--gold-d); }
  .b-buy.poor { background: #e3e3e3; box-shadow: 0 3px 0 #bbb; color: #888; }
  .b-eq { background: var(--accent); color: #fff; box-shadow: 0 3px 0 #1c4f91; }
  .b-on { background: var(--green); color: #fff; }
  .b-lock { background: #3a2a1d; color: #fff; font-size: 12px; }
  .back { margin: 16px 0; background: var(--ink); color: #fff; font-weight: 900; padding: 12px 36px; border-radius: 14px; }

  /* Matchmaking */
  #match { background: rgba(10,22,40,.92); color: #fff; justify-content: center; gap: 12px; }
  #match h2 { margin: 0; font-size: 26px; font-weight: 900; }
  #match .count { font-size: 44px; font-weight: 900; color: var(--gold); }
  .plist { width: min(340px, 90vw); display: flex; flex-direction: column; gap: 6px; min-height: 170px; }
  .prow { background: rgba(255,255,255,.1); border-radius: 10px; padding: 6px 12px; display: flex; justify-content: space-between; font-weight: 700; animation: slide .25s ease-out; }
  .prow .ping { opacity: .6; font-size: 13px; }
  .prow.me { background: var(--green); }
  @keyframes slide { from { transform: translateX(-20px); opacity: 0; } }
  .spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result */
  #result { background: rgba(10,22,40,.9); color: #fff; justify-content: center; gap: 14px; text-align: center; }
  #result h2 { margin: 0; font-size: clamp(28px, 8.5vw, 44px); font-weight: 900; color: var(--gold); -webkit-text-stroke: 2px #7a4a00; paint-order: stroke fill; }
  #result .sub { font-weight: 800; opacity: .85; }
  .board { width: min(340px, 90vw); display: flex; flex-direction: column; gap: 5px; }
  .brow { display: flex; justify-content: space-between; background: rgba(255,255,255,.12); border-radius: 8px; padding: 6px 12px; font-weight: 800; }
  .brow.me { background: var(--green); }
  .reward { display: flex; align-items: center; gap: 10px; font-size: 34px; font-weight: 900; }
  .reward .coin { width: 34px; height: 34px; }
  .unlock { background: var(--accent); border-radius: 12px; padding: 8px 14px; font-weight: 800; }
  .cont { background: var(--green); color: #fff; font-weight: 900; font-size: 20px; padding: 14px 40px; border-radius: 16px; box-shadow: 0 5px 0 #22924c; }

  /* Touch controls: analog stick (left), pedals + punch (right) */
  #ctl { position: fixed; inset: 0; pointer-events: none; }
  #stick { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.10) 40%, rgba(255,255,255,.22) 70%); border: 3px solid rgba(255,255,255,.45); pointer-events: auto; touch-action: none; }
  #stick .ar { position: absolute; color: rgba(255,255,255,.75); font-weight: 900; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #e8e2d2 55%, #b8ab8e); box-shadow: 0 4px 10px rgba(0,0,0,.35); border: 3px solid #5a4630; }
  #stickLbl { position: absolute; left: 0; right: 0; bottom: -18px; text-align: center; color: #fff; font-weight: 900; font-size: 11px; opacity: .8; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .pedal { position: absolute; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .5px;
    border-radius: 16px; pointer-events: auto; touch-action: none; text-shadow: 0 1px 2px rgba(0,0,0,.4);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 6px, transparent 6px 14px); }
  .pedal.on { transform: translateY(4px) scale(.97); filter: brightness(1.15); }
  #gas { right: max(14px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 88px; height: 132px; background-color: #34b862; box-shadow: 0 6px 0 #1f7a3e, 0 8px 16px rgba(0,0,0,.3); }
  #brake { right: calc(max(14px, env(safe-area-inset-right)) + 100px); bottom: max(22px, env(safe-area-inset-bottom)); width: 74px; height: 96px; background-color: #d9433f; box-shadow: 0 6px 0 #8f2522, 0 8px 16px rgba(0,0,0,.3); }
  #punch { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: calc(max(22px, env(safe-area-inset-bottom)) + 150px); width: 80px; height: 80px; border-radius: 50%;
    pointer-events: auto; touch-action: none; font-size: 34px; display: flex; align-items: center; justify-content: center; border: 4px solid #fff;
    box-shadow: 0 5px 0 #8a3515, 0 8px 16px rgba(0,0,0,.35); background: conic-gradient(#ff8a2b var(--p, 360deg), #6b5a4a 0); }
  #punch.on { transform: scale(.92); }
  #punch .pl { position: absolute; bottom: -18px; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  /* PC: keyboard like Hill Climb Racing, so the touch stick and pedals hide and a key legend shows */
  body.pc #stick, body.pc #gas, body.pc #brake { display: none; }
  #keys { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; gap: 8px; color: #fff; font-weight: 800; font-size: 13px; }
  body.pc #keys { display: flex; }
  .key { background: rgba(15,20,40,.72); border-radius: 8px; padding: 6px 10px; white-space: nowrap; }
  .key b { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 6px; background: #fff; color: #2a1d12; border-radius: 5px; box-shadow: 0 2px 0 #b9ab92; text-align: center; }
  body.pc #punch { bottom: 70px; }
  /* Shop: HCR-style stat bars and upgrade level segments */
  .stats { width: 100%; display: flex; flex-direction: column; gap: 3px; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; }
  .stat span { width: 54px; text-align: left; opacity: .75; }
  .stat i { flex: 1; height: 7px; background: #eadfc8; border-radius: 4px; overflow: hidden; }
  .stat i b { display: block; height: 100%; background: linear-gradient(90deg, #ffb02e, #ff7a1f); }
  .segs { display: flex; gap: 2px; width: 100%; }
  .segs b { flex: 1; height: 9px; border-radius: 2px; background: #eadfc8; }
  .segs b.on { background: var(--green); }
  .vhead { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 8px 12px 8px 8px; box-shadow: 0 4px 0 #d6c39c; }
  .vhead canvas { width: 140px; height: 98px; border-radius: 10px; flex: none; }
  .vhead .nm { font-weight: 900; font-size: 20px; margin-bottom: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ctl" class="hidden">
  <div id="stick"><span class="ar" style="left:10px;top:50%;margin-top:-11px">⟲</span><span class="ar" style="right:10px;top:50%;margin-top:-11px">⟳</span>
    <span class="ar" style="left:50%;top:6px;margin-left:-6px">▲</span><span class="ar" style="left:50%;bottom:6px;margin-left:-6px">▼</span>
    <div id="knob"></div><div id="stickLbl"></div></div>
  <div id="brake" class="pedal"></div>
  <div id="gas" class="pedal"></div>
  <div id="punch" class="hidden">👊<span class="pl" id="punchLbl"></span></div>
  <div id="keys"></div>
</div>

<div id="menu" class="screen">
  <div class="topbar">
    <div class="pill" id="mStage"></div>
    <div class="pill"><span class="coin"></span><span id="mCoins">0</span></div>
  </div>
  <div class="title">
    <h1>PIRATE<br>HILL RUSH</h1>
    <div class="stage" id="mBoss"></div>
  </div>
  <div class="bottom">
    <button class="play" id="playBtn"></button>
    <button class="shopBtn" id="shopBtn"><span id="shopLbl"></span><span class="badge hidden" id="shopBadge">!</span></button>
    <a class="home hidden" id="homeLink" href="../">← All games</a>
  </div>
</div>

<div id="shop" class="screen hidden">
  <div class="topbar"><span></span><div class="pill"><span class="coin"></span><span id="sCoins">0</span></div></div>
  <h2 id="shopTitle"></h2>
  <div class="tabs" id="tabs"></div>
  <div class="hint" id="shopHint"></div>
  <div class="grid" id="grid"></div>
  <button class="back" id="shopBack"></button>
</div>

<div id="result" class="screen hidden">

  <div class="sub" id="rSub"></div>
  <div class="board" id="rBoard"></div>
  <div class="reward"><span class="coin"></span><span id="rCoins">0</span></div>
  <div class="unlock hidden" id="rUnlock"></div>
  <button class="cont" id="contBtn"></button>
</div>

  function updateShots(dt) {

  // Nearest enemy (or the boss ship) the stretchy arm can reach; null means a forward swing.

  function respawn() {

  function updatePlayer(dt) {
    const c = me.car, st = carStats();
    let inp = readInput();

    let power = empty ? 0.7 : 1;
    if (me.boost > 0) { me.boost -= dt; power *= 1.35; }
    inp.power = power;
    me.mercy = Math.max(0, me.mercy - dt / 15);
    inp.mercy = me.mercy * 1.2;
    // Invisible crew push on a hill you can't climb (the run never stalls).
    const speed = Math.hypot(c.vx, c.vy);
    // Progress watchdog (the run never stalls): no new ground for 3 s -> a growing invisible crew push; 12 s -> hop past the obstacle.
    if (c.x > me.progX + 3) { me.progX = c.x; me.noProgT = 0; } else if (me.crashT <= 0) me.noProgT += dt;

  // ---------- Feedback ----------
  function popup(text, color, where) { popups.push({ text, color, t: 0, where: where || 'me' }); if (popups.length > 4) popups.shift(); }
  function pushFeed(text, mine) { if (feed[0] && feed[0].text === text) return; feed.unshift({ text, mine, t: 0 }); feed.length = Math.min(feed.length, 3); }

  // ---------- Update ----------
  let goSfx = false;
  function updateCamera(c, dt, bossCam) {

    const sp = Math.hypot(c.vx, c.vy);
    const target = base * (1 - Math.min(0.18, sp * 0.008)) * (bossCam ? 0.62 : 1);
    ppm += (target - ppm) * Math.min(1, dt * 2);
    camK += ((bossCam ? 0.7 : 0.36) - camK) * Math.min(1, dt * 2);
    camX += (c.x + clamp(c.vx * 0.25, -2, 4) - camX) * Math.min(1, dt * 6);
    camY += (c.y + 1 - camY) * Math.min(1, dt * 4);
  }
  function update(dt) {

    if (racing && me) {
      if (phase === 'play') elapsed += dt;
      updatePlayer(dt);
      updateFoes(dt);
      updateShots(dt);
      if (phase === 'play') {
        if (me.car.x >= FINISH) startBossIntro();
      } else if (phase === 'bossIntro') { introT -= dt; if (introT <= 0) spawnBoss(); }
      else if (phase === 'boss') updateShip(dt);
      else if (phase === 'win') {
        winT -= dt;
        if (ship) { ship.y -= dt * 3; ship.a += (-0.35 - ship.a) * Math.min(1, dt * 1.5); if (Math.random() < 0.6) puff('smoke', ship.x + rnd(-3, 3), ship.y + 3, 1, { r: 1.3, spd: 1.5, c: '70,70,80' }); }
        if (winT <= 0) showResult();
      }
      updateBalls(dt);
      updateCamera(me.car, dt, phase === 'boss' || phase === 'win');
    } else if (demo) {
      const c = demo, sl = Math.atan(slopeAt(c.x));
      const lean = c.ground ? 0 : clamp(-(c.a - sl) * 1.5 - c.w * 0.3, -1, 1);
      const st = carStats();
      for (let i = 0; i < SUB; i++) stepCar(c, dt / SUB, { gas: 0.7, brake: false, lean, power: 1 }, st);
      if (c.head || c.x > 600 || Math.cos(c.a - sl) < 0) placeCar(c, 8);
      updateCamera(c, dt, false);
    }
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < 1.2);
    for (const f of feed) f.t += dt;
    feed = feed.filter(f => f.t < 4);
    impactT -= dt; focusT -= dt;
    for (const o of fxt) o.t += dt;
    fxt = fxt.filter(o => o.t < 0.9);
    for (const p of parts) { if (p.kind === 'smoke' || p.kind === 'fire') { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - 2 * dt; p.vy += 2.5 * dt; continue; } if (p.kind === 'star' || p.kind === 'dust') { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= (p.kind === 'dust' ? 3 : 10) * dt; continue; } p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 14 * dt; }

    shake = Math.max(0, shake - dt * 40);

  }

  // ---------- Rendering ----------
  const CY = 0.56;

        t: 0, life: rnd(0.5, 1) * (o.life || 1), c: o.c || (kind === 'smoke' ? '120,120,132' : kind === 'fire' ? '255,140,40' : kind === 'dust' ? '190,150,105' : '#ffd23f'), r: rnd(0.6, 1) * (o.r || 0.5), spin: rnd(-8, 8) });
    }

  }
  let fxt = [], impactT = 0, impactAt = null, impactSeed = 0, focusT = 0;
  const ONO = { ko: ['BAM!', 'POW!', 'WHAM!', 'BONK!'], boom: ['BOOM!', 'KABOOM!'], crash: ['CRASH!', 'CLONK!'], flip: ['WHOOSH!', 'WOOO!'], hit: ['DOOON!', 'KA-POW!'], ouch: ['OUCH!', 'OOF!'], splash: ['SPLASH!'] };
  function ono(kind, x, y, col, size, burst) {
    const list = ONO[kind];
    fxt.push({ text: list[(Math.random() * list.length) | 0], x, y, t: 0, rot: rnd(-0.3, 0.3), col: col || '#ffd23f', size: size || 1, burst: !!burst });
    if (fxt.length > 5) fxt.shift();

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground();
    const sx = shake ? rnd(-shake, shake) : 0, sy = shake ? rnd(-shake, shake) : 0;
    ctx.save(); ctx.translate(sx, sy);
    drawTerrain();
    if (me) {
      drawPickups();
      if (ship) drawShip();
      for (const b of balls) {
        const k = Math.min(1, b.t / b.dur), x = lerp(b.x0, b.x1, k), y = lerp(b.y0, b.y1, k) + Math.sin(k * Math.PI) * 5;
        blob('120,120,130', sxOf(x - 0.6), syOf(y + 0.2), ppm * 0.5, 0.5);
        ctx.fillStyle = '#1b1b22'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(sxOf(x), syOf(y), ppm * 0.34, 0, 7); ctx.fill(); ctx.stroke();

        if (b.kind === 'bomb') { ctx.fillStyle = '#1b1b22'; ctx.beginPath(); ctx.arc(sxOf(b.x), syOf(b.y), ppm * 0.2, 0, 7); ctx.fill(); blob('255,170,60', sxOf(b.x + 0.12), syOf(b.y + 0.2), ppm * 0.16, 1); }

        const tg = punchTarget();
        if (tg && tg.foe) {

  function drawTrack(y, sc) {
    const x0 = 16, x1 = W - 16, h = 10 * sc;
    ctx.fillStyle = 'rgba(15,20,40,.6)'; rr(x0 - 4, y - 4, x1 - x0 + 8, h + 8, 9); ctx.fill();

    ctx.fillStyle = '#36c46b'; rr(x0, y, Math.max(h, mx - x0 + 6), h, 5); ctx.fill();
    ctx.font = `${12 * sc}px system-ui`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('🏁', x1 + 2, y + h / 2);
    ctx.fillStyle = '#36c46b'; ctx.beginPath(); ctx.arc(mx + 6, y + h / 2, 8 * sc, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    return y + h + 8;
  }

  function drawHud() {
    ctx.textBaseline = 'middle';
    const sc = clamp(Math.min(W, H) / 420, 0.8, 1.3);
    const bossMode = phase === 'boss' || phase === 'win';
    let y = 18;
    if (!bossMode) {
      y = drawTrack(18, sc) + 6;
      ctx.fillStyle = 'rgba(15,20,40,.75)'; rr(12, y, 80 * sc, 34 * sc, 12); ctx.fill();
      txt(`💀 ${kos}`, 12 + 40 * sc, y + 18 * sc, 18 * sc, '#fff', 'center');
      const left = Math.max(0, Math.round(FINISH - me.car.x));
      if (phase === 'play') txt(`${left} ${T.toGo}`, W / 2, y + 18 * sc, 13 * sc, '#fff', 'center', 800);
    } else if (ship) {
      const bw = Math.min(W - 40, 420), bx = (W - bw) / 2;
      ctx.font = `900 ${15 * sc}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#1b1530';
      ctx.strokeText(`⚓ ${ship.name}`, W / 2, y + 4); txt(`⚓ ${ship.name}`, W / 2, y + 4, 15 * sc, '#fff', 'center');
      ctx.fillStyle = '#1b1530'; rr(bx, y + 16, bw, 18 * sc, 9); ctx.fill();
      ctx.fillStyle = '#e8364f'; rr(bx + 3, y + 19, Math.max(0, (bw - 6) * ship.hp / ship.hpMax), 18 * sc - 6, 6); ctx.fill();
      txt(`${Math.ceil(ship.hp)} / ${ship.hpMax}`, W / 2, y + 16 + 9 * sc, 11 * sc, '#fff', 'center');
      y += 26 + 18 * sc;
    }
    // coins (right)
    const ct = fmt(me.coins);
    ctx.font = `900 ${15 * sc}px system-ui`;
    const cw = ctx.measureText(ct).width + 40 * sc;
    ctx.fillStyle = 'rgba(15,20,40,.75)'; rr(W - 12 - cw, y, cw, 30 * sc, 15 * sc); ctx.fill();
    ctx.fillStyle = '#ffc531'; ctx.beginPath(); ctx.arc(W - 12 - cw + 16 * sc, y + 15 * sc, 9 * sc, 0, 7); ctx.fill();
    txt(ct, W - 22, y + 16 * sc, 15 * sc, '#fff', 'right');
    // meat gauge
    const my = y + 40 * sc, st = carStats(), k = me.meat / st.tank;
    ctx.font = `${16 * sc}px system-ui`; ctx.textAlign = 'left'; ctx.fillText('🍖', 12, my + 8 * sc);
    ctx.fillStyle = 'rgba(15,20,40,.7)'; rr(36 * sc, my, 90 * sc, 14 * sc, 7); ctx.fill();
    ctx.fillStyle = k < 0.25 ? (Math.sin(time * 10) > 0 ? '#e8364f' : '#ff8a2b') : '#ffb35c'; rr(36 * sc + 2, my + 2, Math.max(0, (90 * sc - 4) * k), 14 * sc - 4, 5); ctx.fill();

      ctx.globalAlpha = Math.max(0, 1 - f.t / 4);
      ctx.font = `700 ${11 * sc}px system-ui, sans-serif`;
      const tw = Math.min(ctx.measureText(f.text).width + 14, W - 24);
      ctx.fillStyle = f.mine ? 'rgba(54,196,107,.9)' : 'rgba(15,20,40,.6)'; rr(12, fy, tw, 20 * sc, 7); ctx.fill();

    if (phase === 'play') {

      else if (elapsed < 5 && me.car.x < 20) banner(isPc ? T.ctlHintPc : T.ctlHint, '#fff', H * 0.4, Math.min(W * 0.05, 22));
    }
    if (phase === 'bossIntro') { const t = 1 - introT / 2.6; banner(t < 0.45 ? T.bossIn : T.bossIn2, t < 0.45 ? '#ffc531' : '#e8364f', H * 0.3); }

  }

  function frame(t) {
    const dt = Math.min((t - lastT) / 1000 || 0, 0.05);

  // ---------- Touch controls ----------
  const $ = (id) => document.getElementById(id);
  let lastPunchP = -1, isPc = false;
  function syncControls() {
    const on = me && (phase === 'play' || phase === 'bossIntro' || phase === 'boss' || phase === 'win');
    $('ctl').classList.toggle('hidden', !on);
    const showPunch = on && (phase === 'play' || phase === 'boss');
    $('punch').classList.toggle('hidden', !showPunch);
    if (showPunch) {
      const p = Math.round(360 * (1 - clamp(me.punchCD / PUNCH_CD, 0, 1)));
      if (p !== lastPunchP) { lastPunchP = p; $('punch').style.setProperty('--p', p + 'deg'); }
    }
    const ks = $('knob').style;
    ks.transform = `translate(${input.joyX * 36}px, ${input.joyY * 36}px)`;
    $('gas').classList.toggle('on', input.gas || input.kGas);
    $('brake').classList.toggle('on', input.brake || input.kBrake);

  function holdButton(el, key) {

  }
  function setupStick() {
    const el = $('stick');
    let id = null;
    const move = (e) => {
      const r = el.getBoundingClientRect(), R = r.width / 2;
      let dx = (e.clientX - (r.left + R)) / (R * 0.75), dy = (e.clientY - (r.top + R)) / (R * 0.75);
      const m = Math.hypot(dx, dy); if (m > 1) { dx /= m; dy /= m; }
      input.joyX = dx; input.joyY = dy;
    };
    const end = (e) => { if (e.pointerId !== id) return; id = null; input.joyX = 0; input.joyY = 0; };
    el.addEventListener('pointerdown', (e) => { e.preventDefault(); unlockAudio(); id = e.pointerId; try { el.setPointerCapture(id); } catch (_) {} move(e); });

  }

  function drawPreview(canvas, carId, hatId, zoomHat) {
    const g = canvas.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, canvas.height);
    gr.addColorStop(0, '#bfe6ff'); gr.addColorStop(1, '#fdf3dc');
    g.fillStyle = gr; g.fillRect(0, 0, canvas.width, canvas.height);
    g.fillStyle = '#5cc64c'; g.fillRect(0, canvas.height * 0.86, canvas.width, canvas.height);
    g.save();
    if (zoomHat) { g.translate(canvas.width * 0.6, canvas.height * 1.25); g.scale(95, -95); }
    else { g.translate(canvas.width / 2, canvas.height * 0.62); g.scale(canvas.width / 4.6, -canvas.width / 4.6); }
    drawCar(g, carId, hatId, 0.3);
    g.restore();
  }
  function drawIslandPreview(canvas, isl) {
    const g = canvas.getContext('2d'), th = THEMES[isl.theme], w = canvas.width, h = canvas.height;
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, th.sky[0]); gr.addColorStop(1, th.sky[1]);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    if (th.night) { g.fillStyle = '#fff'; for (let i = 0; i < 25; i++) g.fillRect(hash(i) * w, hash(i + 9) * h * 0.5, 2, 2); }
    g.fillStyle = th.sun; g.beginPath(); g.arc(w * 0.8, h * 0.2, 14, 0, 7); g.fill();
    g.fillStyle = th.sea; g.fillRect(0, h * 0.5, w, h);
    const y = (x) => h * 0.7 - Math.sin(x * 0.03 + 1) * 18 * isl.amp - Math.sin(x * 0.12) * 3 * isl.bump;
    g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 4) g.lineTo(x, y(x)); g.lineTo(w, h); g.closePath(); g.fillStyle = th.dirt; g.fill();

  }

  function toMenu() {

  }

  // ---------- Audio ----------
  // Soft, ASMR-style palette: wooden taps, glass chimes and airy noise, plus a low purring engine. All synthesized.
  let actx = null, master = null, wet = null, noiseBuf = null, eng = null;
  function unlockAudio() {
    try {
      if (!actx) {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        const comp = actx.createDynamicsCompressor();
        comp.threshold.value = -18; comp.ratio.value = 3;
        master = actx.createGain(); master.gain.value = 0.7;
        const soft = actx.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 3200;
        master.connect(soft).connect(comp).connect(actx.destination);
        wet = actx.createGain(); wet.gain.value = 0.35;
        const dl = actx.createDelay(1), fb = actx.createGain(), lp = actx.createBiquadFilter();
        dl.delayTime.value = 0.19; fb.gain.value = 0.38; lp.type = 'lowpass'; lp.frequency.value = 1800;
        wet.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
        noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
        o.type = 'sawtooth'; o.frequency.value = 50; f.type = 'lowpass'; f.frequency.value = 380; g.gain.value = 0;
        o.connect(f).connect(g).connect(master); o.start();
        eng = { o, f, g };
      }
      if (actx.state === 'suspended' && audioOn && !paused) actx.resume();
    } catch (e) {}
  }
  function engineSound() {
    if (!eng || !actx) return;
    const racing = me && phase !== 'result' && phase !== 'match';
    const c = racing ? me.car : null, inp = readInput();
    const sp = c ? Math.abs(c.ws * WR) : 0;
    const t = actx.currentTime;
    eng.o.frequency.setTargetAtTime(42 + sp * 5 + inp.gas * 14, t, 0.08);
    eng.f.frequency.setTargetAtTime(260 + sp * 22 + inp.gas * 120, t, 0.1);
    eng.g.gain.setTargetAtTime(racing && me.crashT <= 0 ? 0.02 + inp.gas * 0.035 : 0, t, 0.12);
  }
  const canPlay = () => actx && audioOn && !paused && actx.state === 'running';
  function out(node, pan, send) {
    let n = node;
    if (pan && actx.createStereoPanner) { const p = actx.createStereoPanner(); p.pan.value = pan; n.connect(p); n = p; }
    n.connect(master);
    if (send) { const s = actx.createGain(); s.gain.value = send; n.connect(s); s.connect(wet); }
  }
  function osc(f, peak, dur, o = {}) {
    if (!canPlay()) return;
    const t0 = actx.currentTime + (o.delay || 0), v = actx.createOscillator(), g = actx.createGain();
    v.type = o.type || 'sine'; v.frequency.setValueAtTime(f, t0);
    if (o.to) v.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    v.connect(g); out(g, o.pan, o.send);
    v.start(t0); v.stop(t0 + dur + 0.05);
  }
  function hiss(peak, dur, o = {}) {
    if (!canPlay()) return;
    const t0 = actx.currentTime + (o.delay || 0), s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; s.loop = true;
    f.type = o.filter || 'bandpass'; f.frequency.setValueAtTime(o.f || 1500, t0); f.Q.value = o.q || 1;
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f).connect(g); out(g, o.pan, o.send);
    s.start(t0, Math.random() * 0.5); s.stop(t0 + dur + 0.05);
  }
  const PENTA = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99, 880];
  let coinN = 0, coinT = 0;
  const sfx = {
    coin() { coinN = time - coinT < 0.6 ? coinN + 1 : 0; coinT = time; osc(PENTA[5 + (coinN % 5)], 0.05, 0.4, { send: 0.4 }); },
    munch() { for (let i = 0; i < 3; i++) hiss(0.08, 0.06, { f: rnd(500, 900), q: 2, delay: i * 0.09 }); osc(330, 0.05, 0.3, { delay: 0.25, to: 440, send: 0.4 }); },
    fruit() { [0, 2, 4, 7].forEach((k, i) => osc(PENTA[k] * 2, 0.04, 0.6, { delay: i * 0.05, send: 0.6 })); },
    land(big) { hiss(big ? 0.14 : 0.08, 0.12, { filter: 'lowpass', f: 500 }); osc(big ? 90 : 120, big ? 0.2 : 0.12, 0.2, { to: 55 }); },
    flip(n) { osc(PENTA[Math.min(4 + n, PENTA.length - 1)], 0.08, 1.0, { send: 0.6 }); osc(PENTA[Math.min(4 + n, PENTA.length - 1)] * 1.5, 0.03, 0.8, { delay: 0.06, send: 0.6 }); },
    crash() { for (let i = 0; i < 3; i++) { osc(rnd(70, 95), 0.18, 0.25, { delay: i * 0.08, to: 50 }); hiss(0.1, 0.18, { filter: 'lowpass', f: 700, delay: i * 0.08 }); } },
    tick(n) { hiss(0.05, 0.03, { f: 1200 + n * 40, q: 5 }); },
    low() { osc(880, 0.035, 0.12, { type: 'triangle' }); },
    ko(n) { osc(140, 0.18, 0.15, { to: 70 }); hiss(0.1, 0.1, { filter: 'lowpass', f: 900 }); osc(PENTA[Math.min(3 + n, PENTA.length - 1)], 0.06, 0.5, { delay: 0.04, send: 0.5 }); },
    shot() { hiss(0.04, 0.06, { f: 2500, q: 2, pan: 0.4 }); },
    thud() { osc(90, 0.2, 0.18, { to: 50 }); hiss(0.08, 0.1, { filter: 'lowpass', f: 600 }); },
    ui() { osc(420, 0.07, 0.09, { to: 560 }); hiss(0.025, 0.03, { f: 1600, q: 3 }); },
    buy() { [0, 2, 4].forEach((k, i) => osc(PENTA[k + 2], 0.06, 0.6, { delay: i * 0.07, send: 0.5 })); },
    first() { osc(523.25, 0.06, 0.9, { send: 0.6 }); osc(783.99, 0.04, 0.9, { delay: 0.08, send: 0.6 }); },
    go() { osc(392, 0.07, 0.6, { send: 0.5 }); osc(587.33, 0.06, 0.8, { delay: 0.12, send: 0.5 }); },
    bossIntro() { hiss(0.09, 1.6, { filter: 'lowpass', f: 200, to: 900, attack: 0.6 }); osc(55, 0.16, 1.8, { attack: 0.5, to: 45 }); },
    whoosh() { hiss(0.08, 0.2, { f: 600, to: 2400, q: 1.2 }); },
    bossHit(big) { osc(130, 0.22, 0.22, { to: 70, pan: -0.3 }); hiss(0.1, 0.12, { filter: 'lowpass', f: 900, pan: -0.3 }); if (big) osc(659.25, 0.05, 0.5, { send: 0.6 }); },
    cannon() { osc(80, 0.14, 0.3, { to: 45, pan: -0.4 }); hiss(0.08, 0.25, { filter: 'lowpass', f: 600, pan: -0.4 }); },
    boom() { osc(65, 0.22, 0.4, { to: 40 }); hiss(0.12, 0.3, { filter: 'lowpass', f: 400 }); },
    bossDown() {
      PENTA.forEach((f, i) => osc(f, 0.05, 1.2, { delay: i * 0.07, send: 0.6, pan: i % 2 ? 0.3 : -0.3 }));
      hiss(0.08, 1.5, { filter: 'lowpass', f: 700, to: 150 });
    },
    coins() { for (let i = 0; i < 6; i++) osc(PENTA[7 + (i % 3)], 0.03, 0.35, { delay: i * 0.06, send: 0.4 }); },
  };
  const buzz = (ms) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  function syncAudio() { if (!actx) return; if (audioOn && !paused) actx.resume(); else actx.suspend(); }

  // ---------- Boot ----------
  async function boot() {
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('blur', releaseAll);
    holdButton($('gas'), 'gas');
    holdButton($('brake'), 'brake');
    $('punch').addEventListener('pointerdown', (e) => { e.preventDefault(); unlockAudio(); $('punch').classList.add('on'); doPunch(); });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) $('punch').addEventListener(ev, () => $('punch').classList.remove('on'));
    setupStick();
    const KEYS = { ArrowRight: 'kGas', KeyD: 'kGas', ArrowLeft: 'kBrake', KeyA: 'kBrake', ArrowUp: 'kBack', KeyW: 'kBack', ArrowDown: 'kFwd', KeyS: 'kFwd' };
    window.addEventListener('keydown', e => {
      if (KEYS[e.code]) { e.preventDefault(); unlockAudio(); input[KEYS[e.code]] = true; }
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); unlockAudio(); doPunch(); }
    });
    window.addEventListener('keyup', e => { if (KEYS[e.code]) input[KEYS[e.code]] = false; });
    cv.addEventListener('pointerdown', e => { e.preventDefault(); unlockAudio(); });

    try {
      if (window.bridge) { await bridge.initialize(); B = bridge; }
    } catch (e) { B = null; }
    if (B) {
      const lang = String(B.platform.language || 'en').slice(0, 2).toLowerCase();
      T = STRINGS[lang] || STRINGS.en;
      B.platform.on(B.EVENT_NAME.PAUSE_STATE_CHANGED, isPaused => { paused = isPaused; if (paused) releaseAll(); syncAudio(); });
      B.platform.on(B.EVENT_NAME.AUDIO_STATE_CHANGED, isEnabled => { audioOn = isEnabled; syncAudio(); });
      await load();
    }
    $('gas').textContent = T.gas; $('brake').textContent = T.brake; $('stickLbl').textContent = T.tilt; $('punchLbl').textContent = T.punch;
    // Mouse/keyboard devices play with the arrow keys (HCR on PC); the touch UI comes back the moment someone touches the screen.
    isPc = !(window.matchMedia && matchMedia('(pointer: coarse)').matches);
    document.body.classList.toggle('pc', isPc);
    if (isPc) $('punchLbl').textContent = 'SPACE';
    window.addEventListener('pointerdown', e => { if (e.pointerType === 'touch' && isPc) { isPc = false; document.body.classList.remove('pc'); $('punchLbl').textContent = T.punch; } }, true);
    $('keys').innerHTML = `<span class="key"><b>A</b>${T.brake}</span><span class="key"><b>D</b>${T.gas}</span><span class="key"><b>W</b><b>S</b>${T.tilt}</span>`;

    if (/github\.io$|^localhost$|^127\.0\.0\.1$/.test(location.hostname)) $('homeLink').classList.remove('hidden');
    $('playBtn').onclick = startRace;

    toMenu();

      send('game_ready');

    });
  }
