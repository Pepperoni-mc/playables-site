<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pirate Hill Rush</title>
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>
<style>
  :root { --ink: #2a1d12; --gold: #ffc531; --gold-d: #e39a12; --accent: #2f7bd8; --green: #36c46b; --red: #e8364f; --sea: #0f3a63; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f2a45; font-family: system-ui, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
  body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas#c { display: block; width: 100vw; height: 100vh; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 16px; overflow-y: auto; }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; }
  .pill { background: rgba(15,20,40,.72); color: #fff; border-radius: 999px; padding: 6px 14px 6px 8px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; }
  .coin { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff3b0, var(--gold) 45%, var(--gold-d)); box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); flex: none; display: inline-block; }
  .topbar { width: 100%; max-width: 520px; display: flex; justify-content: space-between; align-items: center; }

  /* Menu */
  #menu { justify-content: space-between; }
  .title { text-align: center; margin-top: 3vh; }
  .title h1 { margin: 0; font-size: clamp(42px, 12.5vw, 74px); line-height: .9; font-weight: 900; font-family: Impact, "Arial Black", system-ui, sans-serif; letter-spacing: 1px;
    color: var(--gold); -webkit-text-stroke: 3px #3a1c06; paint-order: stroke fill; text-shadow: 0 6px 0 #3a1c06; }
  .title .stage { margin-top: 14px; display: inline-block; background: var(--accent); color: #fff; font-weight: 900; padding: 6px 16px; border-radius: 10px; box-shadow: 0 4px 0 #1c4f91; }
  .bottom { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 12px; align-items: center; padding-bottom: 8px; }
  .play { width: min(360px, 90%); padding: 18px; font-size: 26px; font-weight: 900; color: #fff; background: var(--green); border-radius: 18px; box-shadow: 0 6px 0 #22924c; animation: pulse 1.2s infinite; }
  .play:active { transform: translateY(4px); box-shadow: 0 2px 0 #22924c; }
  @keyframes pulse { 50% { transform: scale(1.04); } }
  .shopBtn { background: #c4562b; color: #fff; font-weight: 900; padding: 12px 34px; border-radius: 14px; box-shadow: 0 5px 0 #8a3515; font-size: 17px; position: relative; }
  .home { color: #fff; opacity: .8; font-weight: 800; font-size: 14px; text-decoration: none; padding: 4px 10px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .badge { position: absolute; top: -8px; right: -8px; background: var(--red); color: #fff; border-radius: 999px; font-size: 12px; padding: 2px 7px; }

  /* Shop */
  #shop { background: #f3e6cc; }
  #shop h2 { margin: 8px 0; font-size: 30px; font-weight: 900; }
  .tabs { display: flex; gap: 6px; width: 100%; max-width: 520px; margin-bottom: 8px; }
  .tab { flex: 1; padding: 9px 4px; border-radius: 10px; background: #fff; font-weight: 900; font-size: 13px; box-shadow: 0 3px 0 #d6c39c; }
  .tab.on { background: var(--ink); color: #fff; box-shadow: 0 3px 0 #000; }
  .hint { font-size: 13px; opacity: .7; margin-bottom: 10px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 520px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card { background: #fff; border-radius: 16px; padding: 10px; text-align: center; box-shadow: 0 4px 0 #d6c39c; display: flex; flex-direction: column; gap: 6px; align-items: center; border: 3px solid transparent; }
  .card.eq { border-color: var(--green); }
  .card canvas { width: 100%; height: 84px; border-radius: 10px; }
  .card .em { font-size: 44px; line-height: 84px; height: 84px; }
  .card .nm { font-weight: 900; }
  .card .ds { font-size: 12px; opacity: .7; min-height: 30px; }
  .card .lv { font-size: 12px; font-weight: 900; background: #ffe7a8; border-radius: 6px; padding: 1px 8px; }
  .card button { width: 100%; padding: 8px; border-radius: 10px; font-weight: 900; display: flex; justify-content: center; align-items: center; gap: 6px; }
  .card button .coin { width: 16px; height: 16px; }
  .b-buy { background: var(--gold); box-shadow: 0 3px 0 var(--gold-d); }
  .b-buy.poor { background: #e3e3e3; box-shadow: 0 3px 0 #bbb; color: #888; }
  .b-eq { background: var(--accent); color: #fff; box-shadow: 0 3px 0 #1c4f91; }
  .b-on { background: var(--green); color: #fff; }
  .b-lock { background: #3a2a1d; color: #fff; font-size: 12px; }
  .back { margin: 16px 0; background: var(--ink); color: #fff; font-weight: 900; padding: 12px 36px; border-radius: 14px; }

  /* Matchmaking */
  #match { background: rgba(10,22,40,.92); color: #fff; justify-content: center; gap: 12px; }
  #match h2 { margin: 0; font-size: 26px; font-weight: 900; }
  #match .count { font-size: 44px; font-weight: 900; color: var(--gold); }
  .plist { width: min(340px, 90vw); display: flex; flex-direction: column; gap: 6px; min-height: 170px; }
  .prow { background: rgba(255,255,255,.1); border-radius: 10px; padding: 6px 12px; display: flex; justify-content: space-between; font-weight: 700; animation: slide .25s ease-out; }
  .prow .ping { opacity: .6; font-size: 13px; }
  .prow.me { background: var(--green); }
  @keyframes slide { from { transform: translateX(-20px); opacity: 0; } }
  .spinner { width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Result */
  #result { background: rgba(10,22,40,.9); color: #fff; justify-content: center; gap: 14px; text-align: center; }
  #result h2 { margin: 0; font-size: clamp(28px, 8.5vw, 44px); font-weight: 900; color: var(--gold); -webkit-text-stroke: 2px #7a4a00; paint-order: stroke fill; }
  #result .sub { font-weight: 800; opacity: .85; }
  .board { width: min(340px, 90vw); display: flex; flex-direction: column; gap: 5px; }
  .brow { display: flex; justify-content: space-between; background: rgba(255,255,255,.12); border-radius: 8px; padding: 6px 12px; font-weight: 800; }
  .brow.me { background: var(--green); }
  .reward { display: flex; align-items: center; gap: 10px; font-size: 34px; font-weight: 900; }
  .reward .coin { width: 34px; height: 34px; }
  .unlock { background: var(--accent); border-radius: 12px; padding: 8px 14px; font-weight: 800; }
  .cont { background: var(--green); color: #fff; font-weight: 900; font-size: 20px; padding: 14px 40px; border-radius: 16px; box-shadow: 0 5px 0 #22924c; }

  /* Touch controls: analog stick (left), pedals + punch (right) */
  #ctl { position: fixed; inset: 0; pointer-events: none; }
  #stick { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: max(22px, env(safe-area-inset-bottom)); width: 128px; height: 128px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.10) 40%, rgba(255,255,255,.22) 70%); border: 3px solid rgba(255,255,255,.45); pointer-events: auto; touch-action: none; }
  #stick .ar { position: absolute; color: rgba(255,255,255,.75); font-weight: 900; font-size: 16px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #e8e2d2 55%, #b8ab8e); box-shadow: 0 4px 10px rgba(0,0,0,.35); border: 3px solid #5a4630; }
  #stickLbl { position: absolute; left: 0; right: 0; bottom: -18px; text-align: center; color: #fff; font-weight: 900; font-size: 11px; opacity: .8; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .pedal { position: absolute; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 10px; color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .5px;
    border-radius: 16px; pointer-events: auto; touch-action: none; text-shadow: 0 1px 2px rgba(0,0,0,.4);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 6px, transparent 6px 14px); }
  .pedal.on { transform: translateY(4px) scale(.97); filter: brightness(1.15); }
  #gas { right: max(14px, env(safe-area-inset-right)); bottom: max(22px, env(safe-area-inset-bottom)); width: 88px; height: 132px; background-color: #34b862; box-shadow: 0 6px 0 #1f7a3e, 0 8px 16px rgba(0,0,0,.3); }
  #brake { right: calc(max(14px, env(safe-area-inset-right)) + 100px); bottom: max(22px, env(safe-area-inset-bottom)); width: 74px; height: 96px; background-color: #d9433f; box-shadow: 0 6px 0 #8f2522, 0 8px 16px rgba(0,0,0,.3); }
  #punch { position: absolute; right: max(18px, env(safe-area-inset-right)); bottom: calc(max(22px, env(safe-area-inset-bottom)) + 150px); width: 80px; height: 80px; border-radius: 50%;
    pointer-events: auto; touch-action: none; font-size: 34px; display: flex; align-items: center; justify-content: center; border: 4px solid #fff;
    box-shadow: 0 5px 0 #8a3515, 0 8px 16px rgba(0,0,0,.35); background: conic-gradient(#ff8a2b var(--p, 360deg), #6b5a4a 0); }
  #punch.on { transform: scale(.92); }
  #punch .pl { position: absolute; bottom: -18px; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  /* PC: keyboard like Hill Climb Racing, so the touch stick and pedals hide and a key legend shows */
  body.pc #stick, body.pc #gas, body.pc #brake { display: none; }
  #keys { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; gap: 8px; color: #fff; font-weight: 800; font-size: 13px; }
  body.pc #keys { display: flex; }
  .key { background: rgba(15,20,40,.72); border-radius: 8px; padding: 6px 10px; white-space: nowrap; }
  .key b { display: inline-block; min-width: 22px; padding: 1px 6px; margin-right: 6px; background: #fff; color: #2a1d12; border-radius: 5px; box-shadow: 0 2px 0 #b9ab92; text-align: center; }
  body.pc #punch { bottom: 70px; }
  /* Shop: HCR-style stat bars and upgrade level segments */
  .stats { width: 100%; display: flex; flex-direction: column; gap: 3px; }
  .stat { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; }
  .stat span { width: 54px; text-align: left; opacity: .75; }
  .stat i { flex: 1; height: 7px; background: #eadfc8; border-radius: 4px; overflow: hidden; }
  .stat i b { display: block; height: 100%; background: linear-gradient(90deg, #ffb02e, #ff7a1f); }
  .segs { display: flex; gap: 2px; width: 100%; }
  .segs b { flex: 1; height: 9px; border-radius: 2px; background: #eadfc8; }
  .segs b.on { background: var(--green); }
  .vhead { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 16px; padding: 8px 12px 8px 8px; box-shadow: 0 4px 0 #d6c39c; }
  .vhead canvas { width: 140px; height: 98px; border-radius: 10px; flex: none; }
  .vhead .nm { font-weight: 900; font-size: 20px; margin-bottom: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="ctl" class="hidden">
  <div id="stick"><span class="ar" style="left:10px;top:50%;margin-top:-11px">⟲</span><span class="ar" style="right:10px;top:50%;margin-top:-11px">⟳</span>
    <span class="ar" style="left:50%;top:6px;margin-left:-6px">▲</span><span class="ar" style="left:50%;bottom:6px;margin-left:-6px">▼</span>
    <div id="knob"></div><div id="stickLbl"></div></div>
  <div id="brake" class="pedal"></div>
  <div id="gas" class="pedal"></div>
  <div id="punch" class="hidden">👊<span class="pl" id="punchLbl"></span></div>
  <div id="keys"></div>
</div>

<div id="menu" class="screen">
  <div class="topbar">
    <div class="pill" id="mStage"></div>
    <div class="pill"><span class="coin"></span><span id="mCoins">0</span></div>
  </div>
  <div class="title">
    <h1>PIRATE<br>HILL RUSH</h1>
    <div class="stage" id="mBoss"></div>
  </div>
  <div class="bottom">
    <button class="play" id="playBtn"></button>
    <button class="shopBtn" id="shopBtn"><span id="shopLbl"></span><span class="badge hidden" id="shopBadge">!</span></button>
    <a class="home hidden" id="homeLink" href="../">← All games</a>
  </div>
</div>

<div id="shop" class="screen hidden">
  <div class="topbar"><span></span><div class="pill"><span class="coin"></span><span id="sCoins">0</span></div></div>
  <h2 id="shopTitle"></h2>
  <div class="tabs" id="tabs"></div>
  <div class="hint" id="shopHint"></div>
  <div class="grid" id="grid"></div>
  <button class="back" id="shopBack"></button>
</div>

<div id="match" class="screen hidden">
  <div class="spinner"></div>
  <h2 id="matchTitle"></h2>
  <div class="count" id="matchCount">1/5</div>
  <div class="plist" id="plist"></div>
</div>

<div id="result" class="screen hidden">

  <div class="sub" id="rSub"></div>
  <div class="board" id="rBoard"></div>
  <div class="reward"><span class="coin"></span><span id="rCoins">0</span></div>
  <div class="unlock hidden" id="rUnlock"></div>
  <button class="cont" id="contBtn"></button>
</div>

      if (!empty && me.meat < st.tank * 0.2) { me.beepT -= dt; if (me.beepT <= 0) { me.beepT = 0.9; sfx.low(); } }
      if (c.head) crash();
      const rel = Math.cos(c.a - Math.atan(slopeAt(c.x)));
      if (rel < -0.1 && c.body) me.upT += dt; else me.upT = 0;
      if (rel < 0.35 && c.body) me.sideT += dt; else me.sideT = Math.max(0, me.sideT - dt); // stuck on its side or tail
      if (me.upT > 1.0 || me.sideT > 1.8) crash();
    }
    // flips & landings
    if (c.air > 0) {
      if (me.crashT <= 0) {
        while (c.flip > Math.PI * 2 - 0.4) { c.flip -= Math.PI * 2; trick(T.backflip); }
        while (c.flip < -Math.PI * 2 + 0.4) { c.flip += Math.PI * 2; trick(T.frontflip); }
      }
    } else {
      if (prevAir > 0 && me.crashT <= 0) {
        if (prevAir > 0.9) { const n = Math.round(prevAir * 2) * 50; me.coins += n; popup(`${T.air} +${fmt(n)}`, '#7cdcff'); sfx.land(true); if (ship && phase === 'boss') hitShip(5, true); }
        else if (prevAir > 0.25) sfx.land(false);
        if (prevAir > 0.25) for (let i = 0; i < 6; i++) parts.push({ x: c.x + rnd(-1, 1), y: hAt(c.x) + 0.1, vx: rnd(-2, 2), vy: rnd(1, 3), t: 0, life: 0.5, c: 'rgba(160,120,80,.8)', r: rnd(0.1, 0.2) });
      }
      c.flip = 0;
    }
    me.best = Math.max(me.best, c.x);
    const cp = Math.floor((c.x - 6) / CP) * CP + 6;
    if (cp > me.cp && me.crashT <= 0) { me.cp = cp; if (cp > 6) { sfx.tick(6); } }
    // pickups
    for (const p of pickups) {
      if (p.taken || Math.abs(p.x - c.x) > 2) continue;
      if (Math.hypot(p.x - c.x, p.y - (c.y + 0.4)) < 1.5) {
        p.taken = true;
        if (p.type === 'coin') { me.coins += COIN_VALUES[p.tier]; sfx.coin(); }
        else if (p.type === 'meat') { me.meat = Math.min(st.tank, me.meat + 20); popup('🍖 +20', '#ffb35c'); sfx.munch(); }
        else { me.boost = 3; popup('🍇 ' + T.fruit, '#d18bff'); sfx.fruit(); }
      }
    }
    if (me.punchCD > 0) me.punchCD -= dt;
    if (me.punchT >= 0) {
      const prev = me.punchT; me.punchT += dt;
      if (prev < 0.16 && me.punchT >= 0.16 && ship && me.car.x - ship.x < 16) hitShip(7, false); // the arm only reaches a ship on screen
      if (me.punchT > 0.34) me.punchT = -1;
    }
  }
  function trick(name) {
    me.flips++; me.coins += 500;
    popup(`${name} +500`, '#ffd23f'); sfx.flip(me.flips);
    if (ship && phase === 'boss') hitShip(10, true);
  }

  // ---------- Boss: the Admiral's warship chases you ----------
  function startBossIntro() {
    phase = 'bossIntro'; introT = 2.6;
    for (const p of everyone()) p.final = Math.round(Math.min(posOf(p), FINISH));
    popup('🏁 ' + T.finish, '#7cff8a');
    sfx.bossIntro();
  }
  function spawnBoss() {
    const stage = save.bosses + 1, hp = Math.min(95 + stage * 15, 260);
    ship = { x: me.car.x - 16, y: hAt(me.car.x - 16), a: 0, v: 8, hp, hpMax: hp, flash: 0, fireT: 3.5, name: `${T.boss} Lv${stage * 5 + 10}` };
    phase = 'boss';
    popup('👊 ' + T.punchHint, '#ff8a2b');
  }
  function doPunch() {
    if (phase !== 'boss' || !ship || me.punchCD > 0 || me.punchT >= 0 || me.crashT > 0) return;
    me.punchT = 0; me.punchCD = 0.9; sfx.whoosh();
  }
  function hitShip(dmg, big) {
    if (!ship || ship.hp <= 0) return;
    ship.hp = Math.max(0, ship.hp - dmg); ship.flash = 0.25;
    popup(`-${dmg}`, big ? '#ffd23f' : '#ff5d73', 'boss');
    sfx.bossHit(big); shake = Math.max(shake, big ? 8 : 4); buzz(15);
    const sx = ship.x + 2.5, sy = ship.y + 3;
    for (let i = 0; i < 8; i++) parts.push({ x: sx, y: sy, vx: rnd(-5, 5), vy: rnd(0, 6), t: 0, life: 0.6, c: big ? '#ffd23f' : '#fff', r: rnd(0.1, 0.25) });
    if (ship.hp <= 0) shipDefeated();
  }
  function updateShip(dt) {
    const c = me.car, speed = Math.max(0, c.vx);
    const want = c.x - 11.5;
    ship.v += ((want - ship.x) * 1.1 + speed - ship.v) * Math.min(1, dt * 2);
    ship.v = clamp(ship.v, 3, 24);
    ship.x += ship.v * dt;
    ship.y += (hAt(ship.x) + 0.2 - ship.y) * Math.min(1, dt * 3);
    ship.a += (Math.atan(slopeAt(ship.x)) * 0.5 - ship.a) * Math.min(1, dt * 2);
    ship.flash = Math.max(0, ship.flash - dt);
    if (ship.x > c.x - 8 && me.crashT <= 0) { // ram: slows you, never knocks you out
      c.vx *= 0.45; ship.x = c.x - 18; ship.v = 4;
      popup('💥 ' + T.rammed, '#ff8a2b'); shake = 12; sfx.boom(); buzz(40);
    }
    ship.fireT -= dt;
    if (ship.fireT <= 0) {
      ship.fireT = rnd(4, 6);
      const tx = c.x + c.vx * 1.1 + (Math.random() < 0.45 ? rnd(4, 8) : 0);
      balls.push({ x0: ship.x + 4.5, y0: ship.y + 2.6, x1: tx, y1: hAt(tx) + 0.6, t: 0, dur: 1.1 });
      sfx.cannon();
    }
  }
  function updateBalls(dt) {
    for (const b of balls) {
      b.t += dt;
      if (b.t >= b.dur && !b.done) {
        b.done = true;
        const c = me.car;
        if (Math.abs(b.x1 - c.x) < 2.2 && me.crashT <= 0 && phase === 'boss') { c.vx *= 0.6; popup('💣 ' + T.cannon, '#ff5d73'); shake = 10; buzz(30); }
        sfx.boom();
        for (let i = 0; i < 12; i++) parts.push({ x: b.x1, y: b.y1, vx: rnd(-4, 4), vy: rnd(2, 7), t: 0, life: rnd(0.4, 0.8), c: i % 3 ? 'rgba(150,110,70,.9)' : '#ff8a2b', r: rnd(0.12, 0.3) });
      }
    }
    balls = balls.filter(b => b.t < b.dur + 0.05);
  }
  function shipDefeated() {
    phase = 'win'; winT = 2.6;
    for (let i = 0; i < 50; i++) parts.push({ x: ship.x + rnd(-4, 4), y: ship.y + rnd(0, 5), vx: rnd(-8, 8), vy: rnd(2, 14), t: 0, life: rnd(0.8, 1.8), c: Math.random() < 0.6 ? '#ffc531' : '#e8364f', r: rnd(0.15, 0.4) });
    shake = 18; sfx.bossDown(); buzz([20, 30, 20, 30, 60]);
    send('level_completed');
  }

  // ---------- Feedback ----------
  function popup(text, color, where) { popups.push({ text, color, t: 0, where: where || 'me' }); if (popups.length > 4) popups.shift(); }
  function pushFeed(text, mine) { if (feed[0] && feed[0].text === text) return; feed.unshift({ text, mine, t: 0 }); feed.length = Math.min(feed.length, 3); }

  // ---------- Update ----------
  let goSfx = false;
  function updateCamera(c, dt, bossCam) {
    const base = clamp(Math.min(W / 12.5, H / 16), 22, 64);
    const sp = Math.hypot(c.vx, c.vy);
    const target = base * (1 - Math.min(0.18, sp * 0.008)) * (bossCam ? 0.62 : 1);
    ppm += (target - ppm) * Math.min(1, dt * 2);
    camK += ((bossCam ? 0.7 : 0.36) - camK) * Math.min(1, dt * 2);
    camX += (c.x + clamp(c.vx * 0.25, -2, 4) - camX) * Math.min(1, dt * 6);
    camY += (c.y + 1 - camY) * Math.min(1, dt * 4);
  }
  function update(dt) {
    time += dt;
    const racing = phase === 'play' || phase === 'bossIntro' || phase === 'boss' || phase === 'win';
    if (racing && me) {
      if (phase === 'play') elapsed += dt;
      updatePlayer(dt);
      updateBots(dt);
      if (phase === 'play') {
        const rank = ranking().indexOf(me) + 1;
        if (rank < lastRank && elapsed > 1) {
          const passed = ranking()[rank];
          if (passed) pushFeed(`${T.passed} ${passed.name}!`, true);
          if (rank === 1) sfx.first();
        }
        lastRank = rank;
        if (!rallyOn && me.best / FINISH > 0.6 && !leading()) { rallyOn = true; popup('💨 ' + T.rally, '#7cdcff'); }
        if (rallyOn && leading()) rallyOn = false;
        if (me.car.x >= FINISH) startBossIntro();
      } else if (phase === 'bossIntro') { introT -= dt; if (introT <= 0) spawnBoss(); }
      else if (phase === 'boss') updateShip(dt);
      else if (phase === 'win') { winT -= dt; if (ship) ship.y -= dt * 3; if (winT <= 0) showResult(); }
      updateBalls(dt);
      updateCamera(me.car, dt, phase === 'boss' || phase === 'win');
    } else if (demo) {
      const c = demo, sl = Math.atan(slopeAt(c.x));
      const lean = c.ground ? 0 : clamp(-(c.a - sl) * 1.5 - c.w * 0.3, -1, 1);
      const st = carStats();
      for (let i = 0; i < SUB; i++) stepCar(c, dt / SUB, { gas: 0.7, brake: false, lean, power: 1 }, st);
      if (c.head || c.x > 600 || Math.cos(c.a - sl) < 0) placeCar(c, 8);
      updateCamera(c, dt, false);
    }
    for (const p of popups) p.t += dt;
    popups = popups.filter(p => p.t < 1.2);
    for (const f of feed) f.t += dt;
    feed = feed.filter(f => f.t < 4);
    for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 14 * dt; }
    parts = parts.filter(p => p.t < p.life);
    shake = Math.max(0, shake - dt * 40);
    syncControls();
  }

  // ---------- Rendering ----------
  const CY = 0.56;
  const sxOf = (x) => W * camK + (x - camX) * ppm;
  const syOf = (y) => H * CY - (y - camY) * ppm;
  function rr(x, y, w, h, r, g) { g = g || ctx; g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
  function txt(t, x, y, size, color, align, weight) { ctx.font = `${weight || 900} ${size}px system-ui, sans-serif`; ctx.textAlign = align || 'left'; ctx.fillStyle = color; ctx.fillText(t, x, y); }
  function banner(text, color, y, size, x) {
    x = x ?? W / 2;
    size = size || Math.min(W * 0.1, 56);
    ctx.font = `900 ${size}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = size * 0.16; ctx.strokeStyle = '#1b1530'; ctx.lineJoin = 'round';
    ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y);
  }
  const theme = () => THEMES[island().theme];

  function drawBackground() {
    const th = theme();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const m = Math.min(W, H);
    if (th.night) {
      for (let i = 0; i < 70; i++) { ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.5 * Math.abs(Math.sin(time + i))})`; ctx.fillRect(hash(i) * W, hash(i + 50) * H * 0.5, 2, 2); }
    }
    ctx.fillStyle = th.sun; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(W * 0.78, H * 0.16, m * 0.08, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    for (let i = 0; i < 5; i++) {
      const cx = ((hash(i) * 1600 - camX * ppm * 0.05 + time * 8) % (W + 300) + W + 300) % (W + 300) - 150, cy = H * (0.08 + hash(i + 9) * 0.25);
      ctx.beginPath(); ctx.ellipse(cx, cy, 46, 13, 0, 0, 7); ctx.ellipse(cx + 24, cy - 8, 26, 12, 0, 0, 7); ctx.fill();
    }
    const horizon = H * 0.48 + clamp(camY * ppm * 0.04, -40, 40);
    ctx.fillStyle = th.far;
    for (let i = -1; i < 6; i++) { // distant islands
      const span = 420, off = ((camX * ppm * 0.06) % span), x = i * span - off + hash(i + Math.floor(camX * ppm * 0.06 / span)) * 80;
      ctx.beginPath(); ctx.ellipse(x, horizon, 120, 34 + hash(i * 3 + Math.floor(camX * ppm * 0.06 / span)) * 30, 0, Math.PI, 0); ctx.fill();
    }
    ctx.fillStyle = th.sea; ctx.fillRect(0, horizon, W, H - horizon);
    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (let i = 0; i < 12; i++) { const x = ((i * 97 - camX * ppm * 0.1 + time * 10) % W + W) % W; ctx.fillRect(x, horizon + 8 + (i % 4) * 14, 30, 2); }
  }

  function drawPalm(x) {
    const y = hAt(x), s = 0.8 + hash(x) * 0.5;
    ctx.save(); ctx.translate(sxOf(x), syOf(y - 0.2)); ctx.scale(ppm * s, -ppm * s);
    ctx.strokeStyle = '#8a5a2b'; ctx.lineWidth = 0.28; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(0.6, 2, 0.3, 3.8); ctx.stroke();
    ctx.fillStyle = '#2f9a45';
    for (let i = 0; i < 5; i++) {
      const a = -0.2 + i * 0.85 + Math.sin(time * 1.5 + x) * 0.05;
      ctx.save(); ctx.translate(0.3, 3.8); ctx.rotate(a);
      ctx.beginPath(); ctx.ellipse(0.9, 0, 1, 0.22, 0.3, 0, 7); ctx.fill(); ctx.restore();
    }
    ctx.restore();
  }

  function drawTerrain() {
    const th = theme();
    const x0 = camX - (W * camK) / ppm - 2, x1 = camX + (W * (1 - camK)) / ppm + 2;
    // decor behind the ground
    for (let k = Math.floor(x0 / 37); k <= Math.ceil(x1 / 37); k++) { const x = k * 37 + hash(k) * 20; if (hash(k + 7) < 0.55 && x > 3) drawPalm(x); }
    const step = Math.max(STEP, 3 / ppm);
    ctx.beginPath(); ctx.moveTo(sxOf(x0), H + 10);
    for (let x = x0; x <= x1; x += step) ctx.lineTo(sxOf(x), syOf(hAt(x)));
    ctx.lineTo(sxOf(x1), H + 10); ctx.closePath();
    const g = ctx.createLinearGradient(0, syOf(camY), 0, syOf(camY) + H * 0.6);
    g.addColorStop(0, th.dirt); g.addColorStop(1, th.dirt2);
    ctx.fillStyle = g; ctx.fill();
    // dirt speckles
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    for (let k = Math.floor(x0 / 2); k <= x1 / 2; k++) { const x = k * 2 + hash(k) * 1.5; ctx.beginPath(); ctx.arc(sxOf(x), syOf(hAt(x) - 0.8 - hash(k + 3) * 3), ppm * 0.14, 0, 7); ctx.fill(); }
    ctx.lineJoin = 'round';
    for (const [lw, col, dy] of [[0.55, th.grass2, 0.1], [0.32, th.grass, 0]]) {
      ctx.beginPath();
      for (let x = x0; x <= x1; x += step) { const sx = sxOf(x), sy = syOf(hAt(x)) + dy * ppm; x === x0 ? ctx.moveTo(sx, sy) : ctx.lineTo(sx, sy); }
      ctx.lineWidth = lw * ppm; ctx.strokeStyle = col; ctx.stroke();
    }
    if (!me) return;
    // checkpoints and finish
    for (let k = Math.ceil((x0 - 6) / CP); k <= (x1 - 6) / CP; k++) {
      const x = k * CP + 6; if (x <= 6 || Math.abs(x - FINISH) < 30) continue;
      const sx = sxOf(x), sy = syOf(hAt(x));
      ctx.fillStyle = '#5a3a1f'; ctx.fillRect(sx - 2, sy - 2.6 * ppm, 4, 2.6 * ppm);
      ctx.fillStyle = x <= me.cp ? '#36c46b' : '#e8364f';
      ctx.beginPath(); ctx.moveTo(sx + 2, sy - 2.6 * ppm); ctx.lineTo(sx + 2 + ppm * 0.9, sy - 2.3 * ppm + Math.sin(time * 6) * 2); ctx.lineTo(sx + 2, sy - 2 * ppm); ctx.fill();
      ctx.textBaseline = 'middle'; txt(`${x - 6}m`, sx, sy - 3 * ppm, Math.max(10, ppm * 0.4), 'rgba(255,255,255,.85)', 'center', 800);
    }
    if (FINISH > x0 - 5 && FINISH < x1 + 5) {
      const sx = sxOf(FINISH), sy = syOf(hAt(FINISH)), hh = 5 * ppm, bw = 0.6 * ppm;
      ctx.fillStyle = '#f2f2f2'; ctx.fillRect(sx - 3.4 * ppm, sy - hh, 6, hh); ctx.fillRect(sx + 3.4 * ppm - 6, sy - hh, 6, hh);
      for (let i = 0; i < 12; i++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (i + j) % 2 ? '#111' : '#fff'; ctx.fillRect(sx - 3.4 * ppm + i * (6.8 * ppm / 12), sy - hh + j * bw / 2, 6.8 * ppm / 12 + 0.5, bw / 2 + 0.5); }
      ctx.textBaseline = 'middle'; txt('FINISH', sx, sy - hh - 0.5 * ppm, Math.max(12, ppm * 0.6), '#fff', 'center');
    }
  }

  function drawPickups() {
    const x0 = camX - (W * camK) / ppm - 2, x1 = camX + (W * (1 - camK)) / ppm + 2;
    for (const p of pickups) {
      if (p.taken || p.x < x0 || p.x > x1) continue;
      const sx = sxOf(p.x), sy = syOf(p.y + Math.sin(time * 3 + p.x) * 0.12), r = ppm * 0.38;
      if (p.type === 'coin') {
        const sq = Math.abs(Math.cos(time * 2 + p.x * 0.3)), [dk, lt] = COIN_COLORS[p.tier], cw = r * (0.25 + 0.75 * sq);
        ctx.fillStyle = dk; ctx.beginPath(); ctx.ellipse(sx, sy, cw, r, 0, 0, 7); ctx.fill();
        ctx.fillStyle = lt; ctx.beginPath(); ctx.ellipse(sx, sy, cw * 0.78, r * 0.78, 0, 0, 7); ctx.fill();
        if (sq > 0.55) { ctx.textBaseline = 'middle'; txt(String(COIN_VALUES[p.tier]), sx, sy + 1, r * (p.tier > 1 ? 0.75 : 0.95), 'rgba(60,30,0,.85)', 'center'); }
      } else if (p.type === 'meat') {
        ctx.save(); ctx.translate(sx, sy); ctx.rotate(-0.5); ctx.scale(r / 10, r / 10);
        ctx.fillStyle = '#f4f0e6'; rr(4, -3, 16, 6, 3); ctx.fill(); ctx.beginPath(); ctx.arc(20, -4, 4, 0, 7); ctx.arc(20, 4, 4, 0, 7); ctx.fill();
        ctx.fillStyle = '#b5532c'; ctx.beginPath(); ctx.ellipse(-4, 0, 13, 10, 0, 0, 7); ctx.fill();
        ctx.fillStyle = '#d97a45'; ctx.beginPath(); ctx.ellipse(-7, -3, 6, 4, -0.4, 0, 7); ctx.fill();
        ctx.restore();
      } else {
        ctx.save(); ctx.translate(sx, sy); ctx.scale(r / 10, r / 10);
        ctx.fillStyle = '#8b3fd1'; ctx.beginPath(); ctx.arc(0, 2, 12, 0, 7); ctx.fill();
        ctx.strokeStyle = '#d6a6ff'; ctx.lineWidth = 2; ctx.beginPath();
        for (let a = 0; a < 12; a += 0.3) { const rad = a * 0.9; ctx.lineTo(Math.cos(a) * rad, 2 + Math.sin(a) * rad); } ctx.stroke();
        ctx.fillStyle = '#3c9a3a'; ctx.beginPath(); ctx.ellipse(4, -11, 6, 2.5, -0.5, 0, 7); ctx.fill();
        ctx.restore();
      }
    }
  }

  // Vehicle + pirate in local meters (y up, origin = chassis center). g already has the world transform.
  function drawCar(g, carId, hatId, wr, o) {
    o = o || {};
    const lw = 0.07, out = '#2a1a10';
    g.lineJoin = 'round'; g.lineCap = 'round';
    const shape = (pts, fill) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fillStyle = fill; g.fill(); g.lineWidth = lw; g.strokeStyle = out; g.stroke(); };
    const ell = (x, y, rx, ry, fill, stroke) => { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, 7); g.fillStyle = fill; g.fill(); if (stroke !== false) { g.lineWidth = lw; g.strokeStyle = out; g.stroke(); } };
    // struts
    g.strokeStyle = '#5a5a5a'; g.lineWidth = 0.1;
    g.beginPath(); g.moveTo(-AX, -AY); g.lineTo(-AX + 0.2, -0.1); g.moveTo(AX, -AY); g.lineTo(AX - 0.2, -0.1); g.stroke();
    // body behind the driver (masts, fins)
    if (carId === 'ship') {
      g.fillStyle = '#7a4a22'; g.fillRect(0.55, 0.2, 0.12, 1.5);
      shape([[0.7, 1.6], [0.7, 0.55], [1.45, 0.65]], '#fdf8ea');
      shape([[0.67, 1.7], [0.67, 1.95], [1.05, 1.82]], '#222');
    } else if (carId === 'shark') {
      shape([[0.3, 0.3], [0.75, 1.05], [1.05, 0.3]], '#4d6f96');
    }
    // driver
    g.fillStyle = '#d8343f'; rr(-0.42, 0.15, 0.5, 0.62, 0.12, g); g.fill(); g.lineWidth = lw; g.strokeStyle = out; g.stroke();
    const sh = [-0.05, 0.62];
    let fx = 0.45, fy = 0.4;
    if (o.punch > 0) { fx = sh[0] + Math.cos(o.punchA) * o.punch; fy = sh[1] + Math.sin(o.punchA) * o.punch; }
    g.strokeStyle = '#f3c18c'; g.lineWidth = 0.13; g.beginPath(); g.moveTo(sh[0], sh[1]); g.lineTo(fx, fy); g.stroke();
    ell(fx, fy, o.punch > 0 ? 0.22 : 0.1, o.punch > 0 ? 0.22 : 0.1, '#f3c18c');
    ell(HEAD[0], HEAD[1], 0.3, 0.3, '#f3c18c');
    g.fillStyle = out; g.beginPath(); g.arc(-0.02, 1.07, 0.045, 0, 7); g.fill();
    g.beginPath(); g.arc(-0.05, 0.95, 0.12, Math.PI * 1.1, Math.PI * 1.9); g.lineWidth = 0.04; g.stroke();
    drawHat(g, hatId);
    // chassis
    if (carId === 'cart') {

  function drawWorldCar(x, y, a, carId, hatId, wr, alpha, o) {
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.translate(sxOf(x), syOf(y)); ctx.scale(ppm, -ppm); ctx.rotate(a);
    drawCar(ctx, carId, hatId, wr, o);
    ctx.restore();
  }
  function ghostPose(x) {
    const yl = hAt(x - AX), yr = hAt(x + AX), a = Math.atan2(yr - yl, 2 * AX);
    return { y: (yl + yr) / 2 + (AY + WR) / Math.cos(a) - 0.06 + Math.abs(Math.sin(time * 9 + x)) * 0.04, a };
  }
  function nameTag(sx, sy, text, mine) {

    const tw = ctx.measureText(text).width + 12;

    ctx.fillStyle = mine ? 'rgba(54,196,107,.95)' : 'rgba(15,20,40,.6)'; rr(sx - tw / 2, sy - sz * 0.8, tw, sz * 1.6, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(text, sx, sy);
  }
  function drawBots() {
    const xl = camX - (W * camK) / ppm, xr = camX + (W * (1 - camK)) / ppm;
    for (const b of bots) {
      const label = `${b.avatar ? b.avatar + ' ' : ''}${b.name}`;
      if (b.x > xl - 2 && b.x < xr + 2) {
        const p = ghostPose(b.x);
        drawWorldCar(b.x, p.y, p.a, b.carId, b.hatId, -b.x / WR, 0.45);
        nameTag(sxOf(b.x), syOf(p.y + 2), label, false);
      } else if (phase === 'play') { // off-screen arrow with the gap
        const ahead = b.x > xr, d = Math.round(Math.abs(b.x - me.car.x));
        const sx = ahead ? W - 52 : 52, sy = H * 0.3 + b.bias * 26;
        nameTag(sx, sy, `${ahead ? '' : '◀ '}${b.name} ${ahead ? '+' : '-'}${d}m${ahead ? ' ▶' : ''}`, false);
      }
    }
  }

  function drawShip() {
    const s = ship;
    ctx.save(); ctx.translate(sxOf(s.x), syOf(s.y)); ctx.scale(ppm, -ppm); ctx.rotate(s.a);
    const g = ctx, out = '#1c2438';
    g.lineJoin = 'round'; g.lineWidth = 0.12; g.strokeStyle = out;
    const shape = (pts, fill) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fillStyle = fill; g.fill(); g.stroke(); };
    // wave it rides on
    g.fillStyle = '#2f8fd8'; g.beginPath(); g.moveTo(-6.5, -2);
    for (let x = -6.5; x <= 6.5; x += 0.5) g.lineTo(x, 0.3 + Math.sin(x * 1.3 + time * 6) * 0.25 - (Math.abs(x) > 5 ? (Math.abs(x) - 5) * 0.8 : 0));
    g.lineTo(6.5, -2); g.closePath(); g.fill();
    g.fillStyle = '#e6f6ff'; for (let x = -6; x <= 6; x += 1.3) { g.beginPath(); g.arc(x, 0.35 + Math.sin(x * 1.3 + time * 6) * 0.25, 0.22, 0, 7); g.fill(); }

    g.fillStyle = 'rgba(80,80,90,.55)';
    for (let i = 0; i < 4; i++) { const k = (time * 0.8 + i / 4) % 1; g.beginPath(); g.arc(-2.6 - k * 2, 5.4 + k * 2.5, 0.4 + k * 0.7, 0, 7); g.fill(); }

    g.fillStyle = '#6b4a2a'; g.fillRect(0.6, 2.2, 0.22, 4.6);
    shape([[-0.8, 6.2], [2.4, 6.2], [2.1, 3.4], [-0.6, 3.4]], '#fdfcf6');

    g.strokeStyle = '#fdfcf6'; g.lineWidth = 0.14; g.beginPath(); g.moveTo(0.75, 5.25); g.lineTo(0.75, 4.35); g.moveTo(0.45, 4.95); g.lineTo(1.05, 4.95); g.arc(0.75, 4.6, 0.32, 0.3, Math.PI - 0.3); g.stroke();

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawBackground();
    const sx = shake ? rnd(-shake, shake) : 0, sy = shake ? rnd(-shake, shake) : 0;
    ctx.save(); ctx.translate(sx, sy);
    drawTerrain();
    if (me) {
      drawPickups();
      if (ship) drawShip();
      for (const b of balls) {
        const k = Math.min(1, b.t / b.dur), x = lerp(b.x0, b.x1, k), y = lerp(b.y0, b.y1, k) + Math.sin(k * Math.PI) * 5;
        ctx.fillStyle = '#1b1b22'; ctx.beginPath(); ctx.arc(sxOf(x), syOf(y), ppm * 0.32, 0, 7); ctx.fill();
        ctx.fillStyle = '#ff8a2b'; ctx.beginPath(); ctx.arc(sxOf(x) - ppm * 0.35, syOf(y) + ppm * 0.1, ppm * 0.14, 0, 7); ctx.fill();
      }
      drawBots();
      const c = me.car;
      let o = null;
      if (me.punchT >= 0 && ship) {
        const ang = Math.atan2(ship.y + 3 - (c.y + 0.6), ship.x + 3 - c.x) - c.a;
        const reach = Math.hypot(ship.x + 3 - c.x, ship.y + 3 - c.y);
        o = { punch: Math.sin(Math.PI * clamp(me.punchT / 0.34, 0, 1)) * reach, punchA: ang };
      }
      drawWorldCar(c.x, c.y, c.a, me.carId, me.hatId, c.wr, me.crashT > 0 && me.crashT < 0.5 ? me.crashT * 2 : 1, o);
      if (me.boost > 0) for (let i = 0; i < 2; i++) parts.push({ x: c.x - 1.4, y: c.y + rnd(-0.2, 0.4), vx: rnd(-3, -1), vy: rnd(0, 1), t: 0, life: 0.4, c: '#d18bff', r: 0.12 });
      if (phase === 'play' && elapsed < 6) nameTag(sxOf(c.x), syOf(c.y + 2.2), T.you, true);
    } else if (demo) {
      drawWorldCar(demo.x, demo.y, demo.a, save.eq.cars, save.eq.hats, demo.wr, 1);
    }
    for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(sxOf(p.x), syOf(p.y), p.r * ppm, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (me && phase !== 'result') drawHud();
  }

  function drawTrack(y, sc) {
    const x0 = 16, x1 = W - 16, h = 10 * sc;
    ctx.fillStyle = 'rgba(15,20,40,.6)'; rr(x0 - 4, y - 4, x1 - x0 + 8, h + 8, 9); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.15)'; rr(x0, y, x1 - x0, h, 5); ctx.fill();
    const kx = (p) => x0 + (x1 - x0 - 14) * clamp(shownPos(p) / FINISH, 0, 1);
    ctx.fillStyle = '#36c46b'; rr(x0, y, Math.max(h, kx(me) - x0 + 6), h, 5); ctx.fill();
    ctx.font = `${12 * sc}px system-ui`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.fillText('🏁', x1 + 2, y + h / 2);
    for (const b of bots) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(kx(b) + 6, y + h / 2, 5 * sc, 0, 7); ctx.fill(); ctx.strokeStyle = '#1b1530'; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.fillStyle = '#36c46b'; ctx.beginPath(); ctx.arc(kx(me) + 6, y + h / 2, 8 * sc, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    return y + h + 8;
  }

  function drawHud() {
    ctx.textBaseline = 'middle';
    const sc = clamp(Math.min(W, H) / 420, 0.8, 1.3);
    const bossMode = phase === 'boss' || phase === 'win';
    let y = 18;
    if (!bossMode) {
      y = drawTrack(18, sc) + 6;
      const rank = ranking().indexOf(me) + 1;
      ctx.fillStyle = rank === 1 ? '#ffc531' : 'rgba(15,20,40,.75)'; rr(12, y, 70 * sc, 36 * sc, 12); ctx.fill();
      txt(`#${rank}`, 12 + 26 * sc, y + 19 * sc, 22 * sc, rank === 1 ? '#3a1c06' : '#fff', 'center');
      txt('/5', 12 + 52 * sc, y + 21 * sc, 12 * sc, rank === 1 ? '#3a1c06' : 'rgba(255,255,255,.7)', 'center', 800);
      const left = Math.max(0, Math.round(FINISH - me.car.x));
      if (phase === 'play') txt(`${left} ${T.toGo}`, W / 2, y + 18 * sc, 13 * sc, '#fff', 'center', 800);
    } else if (ship) {
      const bw = Math.min(W - 40, 420), bx = (W - bw) / 2;
      ctx.font = `900 ${15 * sc}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#1b1530';
      ctx.strokeText(`⚓ ${ship.name}`, W / 2, y + 4); txt(`⚓ ${ship.name}`, W / 2, y + 4, 15 * sc, '#fff', 'center');
      ctx.fillStyle = '#1b1530'; rr(bx, y + 16, bw, 18 * sc, 9); ctx.fill();
      ctx.fillStyle = '#e8364f'; rr(bx + 3, y + 19, Math.max(0, (bw - 6) * ship.hp / ship.hpMax), 18 * sc - 6, 6); ctx.fill();
      txt(`${Math.ceil(ship.hp)} / ${ship.hpMax}`, W / 2, y + 16 + 9 * sc, 11 * sc, '#fff', 'center');
      y += 26 + 18 * sc;
    }
    // coins (right)
    const ct = fmt(me.coins);
    ctx.font = `900 ${15 * sc}px system-ui`;
    const cw = ctx.measureText(ct).width + 40 * sc;
    ctx.fillStyle = 'rgba(15,20,40,.75)'; rr(W - 12 - cw, y, cw, 30 * sc, 15 * sc); ctx.fill();
    ctx.fillStyle = '#ffc531'; ctx.beginPath(); ctx.arc(W - 12 - cw + 16 * sc, y + 15 * sc, 9 * sc, 0, 7); ctx.fill();
    txt(ct, W - 22, y + 16 * sc, 15 * sc, '#fff', 'right');
    // meat gauge
    const my = y + 40 * sc, st = carStats(), k = me.meat / st.tank;
    ctx.font = `${16 * sc}px system-ui`; ctx.textAlign = 'left'; ctx.fillText('🍖', 12, my + 8 * sc);
    ctx.fillStyle = 'rgba(15,20,40,.7)'; rr(36 * sc, my, 90 * sc, 14 * sc, 7); ctx.fill();
    ctx.fillStyle = k < 0.25 ? (Math.sin(time * 10) > 0 ? '#e8364f' : '#ff8a2b') : '#ffb35c'; rr(36 * sc + 2, my + 2, Math.max(0, (90 * sc - 4) * k), 14 * sc - 4, 5); ctx.fill();
    // feed
    let fy = my + 24 * sc;
    for (const f of feed) {
      ctx.globalAlpha = Math.max(0, 1 - f.t / 4);
      ctx.font = `700 ${11 * sc}px system-ui, sans-serif`;
      const tw = Math.min(ctx.measureText(f.text).width + 14, W - 24);
      ctx.fillStyle = f.mine ? 'rgba(54,196,107,.9)' : 'rgba(15,20,40,.6)'; rr(12, fy, tw, 20 * sc, 7); ctx.fill();
      txt(f.text, 19, fy + 10 * sc, 11 * sc, '#fff', 'left', 700);
      fy += 24 * sc;
    }
    ctx.globalAlpha = 1;
    if (phase === 'play') {
      txt(`● ${38 + Math.round(Math.sin(time * 0.7) * 6 + Math.sin(time * 2.3) * 3)} ms`, W / 2, isPc ? H - 62 : H - 12, 11, 'rgba(255,255,255,.55)', 'center', 700);
      if (elapsed < 1.6) banner(T.go, '#36c46b', H * 0.3);
      if (!goSfx) { goSfx = true; sfx.go(); }
      else if (elapsed < 5 && me.car.x < 20) banner(isPc ? T.ctlHintPc : T.ctlHint, '#fff', H * 0.4, Math.min(W * 0.05, 22));
    }
    if (phase === 'bossIntro') { const t = 1 - introT / 2.6; banner(t < 0.45 ? T.bossIn : T.bossIn2, t < 0.45 ? '#ffc531' : '#e8364f', H * 0.3); }
    if (phase === 'win') banner(T.won, '#ffc531', H * 0.33);
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, 1.7 - p.t * 1.4);
      const foe = p.where === 'boss';
      banner(p.text, p.color, H * (foe ? 0.36 : 0.44) - p.t * 40, Math.min(W * 0.06, 28), foe ? W * 0.3 : W / 2);
    }
    ctx.globalAlpha = 1;
    ctx.textBaseline = 'alphabetic';
  }

  function frame(t) {
    const dt = Math.min((t - lastT) / 1000 || 0, 0.05);
    lastT = t;
    if (!paused) update(dt);
    render();
    engineSound();
    requestAnimationFrame(frame);
  }

  // ---------- Touch controls ----------
  const $ = (id) => document.getElementById(id);
  let lastPunchP = -1, isPc = false;
  function syncControls() {
    const on = me && (phase === 'play' || phase === 'bossIntro' || phase === 'boss' || phase === 'win');

    toMenu();
    requestAnimationFrame(t => {
      lastT = t; render();
      send('game_ready');
      requestAnimationFrame(frame);
    });
  }

  boot();
})();
</script>
